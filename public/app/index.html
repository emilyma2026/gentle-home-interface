/* =====================================================================
   3d. AI：统一走服务端 /api/ai，key 不进浏览器。
       请求携带 Supabase 会话，服务端校验后才调用模型。
   ===================================================================== */
var AI={ endpoint:"/api/ai", provider:null, lastError:null };

function aiAccessToken(){
  if(!SupabaseClient || !SupabaseClient.auth || typeof SupabaseClient.auth.getSession!=="function") return Promise.resolve("");
  return Promise.resolve(SupabaseClient.auth.getSession()).then(function(result){
    return result&&result.data&&result.data.session&&result.data.session.access_token||"";
  });
}

function aiAsk(opts){
  var ctrl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, opts.timeout || 15000);
  return aiAccessToken().then(function(token){
    if(!token) throw new Error("AI_AUTH_REQUIRED");
    return fetch(AI.endpoint,{
      method:"POST",
      headers:{"content-type":"application/json","authorization":"Bearer "+token},
      body:JSON.stringify({ system:opts.system, user:opts.user, json:!!opts.json }),
      signal: ctrl ? ctrl.signal : undefined
    });
  }).then(function(r){
    if(!r.ok) throw new Error("AI_HTTP_"+r.status);
    return r.json();
  }).then(function(d){
    AI.provider=d.provider||null; AI.lastError=null;
    return (d && typeof d.text==="string") ? d.text : null;
  }).catch(function(e){
    AI.lastError=String(e && e.message || e);
    return null;
  }).finally(function(){ clearTimeout(timer); });
}

/* 模型偶尔会在 JSON 外面包一层反引号，这里容错解析 */
function aiJSON(text){
  if(!text) return null;
  var t=String(text).trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
  try{ return JSON.parse(t); }catch(_e){}
  var a=t.indexOf("{"), b=t.lastIndexOf("}");
  if(a>=0 && b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(_e2){} }
  return null;
}

/* =====================================================================
   3e. 语音转写：只保留真实识别结果，不自动注入示例内容
   ===================================================================== */
var Speech={ rec:null, active:false };
function speechSupported(){
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}
function startSpeech(onText, onFail){
  var Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Ctor){ onFail("nomic"); return false; }
  try{
    var rec=new Ctor();
    rec.lang = (St && St.lang==="en") ? "en-US" : "zh-CN";
    rec.interimResults=true; rec.continuous=true; rec.maxAlternatives=1;
    var buf="";
    rec.onresult=function(ev){
      var interim="";
      for(var i=ev.resultIndex;i<ev.results.length;i++){
        var r=ev.results[i];
        if(r.isFinal) buf += r[0].transcript;
        else interim += r[0].transcript;
      }
      onText(buf+interim, false);
    };
    rec.onerror=function(){ Speech.active=false; onFail("error"); };
    rec.onend=function(){ Speech.active=false; onText(buf, true); };
    Speech.rec=rec; Speech.active=true;
    rec.start();
    return true;
  }catch(_e){ onFail("error"); return false; }
}
function stopSpeech(){
  try{ if(Speech.rec && Speech.active) Speech.rec.stop(); }catch(_e){}
  Speech.active=false;
}

/* =====================================================================
   3f. 定位：老人端上报自己的真实位置，家人端只读。
       没有授权或拿不到定位时保持上一次的位置，不伪造。
   ===================================================================== */
var Geo={ watchId:null, lastAt:0, denied:false };

function startGeo(){
  if(Geo.watchId!==null || !navigator.geolocation) return;
  Geo.watchId = navigator.geolocation.watchPosition(function(pos){
    var now=Date.now();
    if(now - Geo.lastAt < 8000) return;
    var next={ lat:pos.coords.latitude, lng:pos.coords.longitude };
    if(!St) return;
    /* 没挪动就不写库，省掉无意义的同步 */
    if(St.locReported && haversine(locOf(St), next) < 12) return;
    Geo.lastAt=now; Geo.denied=false;
    queueUpdate(function(s){
      s.loc=next; s.locReported=true; s.locAt=now;
      if(!s.guide.active && !s.guide.done && distOf(s) > rangeM(s)){
        requestBoundaryAlert(s);
        s.timeline.push({ t:clockNow(), date:todayKey(), kind:"guide" });
      }
    });
  }, function(){
    Geo.denied=true;
  }, { enableHighAccuracy:true, maximumAge:15000, timeout:20000 });
}
function stopGeo(){
  if(Geo.watchId!==null && navigator.geolocation) navigator.geolocation.clearWatch(Geo.watchId);
  Geo.watchId=null;
}

/* 老人问了记忆里没有的问题，等家人补一句。放在首页，家人一进来就看到。 */
/* 同一个问题她可能问很多次，家人只需要看到一条，次数作为附注。 */
function pendingGrouped(){
  var order=[], groups={};
  for(var i=0;i<St.pending.length;i++){
    var p=St.pending[i], question=pendingQuestion(p);
    var key=p.question ? "text:"+question.trim().toLowerCase() : "ask:"+p.ask;
    if(!groups[key]){
      groups[key]={ id:p.id, ask:p.ask, question:question, n:0 };
      order.push(key);
    }
    groups[key].n++;
  }
  return order.map(function(key){ return groups[key]; });
}

function pendingQuestion(p){
  if(p && p.question) return p.question;
  return p && p.ask!=null ? D.asks[p.ask] : "";
}

           guide:"tlGuide",home:"tlHome",todo:"tlTodo",answered:"tlAnswered"};

function callDir(s){ return (s && s.call && s.call.dir==="out") ? "out" : "in"; }
function callActive(s){
  var phase=s&&s.call?s.call.phase:"idle";
  return phase==="ringing"||phase==="talking";
}
function newCallId(){ return "call"+Date.now()+Math.floor(Math.random()*1000); }
function beginSharedCall(s,personId,dir,id){
  if(callActive(s)) return false;
  s.call={ id:id, phase:"ringing", personId:personId||null, line:-1, dir:dir };
  if(personId) s.lastCaller=personId;
  return true;
}
function isSameCall(s,snapshot){
  if(!s||!s.call||!snapshot) return false;
  if(snapshot.id) return s.call.id===snapshot.id;
  return s.call.personId===snapshot.personId&&s.call.dir===snapshot.dir;
}

function enforceEmbeddedRole(){
  if(!EMBED_ROLE||!St||!Connection.authenticated) return;
  App.paired=false;
  App.route=EMBED_ROLE==='elder'?'elder':(!St.setup?'obElder':App.route==='obMe'?'obMe':'family');
  App.joinAs=EMBED_ROLE;
}
function requestBoundaryAlert(s){
  if(s.guide.active) return;
  s.guide.pending=true; s.guide.active=false; s.guide.done=false; s.guide.step=0;
  s.risk=s.risk||{}; s.risk.state='leaving'; s.risk.reason='outside_safe_radius';
  s.alertCleared=false;
}

  return '<div class="sheet-mask"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="boundaryTitle" data-stop="1">'
    + '<h3 id="boundaryTitle">'+(en?'You are outside your familiar area':'您已走出熟悉的范围')+'</h3>'

    + '<div class="map-card">'+mapBox('view')+'</div>'
    + '<p class="e-copy" style="font-size:15px">'+(en?'This alert syncs to your family’s app when connected.':'连接正常时，越界提醒会同步到家人端。')+'</p>'
    + '<button class="e-btn" data-go="confirmBoundary">'+(en?'Guide me home & notify family':'导航回家并提醒家人')+'</button>'
    + '<button class="e-btn soft" data-go="openPick">'+(en?'Call family first':'先联系家人')+'</button>'
    + (St.demoScenario==='singapore'?'<button class="link" data-go="goHome">'+(en?'Demo: reset home location':'演示：恢复到家位置')+'</button>':'')+'</section></div>';
}
async function confirmBoundaryNavigation(){
  if(App.boundarySaving) return;
  if(!homePoint(St)||!currentPoint(St)){ showNotice(St.lang==='en'?'Home and current location are needed.':'需要先确认家的位置和当前位置。'); return; }
  App.boundarySaving=true;
  try{
    await persistUpdate(function(s){
      if((!s.guide.pending&&!App.boundarySyncFailed)||!isOut(s)) return;
      s.guide.pending=false; s.guide.active=true; s.guide.done=false; s.guide.step=0;
      s.risk=s.risk||{}; s.risk.state='guiding'; s.alertCleared=false;
      s.risk.familyNotifiedAt=new Date().toISOString();
    });
    App.qa=false; App.pick=false; App.eset=false;
    App.guideRouteRequested=false; App.guideRouteStatus='idle'; App.guideRouteError='';
    App.boundarySyncFailed=false;
  }catch(_error){ App.boundarySyncFailed=true; showNotice(St.lang==='en'?'Could not sync with family. Please retry.':'暂时无法同步给家人，请重试。'); }
  finally{ App.boundarySaving=false; render(); }
}

function elderScreen(){
  if(App.paired) return "paired";
  if(St.call.phase==="ringing") return callDir(St)==="out" ? "calling" : "ringing";
  if(St.call.phase==="talking") return "talking";
  if((St.guide.pending || App.boundarySaving || App.boundarySyncFailed) && !App.pick && isOut(St)) return "boundary";
  if(St.guide.active) return "guide";
  if(St.guide.done) return "arrived";
  if(App.pick) return "pick";
  if(App.qa) return "qa";
  if(App.eset) return "esettings";
  return "standby";
}

/* 已确认的待办里，最近一条还没做完的；全做完后不再继续挂在老人首页。 */
function todayTodo(){ return todayTodoOf(St); }
function todayNews(){
  for(var i=St.facts.length-1;i>=0;i--){
    var f=St.facts[i];
    if(f.type==="fact" && f.status==="done") return f;
  }
  return null;
}
function factLine(f){
  if(f.type==="todo") return todoLine(f);
  return f.text!=null ? f.text : tp(D[f.key]);
}
/* 待办由时间、地点、事情三段组成，缺哪段就跳过哪段 */
function todoLine(t){
  var parts=[t.when, t.where, t.what].filter(function(v){ return v && String(v).trim(); });
  if(parts.length) return parts.join(" · ");
  return t.text!=null ? t.text : (t.key&&D[t.key]?tp(D[t.key]):"");
}
function todoWhat(t){
  if(t.what && t.what.trim()) return t.what.trim();
  return t.text!=null ? t.text : (t.key&&D[t.key]?tp(D[t.key]):"");
}
function elderTodoText(t){
  if(!t) return "";
  if(t.key==="factPill" && D.elderFactPill) return D.elderFactPill;
  var text=todoWhat(t).trim();
  if(!text) return text;
  var elder=St && St.elder ? String(St.elder.name||"").trim() : "";
  if(elder){
    var safe=elder.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    text=text.replace(new RegExp("^remind\\s+"+safe+"\\s+to\\s+","i"),"");
  }
  text=text.replace(/^remind\s+(?:mom|mum|mother|dad|father|her|him|\S+)\s+to\s+/i,"");
  text=text.replace(/\b(?:her|his)\b/gi,"your");
  return text ? text.charAt(0).toUpperCase()+text.slice(1) : text;
}
function todoMeta(t){
  return [t.when, t.where].filter(function(v){ return v && String(v).trim(); }).join(" · ");
}
/* ---- 日期工具：全部用 YYYY-MM-DD 字符串比较，避免时区问题 ---- */
function pad2(n){ return (n<10?"0":"")+n; }
function keyOf(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function todayKey(){ var p=elderNowParts(); return p.year+"-"+pad2(p.month)+"-"+pad2(p.day); }
function keyParts(k){ var a=String(k||"").split("-"); return {y:+a[0], m:+a[1], d:+a[2]}; }
function ymOf(k){ var p=keyParts(k); return p.y+"-"+pad2(p.m); }
function shiftMonth(ym, delta){
  var a=String(ym).split("-"), y=+a[0], m=+a[1]-1+delta;
  y += Math.floor(m/12); m=((m%12)+12)%12;
  return y+"-"+pad2(m+1);
}
function monthCells(ym){
  var a=String(ym).split("-"), y=+a[0], m=+a[1]-1;
  var first=new Date(y,m,1), start=new Date(y,m,1-first.getDay());
  var out=[];
  for(var i=0;i<42;i++){
    var d=new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
    out.push({ key:keyOf(d), day:d.getDate(), inMonth:d.getMonth()===m });
    if(i>=34 && d.getMonth()!==m && (i+1)%7===0) break;
  }
  return out;
}

/* ---- 待办：日期、重复、按天完成 ---- */
function todoDate(t){ return t.date || todayKey(); }
function todoOccursOn(t, key){
  if(t.repeat==="daily") return key >= todoDate(t);
  return todoDate(t)===key;
}
function todoDoneOn(t, key){
  if(t.done && typeof t.done==="object") return !!t.done[key];
  return !!t.checked && todoDate(t)===key;   // 兼容早期只有一个布尔值的数据
}
function todosOn(s, key, includeDraft){
  var member=typeof selectedMemberId==="function"?(selectedMemberId()||""):"";
  var out=[], list=includeDraft ? ((s||St).facts||[]).filter(function(item){
    if(item.type!=="todo") return false;
    if(item.status==="done") return true;
    return item.status==="draft"&&(!item.ownerId||item.ownerId===member);
  }) : allTodos(s||St);
  for(var i=0;i<list.length;i++) if(todoOccursOn(list[i], key)) out.push(list[i]);
  return out;
}
function markTodoDone(s, id, key, value){
  for(var i=0;i<s.facts.length;i++){
    if(s.facts[i].id!==id) continue;
    var t=s.facts[i];
    if(!t.done || typeof t.done!=="object") t.done={};
    if(value) t.done[key]=true; else delete t.done[key];
    delete t.checked;
    return;
  }
}

  return { id:"t"+Date.now()+Math.floor(Math.random()*100), type:"todo", origin:"manual",

    status:"draft", ownerId:selectedMemberId()||"" };

function allTodos(s){
  var out=[]; var src=(s||St).facts||[];
  for(var i=0;i<src.length;i++) if(src[i].type==="todo" && src[i].status==="done") out.push(src[i]);

/* 老人端「接下来」只显示第一条还没完成的待办；全部完成后立即消失。 */
function todayTodoOf(s){
  var key=todayKey(), list=todosOn(s, key);
  for(var i=0;i<list.length;i++) if(!todoDoneOn(list[i], key)) return list[i];
  return null;
}

function dayParts(){
  var now=elderNowParts(), h=now.hour;
  return {
    week: D.eWeekdays[now.week],
    date: fill(D.eDateFmt,{m:now.month, d:now.day}),
    part: h<12 ? D.eMorning : (h<18 ? D.eAfternoon : D.eEvening)
  };
}

  var d=dayParts(), out=[D.eTodayT+" "+d.date+" "+d.week+" "+d.part];

    return '<div class="visuals-panel">'+illus+pill+photoHtml+'</div>';
  }

    'size=800x500',
    'location='+encodeURIComponent(point.lat+','+point.lng),

  if(routeStep&&routeStep.maneuver&&routeStep.maneuver!=="straight") params.push('fov=100');
  var svUrl='https://maps.googleapis.com/maps/api/streetview?'+params.join('&');

    + '<img class="sv-bg" src="'+esc(svUrl)+'" alt="" loading="lazy" onerror="this.remove()">'
    + photoHtml+'</div>';

function viewGuide(){

  var instruction=routeStep ? guideText(routeStep) : g.copy;
  var landmark=routeStep ? guideLandmark(routeStep) : g.lm;
  var remaining=guideHomeDistance(currentPoint(St));
  var routeNote=App.guideRouteError||(App.guideRouteStatus==="loading"?D.routeLoading:(remaining!==null?fill(D.riskDistance,{n:remaining}):D.eGuideNote));
  var visualsHtml=streetViewVisual(routeStep);

function render(s){
  if(s!==undefined) St=s;
  enforceEmbeddedRole();
  D = I18N[St ? St.lang : lang] || I18N.en;
  syncElderLive();

  var activeEditor=document.activeElement;
  var editingLocally=activeEditor&&activeEditor.matches&&activeEditor.matches("[data-f],[data-todo],[data-item-in]");
  if(typing||editingLocally){ patchLight(); return; }

  var screen=el("screen"), view=el("view"), body="", isElder=false, chrome="";
  el("clock").textContent = clockNow();

  if(EMBED_ROLE && !Connection.authenticated) body='<p class="e-copy" role="status">'+esc(connectionCopy(Connection.state))+'</p>';
  else if(App.route==="entry")       body=viewEntry();
  else if(App.route==="familyStart") body=viewFamilyStart();
  else if(App.route==="obElder")     body=viewObElder();
  else if(App.route==="obMe")        body=viewObMe();
  else if(App.route==="code")        body=viewCode();
  else if(App.route==="join")        body=viewJoin();
  else if(App.route==="elder"){
    isElder=true;
    var sc=elderScreen();
    body = sc==="paired"?viewPaired() : sc==="ringing"?viewRinging() : sc==="calling"?viewCalling()
         : sc==="talking"?viewTalking() : sc==="pick"?viewPick() : sc==="qa"?viewQa()
         : sc==="esettings"?viewESettings()
         : sc==="boundary"?viewStandby()+viewBoundaryAlert()
         : sc==="guide"?viewGuide() : sc==="arrived"?viewArrived() : viewStandby();
  }
  else if(App.route==="family"){
    if(St && St.call.phase==="ringing" && callDir(St)==="out"){ App.tab=0; App.editingPerson=null; }
    if(!App.cal.ym){ App.cal.sel=todayKey(); App.cal.ym=ymOf(App.cal.sel); }
    if(App.chat.open){
      body = chatView();
    } else {
      body = (App.tab===0?tabHome() : App.tab===1?tabAlerts() : App.tab===2?tabTodos() : tabPeople());
    }
    /* 老人走出范围时自动弹一次，关掉之后不再自动弹 */
    var st2=alertState();
    if(st2==="on" && App.alertSeen!=="on"){ App.alertOpen=true; App.alertSeen="on"; }
    if(st2==="none") App.alertSeen="";
    if(App.alertOpen && st2!=="none" && !St.alertCleared) body += alertSheet();
    if(hasPendingCallItem(St)) body += confirmCard();
  }

  if(isElder && !App.demoLocation) startGps();
  else if(!isElder) stopGps();
  screen.classList.toggle("elder", isElder);
  screen.dataset.route = App.route;
  view.classList.toggle("pad0", App.route==="family");
  view.className = (isElder ? "e-view" : "view") + (App.route==="family" ? " pad0" : "");
  view.innerHTML = body;
  if(St&&St.demoScenario==='singapore') view.insertAdjacentHTML('afterbegin','<p class="eyebrow">'+(St.lang==='en'?'Singapore sample · Simulated location':'新加坡示例 · 模拟位置')+'</p>');
  patchLiveTranscript();
  if(App.route==="family" || (isElder && sc==="boundary")) mountMaps();

  /* 家人端底部 tab bar 在 view 之外 */
  var old=screen.querySelector(".tabbar"); if(old) old.remove();
  if(App.route==="family" && !App.editingPerson && !App.chat.open)
    screen.insertAdjacentHTML("beforeend", tabbar());

  /* 手机框外的演示外壳 */
  var lab=el("deviceLabel");
  var who = App.route==="elder" ? D.labelElder : (App.route==="family"||App.route==="obElder"||App.route==="obMe"||App.route==="code" ? D.labelFamily : D.labelEntry);
  lab.className="device-label "+(App.route==="elder"?"elder":(App.route==="family"?"family":""));
  lab.querySelector("span").textContent = who + (St && St.code ? " · " + St.code : "");

  chrome=EMBEDDED?'':'<button class="chip" data-go="lang">'+esc(D.langBtn)+'</button>';
  if(!EMBEDDED&&St&&St.code) chrome+='<button class="chip" data-go="reset">'+esc(D.resetBtn)+'</button>';
  if(!EMBEDDED&&St&&St.code) chrome+='<button class="chip" data-go="compare">'+esc(D.compareBtn)+'</button>';
  if(!EMBEDDED&&storeRole()) chrome+='<button class="chip" data-go="exit">'+esc(D.exitBtn)+'</button>';
  el("chrome").innerHTML=chrome;
  el("hintLine").textContent = App.route==="elder" ? D.hintElder
    : (App.route==="family" ? D.hintFamily : D.hintEntry);

  bindInputs();
  bindRange();
  if(App.route==="obElder") initHomeMap();
  if(App.route==="elder" && St && St.guide && St.guide.active && !App.boundarySaving && !App.boundarySyncFailed) initGuideMap();
  var th=view.querySelector(".thread"); if(th) th.scrollTop=th.scrollHeight;
  syncSubs();
  syncCallAudio(false);
  setConnectionStatus(Connection.state);
}

/* 滑块与数字框联动：拖动时只改画面，松手才写库，避免每一格都发一次请求 */
var rangeTimer=null;
function applyRange(v, persist){
  v=Math.max(200, Math.min(2000, Math.round((parseInt(v,10)||800)/10)*10));
  var sl=el("rangeSlider"), nu=el("rangeNum");
  if(sl && document.activeElement!==sl) sl.value=v;
  if(nu && document.activeElement!==nu) nu.value=v;
  if(sl) sl.style.setProperty("--pct", Math.round((v-200)/1800*100)+"%");
  if(St){ St.elder.radius=String(v); St.home=St.home||{}; St.home.radiusM=v; }
  if(App.homeMapController) App.homeMapController.setRadius(v);
  if(persist){
    clearTimeout(rangeTimer);
    rangeTimer=setTimeout(function(){ queueUpdate(function(x){ x.elder.radius=String(v); x.home=x.home||{}; x.home.radiusM=v; }); }, 260);
  }
  return v;
}
function syncSchematic(kind){
  var slot=document.querySelector('[data-gmap="'+kind+'"]');
  if(!slot) return;
  var old=slot.querySelector("svg"); if(old) old.remove();
  slot.insertAdjacentHTML("afterbegin", schematicSVG(kind));
}
function bindRange(){
  var sl=el("rangeSlider"), nu=el("rangeNum");
  if(sl){
    sl.addEventListener("input", function(){ applyRange(sl.value, false); });
    sl.addEventListener("change", function(){ applyRange(sl.value, true); });
  }
  if(nu){
    nu.addEventListener("input", function(){ applyRange(nu.value, true); });
    nu.addEventListener("blur", function(){ nu.value=applyRange(nu.value, true); });
  }
}

function toggleChatVoice(){
  if(App.chat.voiceActive){
    App.chat.voiceActive=false;
    stopSpeech();
    render();
    return;
  }
  App.chat.voiceError="";
  if(!speechSupported()){
    App.chat.voiceError=D.speakNoMic;
    render();
    return;
  }
  App.chat.voiceActive=true;
  render();
  var ok=startSpeech(function(text,final){
    if(text) App.chat.draft=text;
    if(final){ App.chat.voiceActive=false; render(); }
    else patchChatDraft();
  },function(){
    App.chat.voiceActive=false;
    App.chat.voiceError=D.chatVoiceFailed;
    render();
  });
  if(!ok){
    App.chat.voiceActive=false;
    App.chat.voiceError=D.speakNoMic;
    render();
  }
}

function bindTodos(){
  var ns=el("view").querySelectorAll("[data-todo]");
  Array.prototype.forEach.call(ns,function(n){
    n.addEventListener("change",function(){
      var parts=n.getAttribute("data-todo").split("|");
      var value=n.value, current=factById(St,parts[0]);
      var expected=current?current[parts[1]]:undefined;
      typing=true;
      queueUpdate(function(s){
        for(var i=0;i<s.facts.length;i++) if(s.facts[i].id===parts[0]){
          if(String(s.facts[i][parts[1]]||"")!==String(expected||"")) return;
          s.facts[i][parts[1]]=value;
          if(parts[1]==="what") s.facts[i].text=null;
        }
      },null,function(saved){
        var result=factById(saved,parts[0]);
        if(!result||String(result[parts[1]]||"")!==String(value||"")) showNotice(D.collabFieldKept);
      });
      typing=false;
      setTimeout(render,0);
    });
  });
}

  var ns=el("view").querySelectorAll("[data-f]");

      var path=n.getAttribute("data-f");

      },null,function(saved){

      });
      if(path==="elder.address"){

var CallAudio={player:null,src:""};
function callAudioSrc(s){ return '/app/call-demo-'+(s && s.lang==="zh" ? 'zh' : 'en')+'.wav'; }
function stopCallAudio(){
  if(CallAudio.player){ CallAudio.player.pause(); CallAudio.player=null; }
  CallAudio.src="";
}
function syncCallAudio(force){
  if(!St || !St.call || St.call.phase!=="talking"){
    stopCallAudio();
    App.callNeedsPlay=false;
    return;
  }
  if(App.callNeedsPlay && !force) return;
  var src=callAudioSrc(St);
  if(!CallAudio.player || CallAudio.src!==src){
    stopCallAudio();
    CallAudio.player=new Audio(src);
    CallAudio.player.preload="auto";
    CallAudio.src=src;
  }
  var started=Number(St.call.startedAt)||Date.now();
  var elapsed=Math.max(0,(Date.now()-started)/1000);
  if(Math.abs((CallAudio.player.currentTime||0)-elapsed)>.75) CallAudio.player.currentTime=elapsed;
  if(CallAudio.player.paused || force){
    var playing=CallAudio.player.play();
    if(playing && typeof playing.catch==="function") playing.catch(function(){
      if(App.callNeedsPlay) return;
      App.callNeedsPlay=true;
      setTimeout(function(){ render(); },0);
    });
  }
}

var CALL_CUES={
  en:[0,2.6,4.3,9.2,12.6,17.4,20.4],
  zh:[0,2.7,5.0,9.1,12.4,17.5,20.5]
};
function callLineAt(s,now){
  var cues=CALL_CUES[s && s.lang==="zh" ? "zh" : "en"];
  var elapsed=Math.max(0,((Number(now)||Date.now())-(Number(s.call.startedAt)||Date.now()))/1000);
  for(var i=cues.length-1;i>=0;i--) if(elapsed>=cues[i]) return i;
  return 0;
}

function syncSubs(){

      if(line!==s.call.line) queueUpdate(function(x){ x.call.line=line; });

}

/* 把这通电话的内容交给模型，抽成待家人确认的事实与待办。
   抽取失败就用默认的两条，演示流程不会断。 */
async function extractCallItems(){
  if(!St) return fallbackItems();
  var p=focusPerson(St), lines=[];
  for(var i=0;i<D.callLines.length;i++){
    var L=D.callLines[i];
    lines.push((L[0]==="me" ? St.elder.name : p.nick) + "：" + tp(L[1]));
  }
  var zh = St.lang!=="en";
  var text = await aiAsk({
    json:true, timeout:14000,
    system: zh
      ? "你在帮阿尔茨海默患者的家人整理通话内容。只抽取通话里明确说过的信息，不要推断，不要补充。只输出 JSON。"
      : "You help the family of a person with Alzheimer's summarise a phone call. Only extract what was explicitly said. Do not infer or add anything. Output JSON only.",
    user: (zh
      ? "这是一段通话记录：\n" + lines.join("\n") +
        "\n\n抽成 JSON：{\"items\":[" +
        "{\"type\":\"fact\",\"text\":\"一句话，20字以内\"}," +
        "{\"type\":\"todo\",\"date\":\"YYYY-MM-DD\",\"when\":\"时间，没说就留空\",\"where\":\"地点，没说就留空\",\"what\":\"要做的事，10字以内\"}" +
        "]}。fact 是关于人或事的事实，todo 是要提醒老人做的事。最多 3 条。用中文，主语用具体的人名。" +
        "不要推断没说过的时间和地点。今天是 " + todayKey() + "，请把「周六」「明天」这类说法换算成具体日期；没提到日期就用今天。"
      : "Here is a call transcript:\n" + lines.join("\n") +
        "\n\nExtract JSON: {\"items\":[" +
        "{\"type\":\"fact\",\"text\":\"one short sentence\"}," +
        "{\"type\":\"todo\",\"date\":\"YYYY-MM-DD\",\"when\":\"time, empty if not said\",\"where\":\"place, empty if not said\",\"what\":\"what to do, short\"}" +
        "]}. A fact is about a person or an event; a todo is something to remind the elder to do. At most 3. " +
        "Do not invent a time or place that was not said. Today is " + todayKey() +
        "; convert wording like \"Saturday\" or \"tomorrow\" into a real date, and use today when no date is mentioned. " +
        "Answer in English.")
  });

  var got=aiJSON(text);
  var arr = got && Array.isArray(got.items) ? got.items : null;
  if(!arr || !arr.length) return fallbackItems();

  var out=[];
  for(var j=0;j<arr.length && out.length<3;j++){
    var it=arr[j];
    if(!it) continue;
    var hasText = typeof it.text==="string" && it.text.trim();
    var hasWhat = typeof it.what==="string" && it.what.trim();
    if(!hasText && !hasWhat) continue;
    if(it.type==="todo"){
      out.push({
        id:"ai"+Date.now()+j, type:"todo", origin:"call", key:"factPill", text:null,
        status:"open", done:{}, repeat:"none",
        date: /^\d{4}-\d{2}-\d{2}$/.test(String(it.date||"")) ? it.date : todayKey(),
        when:String(it.when||"").trim().slice(0,24),
        where:String(it.where||"").trim().slice(0,24),
        what:String(it.what||it.text||"").trim().slice(0,40)
      });
    } else {
      out.push({ id:"ai"+Date.now()+j, type:"fact", origin:"call", key:"factVisit",
        text:String(it.text||"").trim().slice(0,80), status:"open" });
    }
  }
  return out.length ? out : fallbackItems();
}

var endingCall=false;
function itemSignature(item){
  if(!item) return "";
  if(item.type==="todo") return ["todo",item.date||todayKey(),item.when||"",item.where||"",item.what||item.text||item.key||""].join("|").toLowerCase();
  if(item.ask!=null) return "fact|ask:"+Number(item.ask);
  if(item.question) return "fact|question:"+String(item.question).trim().toLowerCase();
  return ["fact",item.text||item.key||""].join("|").toLowerCase();
}
function appendUniqueItems(state,items){
  var existing={};
  for(var i=0;i<state.facts.length;i++) if(state.facts[i].status!=="skip") existing[itemSignature(state.facts[i])]=true;
  var added=0;
  for(var j=0;j<items.length;j++){
    var signature=itemSignature(items[j]);
    if(!signature||existing[signature]) continue;
    state.facts.push(items[j]); existing[signature]=true; added++;

async function endCall(){
  if(endingCall||!St||!callActive(St)) return;
  var snapshot={
    id:St.call.id||"", personId:St.call.personId||null,
    dir:St.call.dir||"in", phase:St.call.phase
  };

async function matchFreeQuestion(s,questionText){
  var src=s.facts||[], candidates=[], normalized=String(questionText||"").trim().toLowerCase();
  for(var i=0;i<src.length;i++){
    var f=src[i];
    if(f.status!=="done") continue;
    if(f.question && String(f.question).trim().toLowerCase()===normalized) return f;
    candidates.push(f);
  }
  if(!candidates.length) return null;
  var zh=s.lang!=="en";
  var lines=candidates.map(function(f,idx){ return idx+". "+factLine(f); }).join("\n");
  var raw=await aiAsk({
    timeout:6000,
    system: zh
      ? "只能从下面已确认的信息中选择真正回答了问题的一条。只输出编号；没有答案只输出 -1。不得猜测。"
      : "Choose only a confirmed item below that directly answers the question. Output its number, or -1 if none answers it. Never guess.",
    user:(zh?"问题：":"Question: ")+questionText+"\n\n"+lines
  });
  var idx=raw!=null?parseInt(String(raw).trim(),10):NaN;
  return !isNaN(idx)&&idx>=0&&idx<candidates.length ? candidates[idx] : null;
}

async function askFree(question){
  question=String(question||"").trim().slice(0,160);
  if(!question) return;
  var matched=await matchFreeQuestion(St,question), pending=null;
  queueUpdate(function(s){
    s.thread.push({role:"me",text:question});
    var key="ansNoConfirm", src="srcUnk", text=null;
    if(matched){
      key="ansPlain"; src=matched.type==="todo"?"srcTodo":"srcFact"; text=factLine(matched);
    }else{
      var normalized=question.toLowerCase(), duplicate=false;
      for(var i=0;i<s.pending.length;i++){
        if(String(pendingQuestion(s.pending[i])).trim().toLowerCase()===normalized) duplicate=true;
      }
      if(!duplicate) s.pending.push({id:"q"+Date.now(),question:question});
      var seen=false;
      for(var j=0;j<s.timeline.length;j++) if(s.timeline[j].kind==="unknown") seen=true;
    if(!seen) s.timeline.push({t:clockNow(),date:todayKey(),kind:"unknown"});
    }
    pending={index:s.thread.length,text:text,src:src};
    s.thread.push({role:"ai",key:key,src:src,text:text});
  });
  if(!matched || !pending) return;
  var nice=await phraseAnswer(pending.text,matched.type==="todo"?"todo":"fact");
  if(!nice) return;
  queueUpdate(function(s){
    var m=s.thread[pending.index];
    if(m&&m.role==="ai"){ m.key="ansRaw"; m.text=nice; }
  });
}

async function ask(i){
  /* i===0/1 且没有绑定答案（factForAsk）时，同类已确认条目可能不止一条——比如通话抽取
     出了好几条不同话题的 fact，此时"取最新一条"经常文不对题，改成让 AI 从里面挑出
     真正回答了这道题的那条。这一步必须在 queueUpdate 外先做完，因为它是异步的，而
     queueUpdate 的状态更新函数要保持同步。 */
  var bound=factForAsk(St,i);
  var matched=null;
  if(!bound){
    if(i===0) matched=await matchRelevantFact(St,"fact",tp(D.asks[0]));
    else if(i===1) matched=await matchRelevantFact(St,"todo",tp(D.asks[1]));
  }

  /* 先把问题和一个占位的回答放上去，模型回来之后再补写措辞 */
  var pending=null;
  queueUpdate(function(s){
    var displayQuestion=questionText ? String(questionText).trim() : tp(D.asks[i],s);
    s.thread.push({role:"me",ask:i,text:questionText?displayQuestion:null});
    var key,src,text=null,f;
    var boundNow=factForAsk(s,i);  // 用这次提交时的最新快照重新确认一次，避免竞态
    if(i===0){
      /* 重复提问只在今日概况里累加一条计数，不打扰家人 */
      s.askCounts.visit=(s.askCounts.visit||0)+1;
      var row=null;
      for(var k=0;k<s.timeline.length;k++) if(s.timeline[k].kind==="qa") row=s.timeline[k];
      if(row) row.n=s.askCounts.visit; else s.timeline.push({t:clockNow(),date:todayKey(),kind:"qa",n:1});
    }
    if(boundNow){
      key = boundNow.origin==="family" ? "ansPlain" : "ansFromFact";
      text=factLine(boundNow); src="srcFact";
    } else if(i===0){
      f=matched;
      if(f){ key="ansFromFact"; text=factLine(f); src="srcFact"; }
      else { key="ansNoConfirm"; src="srcUnk"; }
    } else if(i===1){
      f=matched;
      if(f){ key="ansFromTodo"; text=factLine(f); src="srcTodo"; }
      else { key="ansNoConfirm"; src="srcUnk"; }
    } else {
      key="ansUnknown"; src="srcUnk";
      var dup=false;
      for(var j=0;j<s.pending.length;j++) if(s.pending[j].ask===i && (s.pending[j].text||"")=== (questionText||"")) dup=true;
      if(!dup) s.pending.push({id:"q"+Date.now(),ask:i,text:questionText?displayQuestion:null});
      var seen=false;
      for(var q=0;q<s.timeline.length;q++) if(s.timeline[q].kind==="unknown") seen=true;
    if(!seen) s.timeline.push({t:clockNow(),date:todayKey(),kind:"unknown"});
    }
    pending={key:key, src:src, text:text, index:s.thread.length};
    s.thread.push({role:"ai",key:key,src:src,text:text});
    answerText=text ? fill(D[key],{text:text}) : D[key];
  });

  if(!pending || pending.src==="srcUnk") return;   // 拒答不经过模型
  var factText = pending.text || tp(D[pending.key]);
  var nice = await phraseAnswer(factText, pending.key==="ansFromTodo"||pending.key==="ansPill" ? "todo" : "fact");
  if(!nice) return;
  queueUpdate(function(s){
    var m=s.thread[pending.index];
    if(m && m.role==="ai"){ m.key="ansRaw"; m.text=nice; }
  });
}

/* 有确认过的事实时，让模型把它说成一句温和的短话；模型不可用就用默认措辞。
   没有事实时不调用模型，直接走固定的拒答，避免任何编造。 */
async function phraseAnswer(factText, kind){
  if(!factText) return null;
  var zh = St.lang!=="en";
  var text = await aiAsk({
    timeout:9000,
    system: zh
      ? "你在对一位阿尔茨海默中度早期的老人说话。只能使用给你的这条事实，不能补充任何其他信息，不能反问。两句话以内，短句，语气温和，先说事实再给一句安心的话。只输出这段话本身。"
      : "You are speaking to a person with early-stage Alzheimer's. Use only the fact given. Add nothing else, ask nothing back. Two short sentences at most: state the fact, then one reassuring line. Output only the sentence.",
    user: (zh ? "事实：" : "Fact: ") + factText
       + (kind==="todo" ? (zh ? "\n这是一件要做的事。" : "\nThis is something to do.") : "")
  });
  return text && text.trim() ? text.trim().slice(0,120) : null;
}

/* 家人补的答案绑定在具体问题上，只回答那一个问题，不会串到别的问题去 */
function factForAsk(s, i){
  var src=s.facts||[];
  for(var k=src.length-1;k>=0;k--){
    var f=src[k];
    if(f.type==="fact" && f.status==="done" && f.ask===i) return f;
  }
  return null;
}

/* 没有绑定答案时，同类已确认条目（比如通话抽取出来的一堆 fact）可能有好几条，
   "取最新一条"经常文不对题。条目多于一条才需要问模型，从里面挑出真正回答了
   这个问题的那条；只有一条、AI 不可用、或 AI 判断没有一条对得上时，退回
   "取最新一条"（latestConfirmed），不新增拒答文案。 */
async function matchRelevantFact(s, type, questionText){
  var src=s.facts||[];
  var candidates=[];
  for(var i=0;i<src.length;i++){
    if(src[i].type===type && src[i].status==="done") candidates.push(src[i]);
  }
  if(candidates.length===0) return null;
  if(candidates.length===1) return candidates[0];

  var zh=s.lang!=="en";
  var lines=candidates.map(function(f,idx){ return idx+". "+factLine(f); }).join("\n");
  var raw=await aiAsk({
    timeout:6000,
    system: zh
      ? "从下面编号的条目里选出最能回答这个问题的一条，只输出那个编号；如果没有一条真正回答了这个问题，只输出 -1。不要输出其他任何文字。"
      : "Pick the numbered item that best answers the question. Output only that number, or -1 if none of them actually answer it. Output nothing else.",
    user: (zh?"问题：":"Question: ")+questionText+"\n\n"+lines
  });
  var idx=raw!=null ? parseInt(String(raw).trim(),10) : NaN;
  if(idx===-1) return null;
  if(!isNaN(idx) && idx>=0 && idx<candidates.length) return candidates[idx];
  return latestConfirmed(s,type);  // AI 不可用/返回格式不对：退回“取最新一条”
}

      if(!target) return;
    }
    appendUniqueItems(s,[item]);
    if(bound){
      /* 和手写答案走同一套：清掉这条待补充，并把老人端那句拒答补写成真答案 */
      var normalized=String(bound.question).trim().toLowerCase();
      for(var q=0;q<s.thread.length-1;q++){
        var asked=s.thread[q], reply=s.thread[q+1];
        var same = bound.ask!=null
          ? asked.role==="me" && asked.ask===Number(bound.ask)
          : asked.role==="me" && String(asked.text||"").trim().toLowerCase()===normalized;
        if(same && reply && reply.role==="ai" && reply.src==="srcUnk"){
          reply.key="ansPlain"; reply.text=String(item.text).slice(0,120); reply.src="srcFact";
        }
      }
      s.pending=s.pending.filter(function(p){ return pendingQuestion(p)!==bound.question; });
      var seen=false;
      for(var i=0;i<s.timeline.length;i++) if(s.timeline[i].kind==="answered") seen=true;
      if(!seen) s.timeline.push({ t:clockNow(), date:todayKey(), kind:"answered" });
    }
  },null,function(saved){
    if(bound&&!factById(saved,item.id)) showNotice(D.collabAnswerKept);

      var asked=s.thread[q], reply=s.thread[q+1];
      var same=target.ask!=null
        ? asked.role==="me"&&asked.ask===Number(target.ask)
        : asked.role==="me"&&String(asked.text||"").trim().toLowerCase()===normalized;
      if(same&&reply&&reply.role==="ai"&&reply.src==="srcUnk"){
        reply.key="ansPlain"; reply.text=text.slice(0,120); reply.src="srcFact";

/* 选一张照片，压成 192 见方再存：通话中可看清脸，同时控制家庭状态体积。 */
function readPhoto(file, cb){
  if(!file || !/^image\//.test(file.type)) return cb(null);
  var reader=new FileReader();
  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      try{
        var S=192, c=document.createElement("canvas");
        c.width=S; c.height=S;
        var ctx=c.getContext("2d");
        var side=Math.min(img.width, img.height);
        ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S,S);
        cb(c.toDataURL("image/jpeg",0.8));
      }catch(_e){ cb(null); }
    };
    img.onerror=function(){ cb(null); };
    img.src=reader.result;
  };
  reader.onerror=function(){ cb(null); };
  reader.readAsDataURL(file);
}

async function pair(code){
  code=String(code||"").trim();
  if(!/^\d{6}$/.test(code)){ App.err=D.joinErr; render(); return; }
  if(Connection.pendingAction) return;
  Connection.restoreGeneration=(Connection.restoreGeneration||0)+1; Connection.restoring=false;
  App.joinCode=code; App.err="";
  var attempt={cancelled:false}, timer;
  Connection.joinAttempt=attempt; Connection.pendingAction=true;
  syncActionAvailability();
  function current(){return Connection.joinAttempt===attempt&&!attempt.cancelled;}
  var cancelled=new Promise(function(resolve){attempt.release=resolve;});
  var deadline=new Promise(function(resolve){
    timer=setTimeout(function(){
      if(current()){
        attempt.cancelled=true; Store.resetSession(); St=null;
        App.err=lang==='en'?'Joining timed out. Please retry, or go back.':'加入家庭超时，请重试或返回。';
        setConnectionStatus('error');
      }
      resolve();
    },20000);
  });
  var work=(async function(){
    try{
      var role=EMBED_ROLE||App.joinAs;
      await Store.attach(code,role);
      if(!current()) return;
      St=Store.get();
      if(!St) throw new Error('FAMILY_UNAVAILABLE');
      Connection.authenticated=true; Connection.initFailed=false;
      if(role==="elder"){
        await persistUpdate(function(s){ s.paired=true; });
        if(!current()) return;
        rememberDevice("elder",code,null);
        App.paired=true; App.route="elder";
      }else{
        var p=newPerson();
        await persistUpdate(function(s){ s.people.push(p); });
        if(!current()) return;
        rememberDevice("family",code,p.id);
        App.editingPerson=p.id; App.speak=0; App.route="obMe";
      }
      App.err="";
    }catch(error){
      if(!current()) return;
      App.err=error&&error.code==="FAMILY_NOT_FOUND"?D.joinErr:(lang==='en'?'Could not join this family. Please retry, or go back.':'暂时无法加入家庭，请重试或返回。');
      reportStoreError(error);
    }
  })();
  try{await Promise.race([work,deadline,cancelled]);}
  finally{
    clearTimeout(timer);
    if(Connection.joinAttempt===attempt){
      Connection.joinAttempt=null; Connection.pendingAction=false;
      render(); syncActionAvailability();
    }
  }
}
function cancelJoin(){
  var attempt=Connection.joinAttempt;
  if(attempt){attempt.cancelled=true;attempt.release();}
  Connection.restoreGeneration=(Connection.restoreGeneration||0)+1; Connection.restoring=false;
  Connection.joinAttempt=null;Connection.pendingAction=false;
  if(Store) Store.resetSession();
  St=null;clearDevice();App.err="";
  App.route=App.joinAs==='elder'?'entry':'familyStart';
  setConnectionStatus('synced');render();syncActionAvailability();
}

  stopGps();

/* “换个角色”代表结束这台老人端当前的临时会话。家庭资料、记忆和待办保留，
   但导航/到家页和正在进行的通话不能在重新进入老人端后继续占住首页。 */
function resetElderModeSession(s){
  if(!s) return;
  s.guide=s.guide||{};
  s.guide.active=false; s.guide.done=false; s.guide.step=0;
  s.guide.instructions=[]; s.guide.routeId="";
  if(s.call && (s.call.phase==="ringing" || s.call.phase==="talking")){
    s.call.phase="idle"; s.call.line=-1;
    delete s.call.startedAt;
  }
}

async function hardExit(){
  if(Connection.joinAttempt){cancelJoin();return;}
  var leavingRole=storeRole();
  stopSpeech();
  stopSubs();
  if(leavingRole==="elder" && St){
    try{ await persistUpdate(resetElderModeSession); }
    catch(_error){ /* persistUpdate 已显示连接错误；仍允许用户切换角色。 */ }
  }
  App.route="entry"; App.tab=0; App.qa=false; App.pick=false; App.eset=false;
  App.qaVoiceActive=false; App.qaVoiceText=""; App.qaVoiceErr="";
  App.callNeedsPlay=false; App.editingPerson=null; App.paired=false;
  clearDevice(); stopGps(); App.demoLocation=false; St=null;
  try{ if(Store) await Store.signOut(); }catch(error){ reportStoreError(error); }
  if(EMBED_ROLE && window.location && typeof window.location.replace==="function"){
    window.location.replace("/app/index.html?embedded=1");
    return;
  }
  if(!EMBEDDED && window.location && typeof window.location.reload==="function"){
    window.location.reload();
    return;
  }
  D=I18N[lang]; render();
}

document.addEventListener("click", async function(e){

  if(g("data-ask")!==null){ stopElderLive(); void ask(parseInt(g("data-ask"),10)); return; }

      for(var z=0;z<St.facts.length;z++) if(St.facts[z].id===id) cur=St.facts[z];
      if(cur&&cur.status==="draft"){ App.cal.open=id; render(); return; }
      var next=!(cur && todoDoneOn(cur,key));
      queueUpdate(function(s){ markTodoDone(s, id, key, next); });
      return;
    }
    App.cal.open = App.cal.open===id ? null : id;
    render(); return;
  }
  if((id=g("data-todo-rep"))){
    queueUpdate(function(s){
      for(var z=0;z<s.facts.length;z++) if(s.facts[z].id===id)
        s.facts[z].repeat = s.facts[z].repeat==="daily" ? "none" : "daily";

  }
  if((id=g("data-todo-save"))){
    var draft=null;
    for(var ds=0;ds<St.facts.length;ds++) if(St.facts[ds].id===id) draft=St.facts[ds];
    if(!draft||!String(todoWhat(draft)||"").trim()){
      App.todoErrors[id]=D.todoNeedWhat; App.cal.open=id; render(); return;

    delete App.todoErrors[id];
    var todoOwner=selectedMemberId()||"";

      for(var si=0;si<s.facts.length;si++) if(s.facts[si].id===id){
        var item=s.facts[si];
        if(item.status==="draft"&&(!item.ownerId||item.ownerId===todoOwner)) item.status="done";

      var result=factById(saved,id);

    });
    App.cal.open=null;
    return;
  }
  if((id=g("data-todo-cancel"))){
    delete App.todoErrors[id];
    App.cal.open=null;
    var cancelOwner=selectedMemberId()||"";
    queueUpdate(function(s){ s.facts=s.facts.filter(function(item){
      if(item.id!==id) return true;
      return item.status!=="draft"||(item.ownerId&&item.ownerId!==cancelOwner);
    }); });
    return;
  }
  if((id=g("data-ans-save"))!==null && id!==undefined && g("data-ans-save")){ saveAnswer(g("data-ans-save")); return; }
  if(g("data-ans-skip")){ skipAnswer(g("data-ans-skip")); return; }
  if(g("data-chat-save")){ chatSaveProp(Number(g("data-chat-save"))); render(); return; }
  if(g("data-chat-drop")){ App.chat.msgs.splice(Number(g("data-chat-drop")),1); render(); return; }
  if(g("data-chat-tip")){ App.chat.draft=D.chatTips[Number(g("data-chat-tip"))]; render(); return; }
  if(g("data-ans-chat")){ openChat(g("data-ans-chat")); return; }
  if((id=g("data-todo-del"))){
    queueUpdate(function(s){
      s.facts=s.facts.filter(function(f){ return f.id!==id; });
    });
    return;
  }
  if((id=g("data-callfamily"))){
    var target=id, outboundCallId=newCallId();
    App.pick=false;
    queueUpdate(function(x){
      beginSharedCall(x,target,"out",outboundCallId);
    },null,function(saved){
      if(!saved.call||saved.call.id!==outboundCallId) showNotice(D.collabCallBusy);
    });
    return;
  }
  
  if((id=g("data-item-do"))){ setItem(id,"done","open"); return; }
  if((id=g("data-item-skip"))){ setItem(id,"skip","open"); return; }
  if((id=g("data-item-edit"))){ setItem(id,"editing","open"); return; }
  if((id=g("data-item-cancel"))){ setItem(id,"open","editing"); return; }
  if((id=g("data-item-save"))){
    var inp=document.querySelector('[data-item-in="'+id+'"]'), v=inp?inp.value:null;
    queueUpdate(function(s){
      var f=factById(s,id);
      if(f&&f.status==="editing"){ f.text=v; f.status="done"; }
    },null,function(saved){
      var result=factById(saved,id);
      if(result&&result.status!=="done") showNotice(D.collabItemHandled);
    });
    return;
  }

  switch(g("data-go")){
    case "copyCode": await copyFamilyCode(); break;
    case "entry": await hardExit(); break;
    case "familyStart": App.route="familyStart"; render(); break;

    case "create":
      await runPendingAction(async function(){
        try{
          var code=await Store.create(langTouched ? lang : "en");
          if(!code) return;
          St=Store.get();
          var p0=newPerson();
          await persistUpdate(function(s){ s.people.push(p0); });
          rememberDevice("family",code,p0.id);
          App.editingPerson=p0.id; App.speak=0; App.route="obElder"; render();
        }catch(error){ reportStoreError(error); render(); }
      });
      break;
    case "joinFamily": App.joinAs="family"; App.err=""; App.route="join"; render(); break;
    case "elderPair":  await startElderDevice(); App.joinAs="elder"; App.err=""; App.route="join"; render(); break;
    case "pair": await pair(el("codeIn").value); break;
    case "cancelJoin": cancelJoin(); break;

    case "obMe":
      if(!App.editingPerson && St && St.people && St.people[0]) App.editingPerson=St.people[0].id;
      App.route="obMe"; render(); break;
    case "backPerson": backFromPerson(); render(); break;
    case "setHomeFromGps": setHomeFromGps(); break;
    case "fillElderSample": await fillElderSample(); break;
    case "fillPersonSample": await fillPersonSample(); break;
    case "speak": doSpeak(); break;
    case "speakStop": doSpeakStop(); break;
    case "speakUse": await doSpeakUse(); break;
    case "finishSetup":
      var first=!St.setup;
      // 先等地理编码完成，确保 home.lat/lng 写入 state 后再跳转
      await ensureHomePointFromAddress().catch(function(){});
      await persistUpdate(function(s){ s.setup=true; });
      App.editingPerson=null; App.speak=0;
      App.route = first ? "code" : "family";
      if(!first) App.tab=3;
      render();
      break;
    case "enterFamily": App.route="family"; App.tab=0; render(); break;
    case "enterElder": App.paired=false; render(); break;
    case "addTodo": openNewReminder(); break;
    case "openChat": openChat(); break;
    case "closeChat": stopSpeech(); App.chat.open=false; App.chat.voiceActive=false; App.chat.seedPend=null; render(); break;
    case "chatSend": await chatSend(); break;
    case "chatVoice": toggleChatVoice(); break;
    case "openAlert": App.alertOpen=true; render(); break;
    case "toggleSum": App.sumAll=!App.sumAll; render(); break;
    case "closeAlert": App.alertOpen=false; render(); break;
    case "clearAlert":
      App.alertOpen=false;
      queueUpdate(function(s){ s.alertCleared=true; if(s.risk&&s.risk.state==="returned") s.risk.state="safe"; });
      break;
    case "clearPending": queueUpdate(function(s){ s.pending=[]; }); break;

    case "call":
      App.tab=0;
      var inboundPersonId=selectedMemberId(), inboundCallId=newCallId();
      queueUpdate(function(s){ beginSharedCall(s,inboundPersonId,"in",inboundCallId); },null,function(saved){
        if(!saved.call||saved.call.id!==inboundCallId) showNotice(D.collabCallBusy);
      });
      break;
    case "answer":
      App.callNeedsPlay=false;
      var answerCall={ id:St.call.id||"", personId:St.call.personId||null, dir:St.call.dir||"in" };
      var callStartedAt=Date.now();
      queueUpdate(function(s){
        if(s.call.phase!=="ringing"||!isSameCall(s,answerCall)) return;
        s.call.phase="talking"; s.call.line=0; s.call.startedAt=callStartedAt;
      });
      break;
    case "decline":
      App.pick=false;
      var declineCall={ id:St.call.id||"", personId:St.call.personId||null, dir:St.call.dir||"in" };
      queueUpdate(function(s){
        if(s.call.phase!=="ringing"||!isSameCall(s,declineCall)) return;
        s.call.phase="idle"; s.call.line=-1;
      });
      break;
    case "hangup": stopSubs(); App.pick=false; void endCall(); break;
    case "playCall": App.callNeedsPlay=false; syncCallAudio(true); render(); break;

    case "todoDone":
      queueUpdate(function(x){
        var target=todayTodoOf(x);
        if(target) markTodoDone(x, target.id, todayKey(), true);
        var seen=false;
        for(var k=0;k<x.timeline.length;k++) if(x.timeline[k].kind==="todo") seen=true;
        if(!seen) x.timeline.push({t:clockNow(), date:todayKey(), kind:"todo"});
      });
      break;
    case "readHome": speakSummary(homeSummaryText()); break;
    case "retryWeather": Weather.state="idle"; Weather.data=null; ensureWeather(true); render(); break;
    case "openQa": App.qa=true; App.pick=false; App.eset=false; App.qaVoiceText=""; App.qaVoiceErr=""; render(); break;
    case "toggleLive": toggleElderLive(); break;
    case "playLive": if(ElderLive.client) void ElderLive.client.play().catch(function(){ showNotice('请点击重试 / Please try again'); }); break;
    case "closeQa": stopElderLive(); stopSpeech(); App.qa=false; App.qaVoiceActive=false; App.qaVoiceText=""; App.qaVoiceErr=""; render(); break;
    case "openPick": App.pick=true; App.qa=false; App.eset=false; render(); break;
    case "closePick": App.pick=false; render(); break;
    case "openESet": App.eset=true; App.qa=false; App.pick=false; render(); break;
    case "closeESet": App.eset=false; render(); break;
    case "openGuide":
      if(isOut(St) && !St.guide.active){ queueUpdate(requestBoundaryAlert); break; }
      if(homePoint(St)&&currentPoint(St)){
        queueUpdate(function(s){ s.guide.active=true; s.guide.done=false; s.guide.step=0; });
        App.qa=false; App.pick=false; App.eset=false;
        App.guideRouteRequested=false; App.guideRouteStatus="idle"; App.guideRouteError="";
        initGuideMap();
      }
      break;
    case "confirmBoundary": await confirmBoundaryNavigation(); break;
    case "prevGuide": retreatGuide(); break;
    case "arrived": arrived(); break;
    case "ackHome": queueUpdate(function(s){ s.guide.done=false; }); break;
    case "toggleDev": App.dev=!App.dev; render(); break;
    case "walk": setDemoLocation(true); break;
    case "goHome": setDemoLocation(false); break;
    case "compare":
      if(St&&St.code) window.top.location.href="/?compare=1&code="+encodeURIComponent(St.code)+(LOCAL_DEMO?"&localDemo=1":"");
      break;

    case "logout":
      if(confirm(D.logoutAsk)) await hardExit();
      break;

    case "lang":
      var nl = (St?St.lang:lang)==="zh" ? "en" : "zh";
      lang=nl; langTouched=true;
      if(St){
        var old=St.lang;
        queueUpdate(function(s){
          s.lang=nl;
          if(s.elder.name===SEED[old].elderName) s.elder.name=SEED[nl].elderName;
          if(s.elder.address===SEED[old].address) s.elder.address=SEED[nl].address;
          for(var i=0;i<s.people.length;i++){
            var pp=s.people[i];
            ["nick","relation","recent","hint"].forEach(function(k){
              if(pp[k]===SEED[old][k]) pp[k]=SEED[nl][k];
            });
          }
        });
      } else render();
      break;
    case "reset":
      if(confirm(D.resetAsk)){
        stopSpeech();
        App.tab=0; App.qa=false; App.qaVoiceActive=false; App.qaVoiceText=""; App.qaVoiceErr="";
        App.editingPerson=null; App.speak=0; App.dev=false; App.demoLocation=false;
        Weather={state:"idle",data:null,at:0,key:""};
        try{
          await Store.resetFamily();
          if(storeRole()==="family"){
            var np2=newPerson();
            await persistUpdate(function(s){ s.people.push(np2); });
            rememberDevice("family",St.code,np2.id);
            App.editingPerson=np2.id; App.route="obElder";
          } else { App.route="elder"; }
          render();
        }catch(error){ reportStoreError(error); }
      }
      break;
    case "retryConnection": await connectAndRestore(); break;
    case "exit": await hardExit(); break;
  }
});

/* =====================================================================
   11. 启动
   ===================================================================== */
if(Store) Store.subscribe(function(s){ render(s); });

function pollFamilyState(){
  if(!Store || !St || !Connection.authenticated || Connection.pendingAction || Connection.state==="saving") return;
  void Store.refresh().catch(function(error){ reportStoreError(error); });
}

async function connectAndRestore(){
  if(Connection.pendingAction || Connection.restoring) return;
  Connection.restoring=true;
  var generation=Connection.restoreGeneration=(Connection.restoreGeneration||0)+1;
  Connection.initFailed=false;
  Connection.authenticated=false;
  setConnectionStatus("connecting");
  render(St);
  try{
    if(!Store) throw new Error("Supabase client unavailable");
    await Store.initialize();
    if(generation!==Connection.restoreGeneration) return;
    var restored;
    if(EMBED_ROLE&&EMBED_CODE){
      await Store.attach(EMBED_CODE,EMBED_ROLE);
      restored=Store.get();
    }else{
      restored=await Store.restoreSelection();
    }
    if(generation!==Connection.restoreGeneration) return;
    St=restored;
    Connection.authenticated=true;
    if(St){
      lang=St.lang||lang;
      var role=EMBED_ROLE||storeRole()||"family";
      App.paired=false;
      var member=sessionGet(SCODE)===St.code?selectedMemberId():null;
      if(!EMBED_ROLE) rememberDevice(role,St.code,role==="family"?member:null);
      App.route=role==="elder"?"elder":"family";
      if(role==="family"&&!St.setup) App.route="obElder";
    }else{
      clearDevice();
      App.route="entry"; App.editingPerson=null; App.paired=false;
      setConnectionStatus("synced");
    }
    render(St);
    if(App.route==="elder") setTimeout(startGps,0);
  }catch(error){
    if(generation!==Connection.restoreGeneration) return;
    Connection.authenticated=false;
    Connection.initFailed=true;
    setConnectionStatus(navigator.onLine===false?"offline":"error");
    render(St);
  }finally{
    if(generation===Connection.restoreGeneration) Connection.restoring=false;
  }
}

(function boot(){
  D=I18N[lang];
  render(St);
  connectAndRestore();
  window.addEventListener("offline",function(){ setConnectionStatus("offline"); });
  setInterval(patchLiveTime, 20000);
  setInterval(pollFamilyState, 2000);
})();

})();
</script>
<script>
(function(){
  function fit(){
    var f=Math.min(1,(window.innerHeight-24)/866,(window.innerWidth-24)/412);
    document.documentElement.style.setProperty("--fit", f.toFixed(4));
  }
  fit(); window.addEventListener("resize", fit);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", fit);
})();
</script>
