<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<title>Remember Us · Family Memory Companion</title>
<style>
:root{
  --page:#EFE1D3; --page-2:#F7E9DA;
  --paper:#FDF7F0;
  --card:#FFFCF8;
  --ink:#3A2C22;
  --ink-2:#5C483A;
  --muted:#9A8574;
  --faint:#C3B2A2;
  --line:#EFE3D6;
  --blue:#C8794A; --blue-d:#A2582C; --blue-soft:#FAEADD;
  --rose:#D98F80; --rose-soft:#FBE9E1;
  --green:#7C9A63; --green-soft:#F0F4E7;
  --amber:#C08A2E; --amber-soft:#FBF0DA;
  --warm:#C2703A; --warm-soft:#FAEFE7;
  --red:#C4585C; --red-soft:#FAE7E6;
  --sans:"Baloo 2","Noto Sans SC","PingFang SC","Microsoft YaHei","Source Han Sans SC",-apple-system,system-ui,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --sh-card:0 2px 10px rgba(94,63,38,.06), 0 12px 28px rgba(94,63,38,.07);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--page); color:var(--ink); font-family:var(--sans)}
body{min-height:100vh; height:100vh; overflow:hidden; padding:0; position:relative;
  background:radial-gradient(120% 100% at 50% 0%, var(--page-2) 0%, var(--page) 70%)}
.device-label,.hint-line{display:none !important}
p{margin:0 0 10px}
button{font:inherit; cursor:pointer; border:0; background:none; color:inherit}
input,textarea,select{font:inherit}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px}

/* ================= 手机框 ================= */
.device-label{display:flex; align-items:center; gap:8px; color:var(--muted);
  font-size:12.5px; font-weight:700; letter-spacing:.02em}
.device-label i{width:8px; height:8px; border-radius:50%; font-style:normal; background:var(--faint)}
.device-label.family i{background:var(--blue)} .device-label.elder i{background:var(--warm)}

.phone{position:absolute; left:50%; top:50%; width:412px; height:866px;
  padding:11px; border-radius:56px; background:#2A1D14;
  transform:translate(-50%,-50%) scale(var(--fit,1)); transform-origin:center center;
  box-shadow:0 1px 0 rgba(255,255,255,.18) inset, 0 30px 70px rgba(74,45,24,.32)}
.phone::after{content:""; position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
  width:126px; height:5px; border-radius:99px; background:rgba(255,255,255,.35); z-index:4}
.island{position:absolute; top:22px; left:50%; background:#2A1D14; transform:translateX(-50%);
  width:110px; height:30px; border-radius:99px; z-index:3}
.screen{position:relative; width:390px; height:844px; border-radius:46px; overflow:hidden;
  background:radial-gradient(60% 30% at 8% 2%, rgba(250,214,178,.55), rgba(250,214,178,0) 60%), radial-gradient(70% 40% at 100% 100%, rgba(205,220,190,.40), rgba(205,220,190,0) 60%), var(--paper); display:flex; flex-direction:column}
.statusbar{flex:0 0 auto; height:50px; display:flex; align-items:center;
  justify-content:space-between; padding:0 26px; font-size:13.5px; font-weight:700}
.statusbar .sigs{display:flex; align-items:center; gap:4px}
.statusbar svg{width:16px; height:11px; fill:currentColor}
.connection-status{position:absolute; top:43px; left:50%; z-index:7; transform:translateX(-50%);
  display:flex; align-items:center; gap:7px; max-width:calc(100% - 36px); padding:7px 10px;
  border:1px solid rgba(154,133,116,.22); border-radius:99px; background:rgba(255,252,248,.94);
  color:var(--ink-2); box-shadow:0 5px 16px rgba(94,63,38,.10); backdrop-filter:blur(8px);
  font-size:11.5px; font-weight:700; line-height:1.2; transition:opacity .18s}
.connection-status[data-state="synced"]{padding:5px; opacity:.56; box-shadow:none; background:transparent; border-color:transparent}
.connection-status[data-state="offline"],.connection-status[data-state="error"]{color:var(--red); border-color:rgba(196,88,92,.25)}
.connection-status[data-state="saving"]{color:var(--blue-d)}
.connection-dot{flex:0 0 auto; width:7px; height:7px; border-radius:50%; background:var(--amber)}
.connection-status[data-state="synced"] .connection-dot{background:var(--green)}
.connection-status[data-state="saving"] .connection-dot{background:var(--blue)}
.connection-status[data-state="offline"] .connection-dot,.connection-status[data-state="error"] .connection-dot{background:var(--red)}
.connection-retry{flex:0 0 auto; padding:3px 8px; border-radius:99px; background:var(--red-soft);
  color:var(--red); font-size:11px; font-weight:800}
.visually-hidden{position:absolute!important; width:1px!important; height:1px!important; padding:0!important;
  margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important}
.view{background:transparent; flex:1 1 auto; min-height:0; overflow-y:auto; display:flex; flex-direction:column;
  justify-content:safe center; gap:clamp(4px,.8vh,10px); padding:clamp(18px,4vh,36px) 22px clamp(28px,5vh,44px)}
.view::-webkit-scrollbar{width:0}
.view.pad0{padding-top:clamp(18px,3.5vh,30px); padding-right:22px;
  padding-bottom:clamp(30px,5vh,46px); padding-left:22px; justify-content:safe center}

/* 演示外壳（在手机框外，不属于产品界面） */
.demo-chrome{position:absolute; right:14px; top:58px; z-index:6;
  display:flex; flex-direction:column; align-items:flex-end; gap:6px}
.chip{padding:6px 12px; border:1px solid var(--line); border-radius:99px;
  background:rgba(255,252,248,.92); color:var(--muted); font-size:11.5px;
  backdrop-filter:blur(6px); box-shadow:var(--sh-card)}
.chip:hover{border-color:var(--warm); color:var(--warm)}
.hint-line{max-width:390px; color:var(--faint); font-size:11px; line-height:1.6; text-align:center}

/* ================= 通用 ================= */
.h1{margin:0 0 6px; font-size:26px; font-weight:800; line-height:1.28; letter-spacing:-.01em}
.h2{margin:0 0 10px; font-size:19px; font-weight:800; line-height:1.35}
.sub{margin:0 0 18px; color:var(--muted); font-size:13.5px; line-height:1.6}
.eyebrow{margin:0 0 4px; color:var(--blue); font-size:11.5px; font-weight:800; letter-spacing:.05em}
.eyebrow.warm{color:var(--warm)}
.spacer{flex:1 1 auto; min-height:10px}
.view::before{content:""; display:block; flex:.6 1 auto; min-height:0}
.view.pad0::before,.view:has(> .entry)::before,.view:has(> .family-start)::before{display:none}

.card{background:var(--card); border-radius:var(--r-lg); padding:16px 17px; box-shadow:var(--sh-card)}
.card + .card{margin-top:11px}

.btn{display:block; width:100%; padding:15px 18px; border-radius:99px; text-align:center;
  background:var(--blue); color:#fff; font-size:15.5px; font-weight:700;
  box-shadow:0 8px 20px rgba(200,121,74,.30); transition:transform .12s, opacity .12s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:#fff; color:var(--ink-2); box-shadow:var(--sh-card)}
.btn.warm{background:var(--warm); box-shadow:0 8px 20px rgba(194,112,58,.26)}
.btn.red{background:var(--red); box-shadow:0 8px 20px rgba(201,100,107,.24)}
.btn[disabled]{opacity:.42; box-shadow:none}
.btn-row{display:flex; gap:9px}
.btn-row .btn{flex:1}
.link{display:block; width:100%; padding:11px; text-align:center; color:var(--muted); font-size:13px}
.link:hover{color:var(--blue)}

/* 身份选择 */
.brandmark{display:flex; align-items:center; gap:11px; margin:14px 0 22px}
.brandmark .logo{width:44px; height:44px; border-radius:14px; display:grid; place-items:center;
  background:linear-gradient(145deg,var(--blue-soft),var(--rose-soft)); box-shadow:var(--sh-card)}
.brandmark .logo svg{width:24px; height:24px; fill:none; stroke:var(--blue-d); stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round}
.brandmark b{font-size:17px; font-weight:800}
.brandmark span{display:block; color:var(--muted); font-size:11.5px; font-weight:400}
.roles{display:grid; gap:12px}
.role{display:flex; align-items:center; gap:14px; padding:18px; text-align:left;
  border-radius:var(--r-lg); background:var(--card); box-shadow:var(--sh-card);
  transition:transform .14s}
.role:active{transform:scale(.99)}
.role .face{flex:0 0 auto; width:54px; height:54px; border-radius:50%; display:grid; place-items:center;
  font-size:27px}
.role.elder .face{background:var(--warm-soft)}
.role.family .face{background:var(--blue-soft)}
.role b{display:block; font-size:16px; margin-bottom:3px}
.role span{color:var(--muted); font-size:12.5px; line-height:1.5}
.role > span{min-width:0}
.role > span > span{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

.family-start{min-height:100%; display:flex; flex-direction:column; padding:18px 0 4px}
.family-start-head{margin-bottom:30px}
.family-start-head .sub{margin-bottom:0}
.family-start .roles{flex:1 1 auto; grid-template-rows:repeat(2,minmax(132px,1fr));
  min-height:300px; max-height:400px; gap:16px}
.family-start .role{min-height:132px; padding:26px 20px; border-radius:26px}
.family-start .role .face{width:64px; height:64px; font-size:31px}
.family-start .role b{font-size:18px}
.family-start .link{margin-top:18px}

/* 表单 */
.field{margin-bottom:14px}
.field-top{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px}
.field label{color:var(--ink-2); font-size:12.5px; font-weight:700}
.tag{padding:2px 8px; border-radius:99px; background:var(--amber-soft);
  color:var(--amber); font-size:10px; font-weight:800}
.tag[hidden]{display:none}
.field input,.field textarea,.field select{width:100%; padding:13px 15px; border:1px solid var(--line);
  border-radius:14px; background:#fff; color:var(--ink); font-size:14.5px; line-height:1.5}
.field textarea{min-height:66px; resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue); outline:none;
  box-shadow:0 0 0 3px var(--blue-soft)}
.field .hint{margin:6px 0 0; color:var(--faint); font-size:11px; line-height:1.5}
.seg{display:flex; gap:7px}
.seg button{flex:1; padding:11px 4px; border:1px solid var(--line); border-radius:13px;
  background:#fff; color:var(--muted); font-size:13.5px}
.seg button[aria-pressed="true"]{border-color:var(--blue); background:var(--blue-soft);
  color:var(--blue-d); font-weight:800}
.avatar{display:grid; place-items:center; flex:0 0 auto; border-radius:50%;
  background:var(--rose-soft); color:var(--rose); font-weight:800}
.av-lg{width:58px; height:58px; font-size:22px}
.av-md{width:44px; height:44px; font-size:17px}
.av-sm{width:34px; height:34px; font-size:13px}
.avatar-picker{width:72px; height:72px; display:grid; place-items:center; border-radius:50%;
  margin-left:auto; margin-right:auto; margin-bottom:22px; background:#E8E3DE; color:#928A82;
  font-size:34px; font-weight:500; line-height:1}

/* 说一句话 */
.speak{display:flex; align-items:center; gap:12px; width:100%; padding:14px 16px; text-align:left;
  border-radius:18px; background:linear-gradient(135deg,var(--blue-soft),var(--rose-soft));
  margin-bottom:14px}
.speak .mic{flex:0 0 auto; width:40px; height:40px; border-radius:50%; background:#fff;
  display:grid; place-items:center; box-shadow:0 4px 12px rgba(43,42,46,.10)}
.speak .mic svg{width:18px; height:18px; fill:none; stroke:var(--blue-d); stroke-width:1.9;
  stroke-linecap:round; stroke-linejoin:round}
.speak b{display:block; font-size:13.5px}
.speak span{color:var(--ink-2); font-size:11.5px; opacity:.8}
.speak.on{background:linear-gradient(135deg,#E4ECFA,#F6E4E6)}
.filled{margin:-6px 0 14px; padding:9px 13px; border-radius:12px; background:var(--green-soft);
  color:var(--green); font-size:11.5px; font-weight:700}
.voice-status{margin:-4px 0 12px; padding:9px 12px; border-radius:12px; background:var(--blue-soft);
  color:var(--blue-d); font-size:11.5px; line-height:1.5; text-align:center}
.voice-error{margin:-4px 0 12px; padding:9px 12px; border-radius:12px; background:var(--red-soft);
  color:var(--red); font-size:11.5px; line-height:1.5; text-align:center}
.voice-ask,.voice-record{display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  min-height:44px; padding:11px 14px; border:1px solid var(--blue); border-radius:16px;
  background:var(--blue-soft); color:var(--blue-d); font-size:13px; font-weight:800}
.voice-ask:active,.voice-record:active{transform:scale(.985)}
.voice-ask svg,.voice-record svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.9;
  stroke-linecap:round; stroke-linejoin:round}
.voice-record{margin:12px 0 10px; border-color:var(--warm); background:var(--warm-soft); color:var(--warm)}

/* 家庭码 */
.codebox{margin:6px 0 18px; padding:22px; text-align:center; border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--blue-soft),var(--rose-soft))}
.codebox b{display:block; font-size:38px; font-weight:800; letter-spacing:.16em; color:var(--blue-d)}
.codebox span{display:block; margin-top:6px; color:var(--ink-2); font-size:11.5px; opacity:.75}
.codein{width:100%; padding:16px; text-align:center; border:1px solid var(--line); border-radius:16px;
  background:#fff; font-size:26px; font-weight:800; letter-spacing:.24em; color:var(--ink)}
.codein:focus{border-color:var(--blue); outline:none; box-shadow:0 0 0 3px var(--blue-soft)}
.demo-sample{margin:10px 0 0; text-align:center; color:var(--muted); font-size:12px; line-height:1.5}
.demo-sample b{color:var(--blue-d); font-size:13px; letter-spacing:.08em}
.err{margin:9px 0 0; color:var(--red); font-size:12.5px}
.recent{margin-top:16px}
.recent .row{display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 14px; border-radius:14px; background:#fff; box-shadow:var(--sh-card); margin-bottom:8px}
.recent .row b{font-size:13.5px} .recent .row small{display:block; color:var(--faint); font-size:11px}
.mini{padding:6px 13px; border-radius:99px; background:var(--blue-soft); color:var(--blue-d);
  font-size:12px; font-weight:700}

/* ================= 家人端 ================= */
.f-head{margin:0 -22px 14px; padding:16px 22px 20px;
  background:linear-gradient(155deg,var(--blue-soft) 0%, var(--rose-soft) 100%)}
.f-head .eyebrow{color:var(--blue-d); opacity:.85}
.f-head .h1{font-size:23px}
.f-head .who{display:flex; align-items:center; gap:9px; margin-top:12px}
.f-head .who .avatar{background:#fff}
.f-head .who b{font-size:13px} .f-head .who small{display:block; color:var(--ink-2); font-size:11px; opacity:.7}

.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px}
.tile{padding:14px 15px; text-align:left; border-radius:var(--r-md); background:var(--card);
  box-shadow:var(--sh-card)}
.tile small{display:block; color:var(--muted); font-size:11px; margin-bottom:5px}
.tile b{font-size:14px}
.tile.alert{background:var(--red-soft)} .tile.alert b{color:var(--red)}
.tile.good b{color:var(--green)}

.map-card{border-radius:var(--r-lg); overflow:hidden; background:var(--card); box-shadow:var(--sh-card); margin-bottom:12px}
.map-card svg.map{display:block; width:100%; height:auto}
.map-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 15px}
.map-foot small{color:var(--faint); font-size:11px}
.map-foot b{font-size:13px}
.map-foot b.out{color:var(--red)}
.setup-map{height:190px; margin:10px 0 8px; border-radius:18px; overflow:hidden; background:var(--blue-soft); box-shadow:var(--sh-card)}
.setup-map-status{margin:0 0 9px; color:var(--muted); font-size:11.5px; line-height:1.45}
.setup-map-actions{display:flex; gap:8px; margin-bottom:10px}
.setup-map-actions button{flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:13px; background:#fff; color:var(--blue-d); font-size:12px; font-weight:800}
.setup-map-actions button:active{transform:scale(.985)}
.gps-pill{display:inline-flex; align-items:center; gap:6px; margin:0 0 10px; padding:6px 10px; border-radius:99px; background:var(--blue-soft); color:var(--blue-d); font-size:11px; font-weight:800}
.gps-pill.warn{background:var(--amber-soft); color:var(--amber)}
.gps-pill.bad{background:var(--red-soft); color:var(--red)}
.live-map{height:180px; border-radius:18px; overflow:hidden; margin-bottom:10px; background:var(--blue-soft)}

.banner{display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:var(--r-md);
  background:var(--blue-soft); margin-bottom:12px}
.banner .wave{flex:0 0 auto}
.banner b{display:block; font-size:13.5px; color:var(--blue-d)}
.banner small{color:var(--ink-2); font-size:11.5px; opacity:.8}
.banner.warn{background:var(--red-soft)} .banner.warn b{color:var(--red)}
.banner.note{background:var(--amber-soft); display:block} .banner.note b{color:var(--amber)}
.banner.note small{display:block; margin-top:3px}

.wave{display:flex; align-items:flex-end; gap:3px; height:22px}
.wave i{width:3px; border-radius:2px; background:var(--blue); animation:wv .9s ease-in-out infinite}
.wave.warm i{background:var(--warm)}
@keyframes wv{0%,100%{height:4px}50%{height:20px}}
@media(prefers-reduced-motion:reduce){.wave i{animation:none;height:11px!important}}

.confirm{border-radius:var(--r-lg); background:var(--card); box-shadow:var(--sh-card); padding:16px 17px; margin-bottom:12px}
.confirm > b{display:block; font-size:14px; margin-bottom:3px}
.confirm > small{display:block; color:var(--muted); font-size:11.5px; line-height:1.55; margin-bottom:12px}
.item{padding:13px 14px; border-radius:14px; background:var(--paper); margin-bottom:9px}
.item:last-child{margin-bottom:0}
.chiptype{display:inline-block; margin-bottom:6px; padding:2px 9px; border-radius:99px;
  background:var(--blue-soft); color:var(--blue-d); font-size:10px; font-weight:800}
.chiptype.todo{background:var(--amber-soft); color:var(--amber)}
.item p{margin:0 0 10px; font-size:13.5px; line-height:1.55}
.item input{width:100%; padding:10px 12px; border:1px solid var(--blue); border-radius:11px;
  background:#fff; font-size:13.5px; margin-bottom:10px}
.acts{display:flex; flex-wrap:wrap; gap:7px}
.acts button{padding:7px 14px; border-radius:99px; background:#fff; color:var(--muted);
  font-size:12px; font-weight:700; box-shadow:0 1px 4px rgba(43,42,46,.07)}
.acts button.go{background:var(--blue); color:#fff}
.done-line{margin:0; font-size:11.5px; font-weight:700; color:var(--green)}
.skip-line{margin:0; font-size:11.5px; font-weight:700; color:var(--faint)}
.struck{color:var(--faint); text-decoration:line-through}

.tl{margin:0}
.tl .row{display:flex; gap:12px; padding:13px 0; border-bottom:1px solid var(--line)}
.tl .row:last-child{border-bottom:0}
.tl time{flex:0 0 auto; width:42px; color:var(--blue); font-size:12px; font-weight:800;
  font-variant-numeric:tabular-nums; padding-top:1px}
.tl p{margin:0; font-size:13.5px; line-height:1.5}
.empty{padding:30px 18px; text-align:center; color:var(--faint); font-size:12.5px;
  border-radius:var(--r-lg); background:var(--card); box-shadow:var(--sh-card)}

.detail{padding:15px 16px; border-radius:var(--r-md); background:var(--red-soft); margin-bottom:12px}
.detail.ok{background:var(--green-soft)}
.detail dt{color:var(--red); font-size:11px; font-weight:800; margin-bottom:2px}
.detail.ok dt{color:var(--green)}
.detail dd{margin:0 0 11px; font-size:13.5px; line-height:1.5}
.detail dd:last-child{margin-bottom:0}

.person-row{display:flex; align-items:center; gap:12px; width:100%; padding:13px 14px; text-align:left;
  border-radius:var(--r-md); background:var(--card); box-shadow:var(--sh-card); margin-bottom:9px}
.person-row b{display:block; font-size:14px}
.person-row small{color:var(--muted); font-size:11.5px}
.person-row .me{margin-left:auto; padding:3px 9px; border-radius:99px;
  background:var(--green-soft); color:var(--green); font-size:10px; font-weight:800}
.person-row .go{margin-left:auto; color:var(--faint); font-size:17px}

.tabbar{flex:0 0 auto; display:flex; padding:8px 12px 22px; background:rgba(255,255,255,.92);
  border-top:1px solid var(--line); backdrop-filter:blur(10px)}
.tabbar button{flex:1; display:grid; justify-items:center; gap:4px; padding:5px 0;
  color:var(--faint); font-size:10.5px; font-weight:700; position:relative}
.tabbar svg{width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round}

.screen.elder{background:#FFFCF8}

  text-align:center; gap:14px}
.e-ring{width:132px; height:132px; border-radius:50%; display:grid; place-items:center;
  background:linear-gradient(150deg,var(--warm-soft),var(--rose-soft));
  color:var(--warm); font-size:52px; font-weight:800}
.e-h1{margin:0; font-size:34px; font-weight:800; letter-spacing:-.01em}
.e-copy{margin:0; color:var(--ink-2); font-size:17px; line-height:1.6}
.e-btn{flex:0 0 auto; width:100%; margin-top:16px; padding:22px; border-radius:30px;
  background:var(--warm); color:#fff; font-size:24px; font-weight:800;
  box-shadow:0 12px 26px rgba(194,112,58,.3)}
.e-btn:active{transform:scale(.99)}
.e-btn.soft{background:#fff; color:var(--ink-2); box-shadow:var(--sh-card); font-size:19px; padding:17px}
.e-btn.red{background:var(--red); box-shadow:0 12px 26px rgba(201,100,107,.28)}

.e-call{flex:1; display:flex; flex-direction:column; text-align:center}
.e-call .lbl{margin:14px 0 4px; color:var(--muted); font-size:14px}
.e-call .nm{margin:0 0 20px; font-size:38px; font-weight:800}
.pcard{text-align:left; padding:20px; border-radius:26px; background:#fff; box-shadow:var(--sh-card)}
.pcard .top{display:flex; align-items:center; gap:14px; margin-bottom:14px}
.pcard .top b{font-size:20px; line-height:1.35}
.pcard p{margin:0 0 8px; color:var(--ink-2); font-size:16px; line-height:1.6}
.pcard p:last-child{margin:0}
.pcard .avatar{width:62px; height:62px; font-size:24px; background:var(--warm-soft); color:var(--warm)}
.ctrl{display:flex; justify-content:space-around; margin-top:auto; padding-top:26px}
.ctrl button{display:grid; justify-items:center; gap:8px; color:var(--muted); font-size:13px; font-weight:700}
.ctrl i{width:70px; height:70px; border-radius:50%; display:grid; place-items:center; color:#fff}
.ctrl svg{width:29px; height:29px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.ctrl .no i{background:var(--red); box-shadow:0 10px 22px rgba(201,100,107,.3)}
.ctrl .yes i{background:var(--green); box-shadow:0 10px 22px rgba(94,158,130,.3)}

.audio-tag{display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:99px;
  background:var(--warm-soft); color:var(--warm); font-size:11.5px; font-weight:800}
.subs{flex:1; min-height:0; overflow-y:auto; margin:14px 0; padding:16px; border-radius:20px; background:#fff;

.thread{flex:1; display:flex; flex-direction:column; gap:12px; overflow-y:auto; padding:4px 0 8px}
.bub{max-width:92%; padding:15px 17px; border-radius:22px; font-size:17px; line-height:1.55}
.bub.me{align-self:flex-end; background:var(--blue-soft); border-bottom-right-radius:7px}
.bub.ai{align-self:flex-start; background:#fff; box-shadow:var(--sh-card); border-bottom-left-radius:7px}
.bub.ai .vr{display:flex; align-items:center; gap:7px; margin-bottom:7px; color:var(--warm);
  font-size:12px; font-weight:800}
.bub.ai .vr svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round}
.bub.ai p{margin:0; font-size:19px; font-weight:700; line-height:1.55}
.src{align-self:flex-start; margin:0; padding:7px 13px; border-radius:99px; background:var(--green-soft);
  color:var(--green); font-size:12px; font-weight:700}
.src.unk{background:#F2F0F0; color:var(--muted)}
.asks{flex:0 0 auto; display:grid; gap:9px; margin-top:14px}
.askbtn{padding:16px 18px; text-align:left; border-radius:22px; background:#fff;
  box-shadow:var(--sh-card); font-size:17px; line-height:1.4}
.askbtn:active{background:var(--warm-soft)}
.holdbar{flex:0 0 auto; margin-top:10px; padding:14px; text-align:center; border-radius:99px;
  border:1.5px dashed var(--warm); color:var(--warm); font-size:14px; font-weight:800}

.lmk{position:relative; min-height:190px; margin:12px 0 16px; border-radius:26px; overflow:hidden;
  display:grid; place-items:center; background:linear-gradient(150deg,var(--blue-soft),var(--rose-soft))}
.lmk .shape{width:150px; height:88px; border:14px solid var(--warm); border-top:0; transform:skew(-8deg); opacity:.92}
.lmk .shape.shop{border-color:var(--blue); border-radius:0 0 10px 10px; transform:none}
.lmk .shape.home{border-color:var(--green); border-top:14px solid var(--green); border-radius:8px; transform:none}
.lmk .nm{position:absolute; left:14px; bottom:14px; padding:6px 13px; border-radius:99px;
  background:rgba(23,22,26,.82); color:#fff; font-size:13px; font-weight:700}
.stepno{margin:0 0 6px; color:var(--muted); font-size:14px; font-weight:700}
.stepcopy{margin:0 0 10px; font-size:26px; font-weight:800; line-height:1.45}
.stepnote{margin:0; color:var(--muted); font-size:14px; line-height:1.55}
.vr-line{display:flex; align-items:center; gap:7px; margin-bottom:8px; color:var(--warm); font-size:13px; font-weight:800}
.vr-line svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

.devbar{flex:0 0 auto; margin-top:14px; padding-top:12px; border-top:1px dashed #E3DEDA}
.devbar .hd{display:flex; align-items:center; justify-content:space-between; width:100%;

.devbar .bd{margin-top:11px}

/* =====================================================================
   2. 数据层：Supabase 匿名身份 + 实时同步
      family payload 只保存在 Supabase；浏览器仅记住所选家庭和设备身份。
   ===================================================================== */
var SROLE="alz:device-role", SCODE="alz:device-code", SME="alz:device-member";

function sessionGet(key){
  try{ return sessionStorage.getItem(key); }catch(_error){ return null; }
}
function rememberDevice(role,code,memberId){
  try{
    var previousCode=sessionStorage.getItem(SCODE);
    sessionStorage.setItem(SROLE,role); sessionStorage.setItem(SCODE,code);
    if(memberId) sessionStorage.setItem(SME,memberId);
    else if(previousCode!==code || role!=="family") sessionStorage.removeItem(SME);
    if(window.localStorage && /^\d{6}$/.test(String(code||""))) window.localStorage.setItem("remember-us-demo-code",String(code));
  }catch(_error){ /* Device labels are best-effort metadata only. */ }
}
function clearDevice(){
  try{
    sessionStorage.removeItem(SROLE); sessionStorage.removeItem(SCODE); sessionStorage.removeItem(SME);
  }catch(_error){ /* Supabase remains the family-data source of truth. */ }
}
function selectedMemberId(){ return sessionGet(SME); }

var HOME={x:130,y:90}, MPP=13.33;

function newFamily(code, lang){
  var s=SEED[lang]||SEED.zh;
  return {
    code:code, lang:lang, rev:0,
    setup:false, paired:false,
    elder:{ name:s.elderName, address:s.address, radius:"800" },
    home:{ lat:null, lng:null, label:s.address, radiusM:800 },
    people:[],
    facts:[], pending:[],
    timeline:[{t:"09:10", kind:"morning"}],
    call:{ phase:"idle", personId:null, line:-1, transcript:"" },
    lastCaller:null,
    thread:[], askCounts:{},
    loc:{ x:HOME.x, y:HOME.y, lat:null, lng:null, accuracy:null, updatedAt:null, source:"demo", status:"demo" },
    risk:{ state:"safe", distanceM:null, outsideCount:0, triggeredAt:null, reason:"" },
    guide:{ active:false, step:0, done:false, instructions:[], routeId:null }
  };
}

var Connection={state:"connecting", authenticated:false, initFailed:false, pendingAction:false};
var Store=null;

function connectionCopy(state){
  var copy=D||I18N[lang]||I18N.zh;
  var keys={connecting:"syncConnecting",loading:"syncLoading",saving:"syncSaving",offline:"syncOffline",error:"syncError",synced:"syncSynced"};
  return copy[keys[state]||"syncError"];
}
function protectedActionSelector(){
  return '[data-f],[data-range],[data-ask],[data-item-do],[data-item-edit],[data-item-skip],[data-item-save],[data-item-cancel],'
    +'[data-go="create"],[data-go="pair"],[data-go="finishSetup"],[data-go="addPerson"],[data-go="clearPending"],'
    +'[data-go="call"],[data-go="answer"],[data-go="decline"],[data-go="hangup"],[data-go="arrived"],'
    +'[data-go="ackHome"],[data-go="walk"],[data-go="goHome"],[data-go="reset"],[data-go="speak"],[data-go="voiceAsk"],[data-go="callRecord"]';
}
function syncActionAvailability(){
  var blocked=!Connection.authenticated || Connection.initFailed || Connection.pendingAction || Connection.state==="connecting" || Connection.state==="loading";
  var controls=document.querySelectorAll(protectedActionSelector());
  Array.prototype.forEach.call(controls,function(control){ control.disabled=blocked; });
}
function setConnectionStatus(state,message,useMessage){
  var allowed={connecting:1,loading:1,saving:1,offline:1,error:1,synced:1};
  Connection.state=allowed[state]?state:"error";
  var status=el("connectionStatus"), text=el("connectionStatusText"), retry=status&&status.querySelector('[data-go="retryConnection"]');
  if(status) status.setAttribute("data-state",Connection.state);
  if(text){
    text.textContent=useMessage&&message?message:connectionCopy(Connection.state);
    text.className=Connection.state==="synced"?"connection-copy visually-hidden":"connection-copy";
  }
  if(retry){
    retry.hidden=!(Connection.initFailed && (Connection.state==="error" || Connection.state==="offline"));
    retry.textContent=(D||I18N[lang]||I18N.zh).syncRetry;
  }
  syncActionAvailability();
}
function storeRole(){ return Store&&Store.role?Store.role():sessionGet(SROLE); }
function reportStoreError(error){
  var copy=D||I18N[lang]||I18N.zh;
  if(error&&error.code==="REVISION_CONFLICT") setConnectionStatus("error",copy.syncConflict,true);
  else if(Connection.state!=="offline") setConnectionStatus("error");
  return null;
}
function persistUpdate(mutator){
  return Store.update(mutator).catch(function(error){
    reportStoreError(error);
    throw error;
  });
}
function queueUpdate(mutator){ void persistUpdate(mutator).catch(function(){}); }
async function runPendingAction(action){
  if(Connection.pendingAction) return null;
  Connection.pendingAction=true; syncActionAvailability();
  try{ return await action(); }
  finally{ Connection.pendingAction=false; syncActionAvailability(); }
}

try{
  var browserSessionStorage=window.sessionStorage||window.localStorage;
  var SupabaseClient=window.supabase.createClient(
    window.SUPABASE_CONFIG.url,
    window.SUPABASE_CONFIG.publishableKey,
    {auth:{storage:browserSessionStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}
  );
  window.SupabaseClient=SupabaseClient;
  Store=window.createSupabaseStore({
    client:SupabaseClient,
    newFamily:newFamily,
    storage:browserSessionStorage,
    onStatus:setConnectionStatus
  });
}catch(_error){
  Connection.initFailed=true;
  setConnectionStatus("error");
}

/* =====================================================================
   3. 工具
   ===================================================================== */
function el(id){ return document.getElementById(id); }
function fill(s,o){ return String(s).replace(/\{(\w+)\}/g,function(_,k){ return o[k]!==undefined?o[k]:"{"+k+"}"; }); }
function initial(n){
  n=(n||"").trim(); if(!n) return "?";
  return /[一-龥]/.test(n) ? n.charAt(n.length-1) : n.charAt(0).toUpperCase();
}
function focusPerson(s){
  if(!s || !s.people.length) return {nick:"",relation:"",recent:"",hint:""};
  if(s.lastCaller){
    for(var i=0;i<s.people.length;i++) if(s.people[i].id===s.lastCaller) return s.people[i];
  }
  return s.people[0];
}
function tp(str, s){
  str=String(str);
  if(str.indexOf("{")<0) return str;
  s=s||St;
  if(!s) return str;
  var p=focusPerson(s);
  return str.replace(/\{(nick|elder|rel|code)\}/g, function(_,k){
    if(k==="nick") return p.nick||"";
    if(k==="elder") return s.elder.name||"";
    if(k==="rel") return p.relation||"";
    return s.code||"";
  });
}
function esc(v,s){
  return tp(v,s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; });
}
function homePoint(s){
  return s && s.home && Number.isFinite(Number(s.home.lat)) && Number.isFinite(Number(s.home.lng))
    ? {lat:Number(s.home.lat),lng:Number(s.home.lng)} : null;
}
function currentPoint(s){
  return s && s.loc && Number.isFinite(Number(s.loc.lat)) && Number.isFinite(Number(s.loc.lng))
    ? {lat:Number(s.loc.lat),lng:Number(s.loc.lng)} : null;
}
function distOf(s){
  var live=homePoint(s)&&currentPoint(s)&&window.Navigation ? window.Navigation.distanceMeters(currentPoint(s),homePoint(s)) : null;
  if(live!==null) return live;
  var dx=s.loc.x-HOME.x, dy=s.loc.y-HOME.y; return Math.round(Math.sqrt(dx*dx+dy*dy)*MPP);
}
function rangeM(s){ return s && s.home && Number.isFinite(Number(s.home.radiusM)) ? Number(s.home.radiusM) : parseInt(s.elder.radius,10); }
function isOut(s){ return distOf(s)>rangeM(s); }
function clockNow(){ var d=new Date(); return d.getHours()+":"+("0"+d.getMinutes()).slice(-2); }
function waveEl(cls){ var h='<span class="wave '+(cls||"")+'">'; for(var i=0;i<7;i++) h+='<i style="animation-delay:'+(i*.09)+'s"></i>'; return h+'</span>'; }
function voiceStatusHTML(){
  if(App.voiceError) return '<p class="voice-error">'+esc(App.voiceError)+'</p>';
  if(App.voiceStatus) return '<p class="voice-status">'+esc(App.voiceStatus)+'</p>';
  return '';
}
function gpsStatusHTML(){
  var cls=App.gpsError?" bad":(St&&St.loc&&St.loc.status==="ready"?"":" warn");
  var text=App.gpsError || (St&&St.loc&&St.loc.status==="ready"?D.gpsReady:D.gpsStarting);
  return '<span class="gps-pill'+cls+'">● '+esc(text)+'</span>';
}
function setHomePoint(point){
  if(!point || !Number.isFinite(Number(point.lat)) || !Number.isFinite(Number(point.lng))) return;
  queueUpdate(function(s){
    s.home=s.home||{};
    s.home.lat=Number(point.lat); s.home.lng=Number(point.lng);
    s.home.label=s.elder.address||s.home.label||"";
    s.home.radiusM=parseInt(s.elder.radius,10)||800;
  });
}
function ensureHomePointFromAddress(){
  var home=homePoint(St);
  if(home) return Promise.resolve(home);
  var address=St&&St.elder&&St.elder.address?String(St.elder.address).trim():"";
  if(!address && St){
    address=(SEED[St.lang]||SEED.zh).address;
    queueUpdate(function(s){
      s.elder=s.elder||{};
      if(!s.elder.address) s.elder.address=address;
      s.home=s.home||{};
      if(!s.home.label) s.home.label=address;
    });
  }
  if(!address || !window.Navigation || typeof window.Navigation.geocodeAddress!=="function") return Promise.resolve(null);
  if(App.homeGeocodePromise) return App.homeGeocodePromise;
  if(App.homeGeocodeRequested===address) return Promise.resolve(null);
  App.homeGeocodeRequested=address;
  App.homeGeocodePromise=window.Navigation.geocodeAddress(address).then(function(point){
    setHomePoint(point);
    if(App.homeMapController) App.homeMapController.setHome(point);
    return point;
  },function(){ return null; }).then(function(point){
    App.homeGeocodePromise=null;
    return point;
  });
  return App.homeGeocodePromise;
}
function homeMapStatus(){
  return homePoint(St) ? D.mapReady : D.mapPickHint;
}
function initHomeMap(){
  var node=el("homeMap");
  if(!node || !window.Navigation || App.homeMapElement===node) return;
  App.homeMapElement=node;
  ensureHomePointFromAddress().then(function(){
    var status=el("homeMapStatus");
    if(status && homePoint(St)) status.textContent=D.mapReady;
  });
  var center=homePoint(St)||{lat:1.2931,lng:103.7758};
  window.Navigation.createMap(node,{center:center,homeTitle:D.mapHome,currentTitle:D.gpsReady,onHomeSelect:setHomePoint})
    .then(function(controller){
      if(App.homeMapElement!==node) return;
      App.homeMapController=controller;
      var home=homePoint(St); if(home) controller.setHome(home);
      var current=currentPoint(St); if(current) controller.setCurrent(current);
    })
    .catch(function(){
      var status=el("homeMapStatus");
      if(status) status.textContent=D.mapMissing;
    });
}
function initGuideMap(){
  var node=el("guideMap"), home=homePoint(St), current=currentPoint(St);
  if(!node || !home || !current || !window.Navigation || App.guideMapElement===node) return;
  App.guideMapElement=node;
  window.Navigation.createMap(node,{center:current,homeTitle:D.mapHome,currentTitle:D.gpsReady})
    .then(function(controller){
      if(App.guideMapElement!==node) return;
      App.guideMapController=controller; controller.setHome(home); controller.setCurrent(current);
      if(App.guideRouteRequested) return;
      App.guideRouteRequested=true;
      return controller.routeHome(current,home).then(function(route){
        var steps=[];
        var legs=route&&route.legs||[];
        var raw=legs[0]&&legs[0].steps||[];
        for(var i=0;i<raw.length;i++){
          var text=String(raw[i].instructions||"").replace(/<[^>]+>/g,"").trim();
          var end=raw[i].end_location;
          if(text && end) steps.push({text:text,end:{lat:end.lat(),lng:end.lng()},distanceM:raw[i].distance?raw[i].distance.value:null});
        }
        if(steps.length){
          queueUpdate(function(s){ s.guide.instructions=steps; s.guide.routeId="google-walking"; s.guide.step=0; });
          if(window.Voice) window.Voice.speak(steps[0].text,{lang:St.lang});
        }
      }).catch(function(){ /* fixed landmark instructions remain the fallback */ });
    })
    .catch(function(){ /* no map key or unavailable API: use the original guide */ });
}
function setHomeFromGps(){
  if(!window.Navigation) return;
  App.gpsError=""; App.gpsStatus="starting"; render();
  window.Navigation.locate(function(position){
    setHomePoint({lat:position.coords.latitude,lng:position.coords.longitude});
    App.gpsStatus="ready"; App.gpsError=""; render();
  },function(){
    App.gpsStatus="error"; App.gpsError=D.gpsDenied; render();
  });
}
function applyGpsPosition(position){
  if(!position || !position.coords) return;
  var point={lat:Number(position.coords.latitude),lng:Number(position.coords.longitude)};
  var speak=false;
  queueUpdate(function(s){
    var home=homePoint(s), oldRisk=s.risk&&s.risk.state||"safe";
    s.loc=s.loc||{};
    s.loc.lat=point.lat; s.loc.lng=point.lng;
    s.loc.accuracy=Math.round(Number(position.coords.accuracy)||0);
    s.loc.updatedAt=new Date().toISOString(); s.loc.source="gps"; s.loc.status="ready";
    if(!home) return;
    var distance=window.Navigation.distanceMeters(point,home);
    s.risk=s.risk||{}; s.risk.distanceM=distance; s.risk.reason="";
    if(distance>rangeM(s)){
      s.risk.outsideCount=Number(s.risk.outsideCount||0)+1;
      if(s.risk.outsideCount<3){ s.risk.state="safe"; s.risk.reason="checking_position"; return; }
      s.risk.state=(oldRisk==="safe"||oldRisk==="returned")?"leaving":"guiding";
      s.risk.reason="outside_safe_radius";
      if(oldRisk==="safe"||oldRisk==="returned"){
        s.risk.triggeredAt=new Date().toISOString(); speak=true;
        App.guideRouteRequested=false;
        s.guide.active=true; s.guide.done=false; s.guide.step=0;
        var seen=false; for(var i=0;i<s.timeline.length;i++) if(s.timeline[i].kind==="guide") seen=true;
        if(!seen) s.timeline.push({t:clockNow(),kind:"guide"});
      }
    } else if(s.guide.active && distance<=50){
      s.risk.outsideCount=0;
      s.risk.state="guiding"; s.risk.reason="near_home_waiting_confirmation";
    } else {
      s.risk.outsideCount=0;
      s.risk.state="safe"; s.risk.reason="inside_safe_radius";
    }
  });
  App.gpsStatus="ready"; App.gpsError="";
  if(App.homeMapController) App.homeMapController.setCurrent(point);
  if(App.guideMapController) App.guideMapController.setCurrent(point);
  if(speak && App.route==="elder" && window.Voice) window.Voice.speak(D.riskLeaving,{lang:St.lang});
}
function startGps(){
  if(!window.Navigation || window.Navigation.isWatching() || App.gpsStartPending) return;
  App.gpsStartPending=true;
  App.gpsStatus="starting"; App.gpsError=""; render();
  ensureHomePointFromAddress().then(function(){
    App.gpsStartPending=false;
    if(App.route!=="elder" || window.Navigation.isWatching()) return;
    window.Navigation.start(applyGpsPosition,function(positionError){
      App.gpsStatus="error";
      App.gpsError=positionError&&positionError.code==="permission_denied"?D.gpsDenied:D.gpsFailed;
      if(St){ queueUpdate(function(s){ s.loc=s.loc||{}; s.loc.status="error"; }); }
      render();
    });
  });
}
function stopGps(){ App.gpsStartPending=false; if(window.Navigation) window.Navigation.stop(); App.gpsStatus="idle"; }

      h+='<p style="margin:0 0 8px;font-size:14px;font-weight:700">「'+esc(St.pending[j].text || D.asks[St.pending[j].ask])+'」</p>';

  }

  h+='<div class="card" style="margin-top:14px"><b style="font-size:13.5px">'+esc(D.familyCodeT)+'</b>'

/* =====================================================================
   8. 渲染
   ===================================================================== */
function render(s){
  if(s!==undefined) St=s;
  D = I18N[St ? St.lang : lang];

  if(typing){ patchLight(); return; }

  var screen=el("screen"), view=el("view"), body="", isElder=false, chrome="";
  el("clock").textContent = clockNow();

  if(App.route==="entry")            body=viewEntry();
  else if(App.route==="familyStart") body=viewFamilyStart();
  else if(App.route==="obElder")     body=viewObElder();
  else if(App.route==="obMe")        body=viewObMe();
  else if(App.route==="code")        body=viewCode();
  else if(App.route==="join")        body=viewJoin();
  else if(App.route==="elder"){
    isElder=true;
    var sc=elderScreen();
    body = sc==="paired"?viewPaired() : sc==="ringing"?viewRinging() : sc==="talking"?viewTalking()
         : sc==="qa"?viewQa() : sc==="guide"?viewGuide() : sc==="arrived"?viewArrived() : viewStandby();
  }
  else if(App.route==="family"){
    body = (App.tab===0?tabHome() : App.tab===1?tabToday() : App.tab===2?tabAlerts() : tabPeople());
  }

  screen.classList.toggle("elder", isElder);
  view.classList.toggle("pad0", App.route==="family");
  view.className = (isElder ? "e-view" : "view") + (App.route==="family" ? " pad0" : "");
  view.innerHTML = body;

  /* 家人端底部 tab bar 在 view 之外 */
  var old=screen.querySelector(".tabbar"); if(old) old.remove();
  if(App.route==="family" && !App.editingPerson) screen.insertAdjacentHTML("beforeend", tabbar());

  /* 手机框外的演示外壳 */
  var lab=el("deviceLabel");
  var who = App.route==="elder" ? D.labelElder : (App.route==="family"||App.route==="obElder"||App.route==="obMe"||App.route==="code" ? D.labelFamily : D.labelEntry);
  lab.className="device-label "+(App.route==="elder"?"elder":(App.route==="family"?"family":""));
  lab.querySelector("span").textContent = who + (St && St.code ? " · " + St.code : "");

  chrome='<button class="chip" data-go="lang">'+esc(D.langBtn)+'</button>';
  if(St&&St.code) chrome+='<button class="chip" data-go="reset">'+esc(D.resetBtn)+'</button>';
  if(storeRole()) chrome+='<button class="chip" data-go="exit">'+esc(D.exitBtn)+'</button>';
  el("chrome").innerHTML=chrome;
  el("hintLine").textContent = App.route==="elder" ? D.hintElder
    : (App.route==="family" ? D.hintFamily : D.hintEntry);

  bindInputs();
  if(App.route==="obElder") initHomeMap();
  if(App.route==="elder" && St && St.guide && St.guide.active) initGuideMap();
  var th=view.querySelector(".thread"); if(th) th.scrollTop=th.scrollHeight;
  syncSubs();
  setConnectionStatus(Connection.state);
}

function patchLight(){
  var av=document.querySelector('[data-bind="av"]');
  if(av){ var p=editTarget(); if(p) av.textContent=initial(p.nick); }
}

function bindInputs(){
  var ns=el("view").querySelectorAll("[data-f]");
  Array.prototype.forEach.call(ns,function(n){
    n.addEventListener("input",function(){
      var path=n.getAttribute("data-f");
      typing=true;
      queueUpdate(function(s){ setPath(s,path,n.value); });
      typing=false;
      var tag=n.parentNode.querySelector(".tag");
      if(tag){
        var k=path.split(".").pop(); if(k==="name") k="elderName";
        tag.hidden = (n.value !== SEED[St.lang][k]);
      }
    });
  });
}

/* =====================================================================
   9. 行为
   ===================================================================== */
function newPerson(lang, blank){
  var s=SEED[lang];
  return { id:"p"+Date.now()+Math.floor(Math.random()*100),
    nick: blank?"":s.nick, relation: blank?"":s.relation, phone: blank?"":s.phone,
    recent: blank?"":s.recent, hint: blank?"":s.hint };
}

function syncSubs(){
  var talking = App.route==="elder" && St && St.call.phase==="talking";
  if(talking && !subTimer){
    subTimer=setInterval(function(){
      var s=Store.get();
      if(!s || s.call.phase!=="talking"){ stopSubs(); return; }
      if(s.call.line+1 >= I18N[s.lang].callLines.length){ stopSubs(); endCall(); return; }
      var nextLine=s.call.line+1;
      var line=I18N[s.lang].callLines[nextLine];
      queueUpdate(function(x){ x.call.line++; });
      if(line && window.Voice) window.Voice.speak(line[1],{lang:s.lang});
    },2200);
  } else if(!talking && subTimer){ stopSubs(); }
}
function stopSubs(){ clearInterval(subTimer); subTimer=null; }

function endCall(){
  queueUpdate(function(s){
    s.call.phase="ended";
    if(!s.facts.length) s.facts=[
      {id:"visit",type:"fact",key:"factVisit",text:null,status:"open"},
      {id:"pill", type:"todo",key:"factPill", text:null,status:"open"}
    ];
    var seen=false;
    for(var i=0;i<s.timeline.length;i++) if(s.timeline[i].kind==="call") seen=true;
    if(!seen) s.timeline.push({t:clockNow(),kind:"call"});
  });
}

function setLoc(x,y){
  var started=false;
  queueUpdate(function(s){
    s.loc.x=x; s.loc.y=y;
    if(!s.guide.active && !s.guide.done && distOf(s)>rangeM(s)){
      s.guide.active=true; s.guide.step=0;
      s.guide.instructions=[]; s.guide.routeId=null; App.guideRouteRequested=false;
      s.timeline.push({t:clockNow(),kind:"guide"});
      started=true;
    }
  });
  if(started && App.route==="elder" && window.Voice) window.Voice.speak(D.guide[0].copy,{lang:St.lang});
}
function autoWalk(){
  clearInterval(walkTimer);
  queueUpdate(function(s){ s.guide.done=false; s.guide.step=0; s.loc.x=HOME.x; s.loc.y=HOME.y; });
  var i=0,n=20, from={x:HOME.x,y:HOME.y}, to={x:56,y:36};
  walkTimer=setInterval(function(){
    i++; var p=i/n;
    setLoc(from.x+(to.x-from.x)*p, from.y+(to.y-from.y)*p);
    if(i>=n) clearInterval(walkTimer);
  },120);
}
function guideText(item){ return item&&typeof item==="object"?item.text:String(item||""); }
function guideTotal(s){ return s&&s.guide&&s.guide.instructions&&s.guide.instructions.length?s.guide.instructions.length:3; }
function guideDistance(item, point){
  return item&&item.end&&point&&window.Navigation ? window.Navigation.distanceMeters(point,item.end) : null;
}
function advanceGuide(){
  if(!St||!St.guide||!St.guide.active) return;
  var nextText="", advanced=false, completed=false;
  queueUpdate(function(s){
    var list=s.guide.instructions||[], total=list.length||3;
    s.guide.step++;
    advanced=true;
    if(s.guide.step>=total || (homePoint(s)&&currentPoint(s)&&window.Navigation.distanceMeters(homePoint(s),currentPoint(s))<=50)){
      s.guide.active=false; s.guide.done=true;
      s.loc.x=HOME.x; s.loc.y=HOME.y;
      s.risk=s.risk||{}; s.risk.state="returned"; s.risk.outsideCount=0; s.risk.reason="inside_home_radius";
      completed=true;
      var seen=false;
      for(var i=0;i<s.timeline.length;i++) if(s.timeline[i].kind==="home") seen=true;
      if(!seen) s.timeline.push({t:clockNow(),kind:"home"});
    } else {
      nextText=guideText(list[s.guide.step]);
    }
  });
  if(advanced && App.route==="elder" && window.Voice){
    window.Voice.speak(completed?D.eHomeT:(nextText||D.guide[Math.min(St.guide.step,2)].copy),{lang:St.lang});
  }
}
function arrived(){
  advanceGuide();
}

function factById(s,id){ for(var i=0;i<s.facts.length;i++) if(s.facts[i].id===id) return s.facts[i]; return null; }

function ask(i, questionText){
  var answerText="";
  queueUpdate(function(s){
    var displayQuestion=questionText ? String(questionText).trim() : tp(D.asks[i],s);
    s.thread.push({role:"me",ask:i,text:questionText?displayQuestion:null});
    var key,src,text=null,f;
    if(i===0){
      f=factById(s,"visit");
      if(f && f.status==="done"){ if(f.text){ key="ansFromFact"; text=f.text; src="srcFact"; } else key="ansVisit"; src="srcFact"; }
      else { key="ansNoConfirm"; src="srcUnk"; }
      s.askCounts.visit=(s.askCounts.visit||0)+1;
      var row=null;
      for(var k=0;k<s.timeline.length;k++) if(s.timeline[k].kind==="qa") row=s.timeline[k];
      if(row) row.n=s.askCounts.visit; else s.timeline.push({t:clockNow(),kind:"qa",n:1});
    } else if(i===1){
      f=factById(s,"pill");
      if(f && f.status==="done"){ if(f.text){ key="ansFromTodo"; text=f.text; src="srcTodo"; } else key="ansPill"; src="srcTodo"; }
      else { key="ansNoConfirm"; src="srcUnk"; }
    } else {
      key="ansUnknown"; src="srcUnk";
      var dup=false;
      for(var j=0;j<s.pending.length;j++) if(s.pending[j].ask===i && (s.pending[j].text||"")=== (questionText||"")) dup=true;
      if(!dup) s.pending.push({id:"q"+Date.now(),ask:i,text:questionText?displayQuestion:null});
      var seen=false;
      for(var q=0;q<s.timeline.length;q++) if(s.timeline[q].kind==="unknown") seen=true;
      if(!seen) s.timeline.push({t:clockNow(),kind:"unknown"});
    }
    s.thread.push({role:"ai",key:key,src:src,text:text});
    answerText=text ? fill(D[key],{text:text}) : D[key];
  });
  if(window.Voice && answerText) window.Voice.speak(tp(answerText,Store.get()),{lang:St.lang});
}

function setItem(id,status){
  queueUpdate(function(s){ var f=factById(s,id); if(f) f.status=status; });
}

function voiceStatusText(status){
  var zh=St && St.lang==="zh";
  if(status==="listening") return zh?"正在听，请说话……":"Listening…";
  if(status==="recording") return zh?"正在录音……":"Recording…";
  if(status==="transcribing") return zh?"正在识别语音……":"Transcribing…";
  return zh?"语音已识别，可以直接修改。":"Voice captured. You can edit it now.";
}
function voiceFailure(error){
  var context=App.voiceContext;
  App.voiceBusy=false; App.voiceSession=null; App.voiceContext=null;
  if(context==="call") App.callRecording=false;
  App.voiceStatus="";
  App.voiceError=(error && error.code==="unsupported") ? D.voiceUnsupported : ((error&&error.message)||D.voiceUnsupported);
  if(context==="profile") App.speak=0;
  render();
}
function finishVoiceText(text, context){
  text=String(text||"").trim();
  if(!text) throw new Error("empty_transcript");
  if(context==="profile"){
    App.speak=2;
    queueUpdate(function(s){
      for(var i=0;i<s.people.length;i++) if(s.people[i].id===App.editingPerson){
        s.people[i].recent=text;
        s.people[i].hint=text;
        if(!s.people[i].nick) s.people[i].nick=SEED[s.lang].nick;
        if(!s.people[i].relation) s.people[i].relation=SEED[s.lang].relation;
      }
    });
    App.voiceStatus=voiceStatusText("done");
  } else if(context==="qa"){
    askVoiceQuestion(text);
    App.voiceStatus=voiceStatusText("done");
  } else if(context==="call"){
    queueUpdate(function(s){ s.call.transcript=(s.call.transcript? s.call.transcript+"\n":"")+text; });
    App.voiceStatus=voiceStatusText("done");
    App.callRecording=false;
  }
  App.voiceBusy=false; App.voiceSession=null; App.voiceContext=null; render();
}
async function startVoiceInput(context, forceRecording){
  if(!window.Voice || App.voiceBusy) return;
  App.voiceBusy=true; App.voiceContext=context; App.voiceError="";
  App.voiceStatus=voiceStatusText(forceRecording?"recording":"listening");
  if(context==="profile") App.speak=1;
  render();
  try{
    var session=await window.Voice.startInput({
      lang:St?St.lang:lang,
      forceRecording:!!forceRecording,
      maxDurationMs:30000,
      onStatus:function(status){ App.voiceStatus=voiceStatusText(status); render(); }
    });
    App.voiceSession=session;
    var text=await session.result;
    finishVoiceText(text,context);
  }catch(error){ voiceFailure(error); }
}
async function stopVoiceInput(){
  if(!App.voiceSession) return;
  try{ await App.voiceSession.stop(); }catch(error){ voiceFailure(error); }
}
function askVoiceQuestion(text){
  var lower=String(text).toLowerCase();
  var index=(/药|吃药|服药|medicine|pill|medication/.test(lower))?1
    :(/医院|看病|医生|复诊|visit|doctor|hospital|appointment/.test(lower))?0:2;
  ask(index,text);
}
function toggleCallRecording(){
  if(App.callRecording){
    App.callRecording=false;
    stopVoiceInput();
    return;
  }
  App.callRecording=true;
  startVoiceInput("call",true);
}
function doSpeak(){
  if(App.voiceBusy) return stopVoiceInput();
  startVoiceInput("profile",false);
}

async function pair(code){
  code=String(code||"").trim();
  if(!/^\d{6}$/.test(code)){ App.err=D.joinErr; render(); return; }
  await runPendingAction(async function(){
    try{
      await Store.attach(code,App.joinAs);
      St=Store.get();
      App.err="";
      var role=storeRole()||App.joinAs;
      if(role==="elder"){
        await persistUpdate(function(s){ s.paired=true; });
        rememberDevice("elder",code,null);
        App.paired=true; App.route="elder"; render();
      } else {
        var p=newPerson(St.lang,true);
        await persistUpdate(function(s){ s.people.push(p); });
        rememberDevice("family",code,p.id);
        App.editingPerson=p.id; App.speak=0; App.route="obMe"; render();
      }
    }catch(error){
      if(error&&error.code==="FAMILY_NOT_FOUND") App.err=D.joinErr;
      else reportStoreError(error);
      render();
    }
  });
}

async function startElderDevice(){
  stopGps();
  clearDevice();
  St=null;
  if(Store&&typeof Store.resetSession==="function") Store.resetSession();
  try{
    if(window.SupabaseClient&&window.SupabaseClient.auth) await window.SupabaseClient.auth.signOut();
  }catch(_error){ /* A fresh anonymous session will be created when pairing starts. */ }
}

async function hardExit(){
  if(window.Voice){ window.Voice.stopSpeaking(); }
  if(App.voiceSession){ try{ await App.voiceSession.stop(); }catch(_error){} }
  App.voiceBusy=false; App.voiceSession=null; App.voiceContext=null; App.callRecording=false;
  stopGps();
  App.route="entry"; App.tab=0; App.qa=false; App.editingPerson=null; App.paired=false;
  clearDevice(); St=null;
  try{ if(Store) await Store.signOut(); }catch(error){ reportStoreError(error); }
  D=I18N[lang]; render();
}

   10. 事件
   ===================================================================== */
document.addEventListener("click", async function(e){
  var b=e.target.closest("[data-go],[data-tab],[data-ask],[data-range],[data-person],[data-item-do],[data-item-edit],[data-item-skip],[data-item-save],[data-item-cancel]");
  if(!b || b.disabled) return;
  var g=function(n){ return b.getAttribute(n); }, id;

  if(g("data-tab")!==null){ App.tab=parseInt(g("data-tab"),10); App.editingPerson=null; render(); return; }
  if(g("data-ask")!==null){ ask(parseInt(g("data-ask"),10)); return; }
  if((id=g("data-person"))){ App.editingPerson=id; App.speak=0; render(); return; }
  if(g("data-range")!==null){ var r=g("data-range"); queueUpdate(function(s){ s.elder.radius=r; s.home=s.home||{}; s.home.radiusM=parseInt(r,10); }); return; }
  if((id=g("data-item-do"))){ setItem(id,"done"); return; }
  if((id=g("data-item-skip"))){ setItem(id,"skip"); return; }
  if((id=g("data-item-edit"))){ setItem(id,"editing"); return; }
  if((id=g("data-item-cancel"))){ setItem(id,"open"); return; }
  if((id=g("data-item-save"))){
    var inp=document.querySelector('[data-item-in="'+id+'"]'), v=inp?inp.value:null;
    queueUpdate(function(s){ var f=factById(s,id); if(f){ f.text=v; f.status="done"; } });
    return;
  }

  switch(g("data-go")){
    case "entry": await hardExit(); break;
    case "familyStart": App.route="familyStart"; render(); break;

    case "create":
      await runPendingAction(async function(){
        try{
          var code=await Store.create(lang);
          if(!code) return;
          St=Store.get();
          var p0=newPerson(lang,false);
          await persistUpdate(function(s){ s.people.push(p0); });
          rememberDevice("family",code,p0.id);
          App.editingPerson=p0.id; App.speak=0; App.route="obElder"; render();
        }catch(error){ reportStoreError(error); render(); }
      });
      break;
    case "joinFamily": App.joinAs="family"; App.err=""; App.route="join"; render(); break;
    case "elderPair":  await startElderDevice(); App.joinAs="elder"; App.err=""; App.route="join"; render(); break;
    case "pair": await pair(el("codeIn").value); break;

    case "obMe": App.route="obMe"; render(); break;
    case "speak": doSpeak(); break;
    case "voiceAsk": if(App.voiceBusy) stopVoiceInput(); else startVoiceInput("qa",false); break;
    case "finishSetup":
      var first=!St.setup;
      await persistUpdate(function(s){ s.setup=true; });
      App.editingPerson=null; App.speak=0;
      App.route = first ? "code" : "family";
      if(!first) App.tab=3;
      render();
      break;
    case "enterFamily": App.route="family"; App.tab=0; render(); break;
    case "enterElder": App.paired=false; render(); startGps(); break;
    case "setHomeFromGps": setHomeFromGps(); break;
    case "addPerson":
      var np=newPerson(St.lang,true);
      queueUpdate(function(s){ s.people.push(np); });
      App.editingPerson=np.id; App.speak=0; render();
      break;
    case "clearPending": queueUpdate(function(s){ s.pending=[]; }); break;

    case "call":
      App.tab=0;
      queueUpdate(function(s){ s.call.phase="ringing"; s.call.line=-1;
        s.call.personId=selectedMemberId(); s.lastCaller=selectedMemberId(); });
      break;
    case "answer": queueUpdate(function(s){ s.call.phase="talking"; s.call.line=-1; }); break;
    case "decline": queueUpdate(function(s){ s.call.phase="idle"; s.call.line=-1; }); break;
    case "callRecord": toggleCallRecording(); break;
    case "hangup": stopSubs(); endCall(); break;

    case "openQa": App.qa=true; render(); break;
    case "closeQa": App.qa=false; render(); break;
    case "arrived": arrived(); break;
    case "ackHome": queueUpdate(function(s){ s.guide.done=false; }); break;
    case "toggleDev": App.dev=!App.dev; render(); break;
    case "walk": autoWalk(); break;
    case "goHome": clearInterval(walkTimer); setLoc(HOME.x,HOME.y); break;

    case "lang":
      var nl = (St?St.lang:lang)==="zh" ? "en" : "zh";
      lang=nl;
      if(St){
        var old=St.lang;
        queueUpdate(function(s){
          s.lang=nl;
          if(s.elder.name===SEED[old].elderName) s.elder.name=SEED[nl].elderName;
          if(s.elder.address===SEED[old].address) s.elder.address=SEED[nl].address;
          for(var i=0;i<s.people.length;i++){
            var pp=s.people[i];
            ["nick","relation","recent","hint"].forEach(function(k){
              if(pp[k]===SEED[old][k]) pp[k]=SEED[nl][k];
            });
          }
        });
      } else render();
      break;
    case "reset":
      if(confirm(D.resetAsk)){
        App.tab=0; App.qa=false; App.editingPerson=null; App.speak=0; App.dev=false;
        try{
          await Store.resetFamily();
          if(storeRole()==="family"){
            var np2=newPerson(St.lang,false);
            await persistUpdate(function(s){ s.people.push(np2); });
            rememberDevice("family",St.code,np2.id);
            App.editingPerson=np2.id; App.route="obElder";
          } else { App.route="elder"; }
          render();
        }catch(error){ reportStoreError(error); }
      }
      break;
    case "retryConnection": await connectAndRestore(); break;
    case "exit": await hardExit(); break;
  }
});

/* =====================================================================
   11. 启动
   ===================================================================== */
if(Store) Store.subscribe(function(s){ render(s); });

async function connectAndRestore(){
  if(Connection.pendingAction) return;
  Connection.initFailed=false;
  Connection.authenticated=false;
  setConnectionStatus("connecting");
  render(St);
  try{
    if(!Store) throw new Error("Supabase client unavailable");
    await Store.initialize();
    Connection.authenticated=true;
    var restored=await Store.restoreSelection();
    St=restored;
    if(St){
      lang=St.lang||lang;
      var role=storeRole();
      var member=sessionGet(SCODE)===St.code?selectedMemberId():null;
      rememberDevice(role,St.code,role==="family"?member:null);
      App.route=role==="elder"?"elder":"family";
      if(role==="family"&&!St.setup) App.route="obElder";
    }else{
      clearDevice();
      App.route="entry"; App.editingPerson=null; App.paired=false;
      setConnectionStatus("synced");
    }
    render(St);
    if(App.route==="elder") setTimeout(startGps,0);
  }catch(error){
    Connection.initFailed=true;
    setConnectionStatus(navigator.onLine===false?"offline":"error");
    render(St);
  }
}

(function boot(){
  D=I18N[lang];
  render(St);
  connectAndRestore();
  window.addEventListener("offline",function(){ setConnectionStatus("offline"); });
  setInterval(function(){ var c=el("clock"); if(c) c.textContent=clockNow(); }, 20000);
})();

})();
</script>
<script>
(function(){
  function fit(){
    var f=Math.min(1,(window.innerHeight-24)/866,(window.innerWidth-24)/412);
    document.documentElement.style.setProperty("--fit", f.toFixed(4));
  }
  fit(); window.addEventListener("resize", fit);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", fit);
})();
</script>
