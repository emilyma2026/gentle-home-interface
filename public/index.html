<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remember Us · Local demo</title>
<style>*{box-sizing:border-box}body{margin:0;color:#3a2c22;background:#fffaf5;font:16px system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column}header{padding:12px 24px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #d8cec4}header span{flex:1;color:#796b5d;font-size:14px}a{color:#655331}section{flex:1;min-height:0;display:flex}article{position:relative;flex:1;min-width:0}article+article{border-left:1px solid #d8cec4}label{position:absolute;top:10px;left:12px;z-index:1;background:#eee8da;padding:8px 15px;border-radius:25px;font-weight:700}iframe{width:100%;height:100%;border:0;display:block}@media(max-width:760px){section.compare{overflow-x:auto}section.compare article{min-width:370px}header span{display:none}}</style></head>
<body><main id="root"></main><script>
const q=new URLSearchParams(location.search),code=(q.get('code')||'').replace(/^"|"$/g,'');
const compare=['1','true'].includes(q.get('compare'))&&/^\d{6}$/.test(code);
const root=document.getElementById('root');
if(compare){const header=document.createElement('header');header.innerHTML='<strong>Remember Us</strong><span>Local dual-side demo · this browser only</span><a href="/">Exit comparison</a>';root.append(header);}
const section=document.createElement('section');if(compare)section.className='compare';root.append(section);
for(const role of compare?['family','elder']:['']){
 const article=document.createElement('article');section.append(article);
 if(role){const label=document.createElement('label');label.textContent=role==='family'?'Family side':'Elder side';article.append(label);}
 const frame=document.createElement('iframe'),params=new URLSearchParams({localDemo:'1'});
 if(role){params.set('embedded','1');params.set('dualRole',role);params.set('code',code);}
 frame.title=role?'Remember Us '+role+' side':'Remember Us prototype';frame.allow='microphone';frame.src='/app/index.html?'+params;article.append(frame);
}
</script></body></html>
