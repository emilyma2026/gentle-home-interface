<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<title>Remember Us · Family Memory Companion</title>
<style>
:root{
  --page:#EFE1D3; --page-2:#F7E9DA;
  --paper:#FDF7F0;
  --card:#FFFCF8;
  --ink:#3A2C22;
  --ink-2:#5C483A;
  --muted:#9A8574;
  --faint:#C3B2A2;
  --line:#EFE3D6;
  --blue:#C8794A; --blue-d:#A2582C; --blue-soft:#FAEADD;
  --rose:#D98F80; --rose-soft:#FBE9E1;
  --green:#7C9A63; --green-soft:#F0F4E7;
  --amber:#C08A2E; --amber-soft:#FBF0DA;
  --warm:#C2703A; --warm-soft:#FAEFE7;
  --red:#C4585C; --red-soft:#FAE7E6;
  --sans:"Baloo 2","Noto Sans SC","PingFang SC","Microsoft YaHei","Source Han Sans SC",-apple-system,system-ui,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --sh-card:0 2px 10px rgba(94,63,38,.06), 0 12px 28px rgba(94,63,38,.07);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--page); color:var(--ink); font-family:var(--sans)}
body{min-height:100vh; height:100vh; overflow:hidden; padding:0; position:relative;
  background:radial-gradient(120% 100% at 50% 0%, var(--page-2) 0%, var(--page) 70%)}
.device-label,.hint-line{display:none !important}
p{margin:0 0 10px}
button{font:inherit; cursor:pointer; border:0; background:none; color:inherit}
input,textarea,select{font:inherit}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px}

/* ================= 手机框 ================= */
.device-label{display:flex; align-items:center; gap:8px; color:var(--muted);
  font-size:12.5px; font-weight:700; letter-spacing:.02em}
.device-label i{width:8px; height:8px; border-radius:50%; font-style:normal; background:var(--faint)}
.device-label.family i{background:var(--blue)} .device-label.elder i{background:var(--warm)}

.phone{position:absolute; left:50%; top:50%; width:412px; height:866px;
  padding:11px; border-radius:56px; background:#2A1D14;
  transform:translate(-50%,-50%) scale(var(--fit,1)); transform-origin:center center;
  box-shadow:0 1px 0 rgba(255,255,255,.18) inset, 0 30px 70px rgba(74,45,24,.32)}
.phone::after{content:""; position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
  width:126px; height:5px; border-radius:99px; background:rgba(255,255,255,.35); z-index:4}
.island{position:absolute; top:22px; left:50%; background:#2A1D14; transform:translateX(-50%);
  width:110px; height:30px; border-radius:99px; z-index:3}
.screen{position:relative; width:390px; height:844px; border-radius:46px; overflow:hidden;
  background:radial-gradient(60% 30% at 8% 2%, rgba(250,214,178,.55), rgba(250,214,178,0) 60%), radial-gradient(70% 40% at 100% 100%, rgba(205,220,190,.40), rgba(205,220,190,0) 60%), var(--paper); display:flex; flex-direction:column}
.statusbar{flex:0 0 auto; height:50px; display:flex; align-items:center;
  justify-content:space-between; padding:0 26px; font-size:13.5px; font-weight:700}
.statusbar .sigs{display:flex; align-items:center; gap:4px}
.statusbar svg{width:16px; height:11px; fill:currentColor}
.connection-status{position:absolute; top:43px; left:50%; z-index:7; transform:translateX(-50%);
  display:flex; align-items:center; gap:7px; max-width:calc(100% - 36px); padding:7px 10px;
  border:1px solid rgba(154,133,116,.22); border-radius:99px; background:rgba(255,252,248,.94);
  color:var(--ink-2); box-shadow:0 5px 16px rgba(94,63,38,.10); backdrop-filter:blur(8px);
  font-size:11.5px; font-weight:700; line-height:1.2; transition:opacity .18s}
.connection-status[data-state="synced"]{padding:5px; opacity:.56; box-shadow:none; background:transparent; border-color:transparent}
.connection-status[data-state="offline"],.connection-status[data-state="error"]{color:var(--red); border-color:rgba(196,88,92,.25)}
.connection-status[data-state="saving"]{color:var(--blue-d)}
.connection-dot{flex:0 0 auto; width:7px; height:7px; border-radius:50%; background:var(--amber)}
.connection-status[data-state="synced"] .connection-dot{background:var(--green)}
.connection-status[data-state="saving"] .connection-dot{background:var(--blue)}
.connection-status[data-state="offline"] .connection-dot,.connection-status[data-state="error"] .connection-dot{background:var(--red)}
.connection-retry{flex:0 0 auto; padding:3px 8px; border-radius:99px; background:var(--red-soft);
  color:var(--red); font-size:11px; font-weight:800}
.visually-hidden{position:absolute!important; width:1px!important; height:1px!important; padding:0!important;
  margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important}
.view{background:transparent; flex:1 1 auto; min-height:0; overflow-y:auto; display:flex; flex-direction:column;
  justify-content:safe center; gap:clamp(4px,.8vh,10px); padding:clamp(18px,4vh,36px) 22px clamp(28px,5vh,44px)}
/* 带底色的页头是导航条性质，要贴住屏幕上沿，不留缝 */
.view.pad0{padding-top:0}
.view.pad0 > .f-head:first-child{margin-top:0}
.view::-webkit-scrollbar{width:0}
.view.pad0{padding-top:0; padding-right:22px;
  padding-bottom:clamp(30px,5vh,46px); padding-left:22px; justify-content:safe start}

/* 演示外壳（在手机框外，不属于产品界面） */
.demo-chrome{position:absolute; right:14px; top:58px; z-index:6;
  display:flex; flex-direction:column; align-items:flex-end; gap:6px}
.chip{padding:6px 12px; border:1px solid var(--line); border-radius:99px;
  background:rgba(255,252,248,.92); color:var(--muted); font-size:11.5px;
  backdrop-filter:blur(6px); box-shadow:var(--sh-card)}
.chip:hover{border-color:var(--warm); color:var(--warm)}
.hint-line{max-width:390px; color:var(--faint); font-size:11px; line-height:1.6; text-align:center}

/* ================= 通用 ================= */
.h1{margin:0 0 6px; font-size:26px; font-weight:800; line-height:1.28; letter-spacing:-.01em}
.h2{margin:0 0 10px; font-size:19px; font-weight:800; line-height:1.35}
.sub{margin:0 0 18px; color:var(--muted); font-size:13.5px; line-height:1.6}
.eyebrow{margin:0 0 4px; color:var(--blue); font-size:11.5px; font-weight:800; letter-spacing:.05em}
.eyebrow.warm{color:var(--warm)}
.spacer{flex:1 1 auto; min-height:10px}
.view::before{content:""; display:block; flex:.6 1 auto; min-height:0}
.view.pad0::before,.view:has(> .entry)::before,.view:has(> .family-start)::before{display:none}

.card{background:var(--card); border-radius:var(--r-lg); padding:16px 17px; box-shadow:var(--sh-card)}
.card + .card{margin-top:11px}

.btn{display:block; width:100%; padding:15px 18px; border-radius:99px; text-align:center;
  background:var(--blue); color:#fff; font-size:15.5px; font-weight:700;
  box-shadow:0 8px 20px rgba(200,121,74,.30); transition:transform .12s, opacity .12s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:#fff; color:var(--ink-2); box-shadow:var(--sh-card)}
.btn.warm{background:var(--warm); box-shadow:0 8px 20px rgba(194,112,58,.26)}
.btn.red{background:var(--red); box-shadow:0 8px 20px rgba(201,100,107,.24)}
.btn[disabled]{opacity:.42; box-shadow:none}
.btn-row{display:flex; gap:9px}
.btn-row .btn{flex:1}
.link{display:block; width:100%; padding:11px; text-align:center; color:var(--muted); font-size:13px}
.link:hover{color:var(--blue)}

/* 身份选择 */
.brandmark{display:flex; align-items:center; gap:11px; margin:14px 0 22px}
.brandmark .logo{width:44px; height:44px; border-radius:14px; display:grid; place-items:center;
  background:linear-gradient(145deg,var(--blue-soft),var(--rose-soft)); box-shadow:var(--sh-card)}
.brandmark .logo svg{width:24px; height:24px; fill:none; stroke:var(--blue-d); stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round}
.brandmark b{font-size:17px; font-weight:800}
.brandmark span{display:block; color:var(--muted); font-size:11.5px; font-weight:400}
.roles{display:grid; gap:12px}
.role{display:flex; align-items:center; gap:14px; padding:18px; text-align:left;
  border-radius:var(--r-lg); background:var(--card); box-shadow:var(--sh-card);
  transition:transform .14s}
.role:active{transform:scale(.99)}
.role .face{flex:0 0 auto; width:54px; height:54px; border-radius:50%; display:grid; place-items:center;
  font-size:27px}
.role.elder .face{background:var(--warm-soft)}
.role.family .face{background:var(--blue-soft)}
.role b{display:block; font-size:16px; margin-bottom:3px}
.role span{color:var(--muted); font-size:12.5px; line-height:1.5}
.role > span{min-width:0}
.role > span > span{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

.family-start{min-height:100%; display:flex; flex-direction:column; padding:18px 0 4px}
.family-start-head{margin-bottom:30px}
.family-start-head .sub{margin-bottom:0}
.family-start .roles{flex:1 1 auto; grid-template-rows:repeat(2,minmax(132px,1fr));
  min-height:300px; max-height:400px; gap:16px}
.family-start .role{min-height:132px; padding:26px 20px; border-radius:26px}
.family-start .role .face{width:64px; height:64px; font-size:31px}
.family-start .role b{font-size:18px}
.family-start .link{margin-top:18px}

/* 表单 */
.field{margin-bottom:14px}
.field-top{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px}
.field label{color:var(--ink-2); font-size:12.5px; font-weight:700}
.tag{padding:2px 8px; border-radius:99px; background:var(--amber-soft);
  color:var(--amber); font-size:10px; font-weight:800}
.tag[hidden]{display:none}
.field input,.field textarea,.field select{width:100%; padding:13px 15px; border:1px solid var(--line);
  border-radius:14px; background:#fff; color:var(--ink); font-size:14.5px; line-height:1.5}
.field textarea{min-height:66px; resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue); outline:none;
  box-shadow:0 0 0 3px var(--blue-soft)}
.field .hint{margin:6px 0 0; color:var(--faint); font-size:11px; line-height:1.5}
.seg{display:flex; gap:7px}
.seg button{flex:1; padding:11px 4px; border:1px solid var(--line); border-radius:13px;
  background:#fff; color:var(--muted); font-size:13.5px}
.seg button[aria-pressed="true"]{border-color:var(--blue); background:var(--blue-soft);
  color:var(--blue-d); font-weight:800}
.avatar{display:grid; place-items:center; flex:0 0 auto; border-radius:50%;
  background:var(--rose-soft); color:var(--rose); font-weight:800}
.av-lg{width:58px; height:58px; font-size:22px}
.av-md{width:44px; height:44px; font-size:17px}
.av-sm{width:34px; height:34px; font-size:13px}
.avatar-picker{width:72px; height:72px; display:grid; place-items:center; border-radius:50%;
  margin-left:auto; margin-right:auto; margin-bottom:22px; background:#E8E3DE; color:#928A82;
  font-size:34px; font-weight:500; line-height:1}

/* 说一句话 */
.speak{display:flex; align-items:center; gap:12px; width:100%; padding:14px 16px; text-align:left;
  border-radius:18px; background:linear-gradient(135deg,var(--blue-soft),var(--rose-soft));
  margin-bottom:14px}
.speak .mic{flex:0 0 auto; width:40px; height:40px; border-radius:50%; background:#fff;
  display:grid; place-items:center; box-shadow:0 4px 12px rgba(43,42,46,.10)}
.speak .mic svg{width:18px; height:18px; fill:none; stroke:var(--blue-d); stroke-width:1.9;
  stroke-linecap:round; stroke-linejoin:round}
.speak b{display:block; font-size:13.5px}
.speak span{color:var(--ink-2); font-size:11.5px; opacity:.8}
.speak.on{background:linear-gradient(135deg,#E4ECFA,#F6E4E6)}
.filled{margin:-6px 0 14px; padding:9px 13px; border-radius:12px; background:var(--green-soft);
  color:var(--green); font-size:11.5px; font-weight:700}

/* 家庭码 */
.codebox{margin:6px 0 18px; padding:22px; text-align:center; border-radius:var(--r-lg);
  background:linear-gradient(150deg,var(--blue-soft),var(--rose-soft))}
.codebox b{display:block; font-size:38px; font-weight:800; letter-spacing:.16em; color:var(--blue-d)}
.codebox span{display:block; margin-top:6px; color:var(--ink-2); font-size:11.5px; opacity:.75}
.codein{width:100%; padding:16px; text-align:center; border:1px solid var(--line); border-radius:16px;
  background:#fff; font-size:26px; font-weight:800; letter-spacing:.24em; color:var(--ink)}
.codein:focus{border-color:var(--blue); outline:none; box-shadow:0 0 0 3px var(--blue-soft)}
.demo-sample{margin:10px 0 0; text-align:center; color:var(--muted); font-size:12px; line-height:1.5}
.demo-sample b{color:var(--blue-d); font-size:13px; letter-spacing:.08em}
.err{margin:9px 0 0; color:var(--red); font-size:12.5px}
.recent{margin-top:16px}
.recent .row{display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 14px; border-radius:14px; background:#fff; box-shadow:var(--sh-card); margin-bottom:8px}
.recent .row b{font-size:13.5px} .recent .row small{display:block; color:var(--faint); font-size:11px}
.mini{padding:6px 13px; border-radius:99px; background:var(--blue-soft); color:var(--blue-d);
  font-size:12px; font-weight:700}

/* ================= 家人端 ================= */
.f-head{margin:0 -22px 14px; padding:18px 22px 20px;
  background:linear-gradient(155deg,var(--blue-soft) 0%, var(--rose-soft) 100%)}
.f-head .eyebrow{color:var(--blue-d); opacity:.85}
.f-head .h1{font-size:23px}
.f-head .who{display:flex; align-items:center; gap:9px; margin-top:12px}
.f-head .who .avatar{background:#fff}
.f-head .who b{font-size:13px} .f-head .who small{display:block; color:var(--ink-2); font-size:11px; opacity:.7}

.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px}
.tile{padding:14px 15px; text-align:left; border-radius:var(--r-md); background:var(--card);
  box-shadow:var(--sh-card)}
.tile small{display:block; color:var(--muted); font-size:11px; margin-bottom:5px}
.tile b{font-size:14px}
.tile.alert{background:var(--red-soft)} .tile.alert b{color:var(--red)}
.tile.good b{color:var(--green)}

.map-card{border-radius:var(--r-lg); overflow:hidden; background:var(--card); box-shadow:var(--sh-card); margin-bottom:12px}
.map-card svg.map{display:block; width:100%; height:auto}
.map-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 15px}
.map-foot small{color:var(--faint); font-size:11px}
.map-foot b{font-size:13px}
.map-foot b.out{color:var(--red)}

.banner{display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:var(--r-md);
  background:var(--blue-soft); margin-bottom:12px}
.banner .wave{flex:0 0 auto}
.banner b{display:block; font-size:13.5px; color:var(--blue-d)}
.banner small{color:var(--ink-2); font-size:11.5px; opacity:.8}
.banner.warn{background:var(--red-soft)} .banner.warn b{color:var(--red)}
.banner.note{background:var(--amber-soft); display:block} .banner.note b{color:var(--amber)}
.banner.note small{display:block; margin-top:3px}

.wave{display:flex; align-items:flex-end; gap:3px; height:22px}
.wave i{width:3px; border-radius:2px; background:var(--blue); animation:wv .9s ease-in-out infinite}
.wave.warm i{background:var(--warm)}
@keyframes wv{0%,100%{height:4px}50%{height:20px}}
@media(prefers-reduced-motion:reduce){.wave i{animation:none;height:11px!important}}

.confirm{border-radius:var(--r-lg); background:var(--card); box-shadow:var(--sh-card); padding:16px 17px; margin-bottom:12px}
.confirm > b{display:block; font-size:14px; margin-bottom:3px}
.confirm > small{display:block; color:var(--muted); font-size:11.5px; line-height:1.55; margin-bottom:12px}
.item{padding:13px 14px; border-radius:14px; background:var(--paper); margin-bottom:9px}
.item:last-child{margin-bottom:0}
.chiptype{display:inline-block; margin-bottom:6px; padding:2px 9px; border-radius:99px;
  background:var(--blue-soft); color:var(--blue-d); font-size:10px; font-weight:800}
.chiptype.todo{background:var(--amber-soft); color:var(--amber)}
.item p{margin:0 0 10px; font-size:13.5px; line-height:1.55}
.item input{width:100%; padding:10px 12px; border:1px solid var(--blue); border-radius:11px;
  background:#fff; font-size:13.5px; margin-bottom:10px}
.acts{display:flex; flex-wrap:wrap; gap:7px}
.acts button{padding:7px 14px; border-radius:99px; background:#fff; color:var(--muted);
  font-size:12px; font-weight:700; box-shadow:0 1px 4px rgba(43,42,46,.07)}
.acts button.go{background:var(--blue); color:#fff}
.done-line{margin:0; font-size:11.5px; font-weight:700; color:var(--green)}
.skip-line{margin:0; font-size:11.5px; font-weight:700; color:var(--faint)}
.struck{color:var(--faint); text-decoration:line-through}

.tl{margin:0}
.tl .row{display:flex; gap:12px; padding:13px 0; border-bottom:1px solid var(--line)}
.tl .row:last-child{border-bottom:0}
.tl time{flex:0 0 auto; width:42px; color:var(--blue); font-size:12px; font-weight:800;
  font-variant-numeric:tabular-nums; padding-top:1px}
.tl p{margin:0; font-size:13.5px; line-height:1.5}
.empty{padding:30px 18px; text-align:center; color:var(--faint); font-size:12.5px;
  border-radius:var(--r-lg); background:var(--card); box-shadow:var(--sh-card)}

.detail{padding:15px 16px; border-radius:var(--r-md); background:var(--red-soft); margin-bottom:12px}
.detail.ok{background:var(--green-soft)}
.detail dt{color:var(--red); font-size:11px; font-weight:800; margin-bottom:2px}
.detail.ok dt{color:var(--green)}
.detail dd{margin:0 0 11px; font-size:13.5px; line-height:1.5}
.detail dd:last-child{margin-bottom:0}

.person-row{display:flex; align-items:center; gap:12px; width:100%; padding:13px 14px; text-align:left;
  border-radius:var(--r-md); background:var(--card); box-shadow:var(--sh-card); margin-bottom:9px}
.person-row b{display:block; font-size:14px}
.person-row small{color:var(--muted); font-size:11.5px}
.person-row .me{margin-left:auto; padding:3px 9px; border-radius:99px;
  background:var(--green-soft); color:var(--green); font-size:10px; font-weight:800}
.person-row .go{margin-left:auto; color:var(--faint); font-size:17px}

.tabbar{flex:0 0 auto; display:flex; padding:8px 12px 22px; background:rgba(255,255,255,.92);
  border-top:1px solid var(--line); backdrop-filter:blur(10px)}
.tabbar button{flex:1; display:grid; justify-items:center; gap:4px; padding:5px 0;
  color:var(--faint); font-size:10.5px; font-weight:700; position:relative}
.tabbar svg{width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--blue-d)}
.tabbar .dot{position:absolute; top:2px; right:calc(50% - 15px); width:7px; height:7px;
  border-radius:50%; background:var(--red)}

/* ================= 老人端 ================= */
.screen.elder{background:#FFFCF8}
.e-view{flex:1 1 auto; min-height:0; overflow-y:auto; display:flex; flex-direction:column; padding:0 24px 28px}
.e-hello{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:14px}
.e-ring{width:132px; height:132px; border-radius:50%; display:grid; place-items:center;
  background:linear-gradient(150deg,var(--warm-soft),var(--rose-soft));
  color:var(--warm); font-size:52px; font-weight:800}
.e-h1{margin:0; font-size:34px; font-weight:800; letter-spacing:-.01em}
.e-copy{margin:0; color:var(--ink-2); font-size:17px; line-height:1.6}
.e-btn{flex:0 0 auto; width:100%; margin-top:16px; padding:22px; border-radius:30px;
  background:var(--warm); color:#fff; font-size:24px; font-weight:800;
  box-shadow:0 12px 26px rgba(194,112,58,.3)}
.e-btn:active{transform:scale(.99)}
.e-btn.soft{background:#fff; color:var(--ink-2); box-shadow:var(--sh-card); font-size:19px; padding:17px}
.e-btn.red{background:var(--red); box-shadow:0 12px 26px rgba(201,100,107,.28)}

.e-call{flex:1; display:flex; flex-direction:column; text-align:center}
.e-call .lbl{margin:14px 0 4px; color:var(--muted); font-size:14px}
.e-call .nm{margin:0 0 20px; font-size:38px; font-weight:800}
.pcard{text-align:left; padding:20px; border-radius:26px; background:#fff; box-shadow:var(--sh-card)}
.pcard .top{display:flex; align-items:center; gap:14px; margin-bottom:14px}
.pcard .top b{font-size:20px; line-height:1.35}
.pcard p{margin:0 0 8px; color:var(--ink-2); font-size:16px; line-height:1.6}
.pcard p:last-child{margin:0}
.pcard .avatar{width:62px; height:62px; font-size:24px; background:var(--warm-soft); color:var(--warm)}
.ctrl{display:flex; justify-content:space-around; margin-top:auto; padding-top:26px}
.ctrl button{display:grid; justify-items:center; gap:8px; color:var(--muted); font-size:13px; font-weight:700}
.ctrl i{width:70px; height:70px; border-radius:50%; display:grid; place-items:center; color:#fff}
.ctrl svg{width:29px; height:29px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.ctrl .no i{background:var(--red); box-shadow:0 10px 22px rgba(201,100,107,.3)}
.ctrl .yes i{background:var(--green); box-shadow:0 10px 22px rgba(94,158,130,.3)}

.audio-tag{display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:99px;
  background:var(--warm-soft); color:var(--warm); font-size:11.5px; font-weight:800}
.subs{flex:1; min-height:0; overflow-y:auto; margin:14px 0; padding:16px; border-radius:20px; background:#fff;
  box-shadow:var(--sh-card)}
.subs p{margin:0 0 12px; font-size:16px; line-height:1.6; opacity:.3; transition:opacity .3s}
.subs p:last-child{margin:0}
.subs p.on{opacity:1; font-weight:700}
.subs b{color:var(--warm)} .subs b.self{color:var(--blue-d)}

.thread{flex:1; display:flex; flex-direction:column; gap:12px; overflow-y:auto; padding:4px 0 8px}
.bub{max-width:92%; padding:15px 17px; border-radius:22px; font-size:17px; line-height:1.55}
.bub.me{align-self:flex-end; background:var(--blue-soft); border-bottom-right-radius:7px}
.bub.ai{align-self:flex-start; background:#fff; box-shadow:var(--sh-card); border-bottom-left-radius:7px}
.bub.ai .vr{display:flex; align-items:center; gap:7px; margin-bottom:7px; color:var(--warm);
  font-size:12px; font-weight:800}
.bub.ai .vr svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round}
.bub.ai p{margin:0; font-size:19px; font-weight:700; line-height:1.55}
.src{align-self:flex-start; margin:0; padding:7px 13px; border-radius:99px; background:var(--green-soft);
  color:var(--green); font-size:12px; font-weight:700}
.src.unk{background:#F2F0F0; color:var(--muted)}
.asks{flex:0 0 auto; display:grid; gap:9px; margin-top:14px}
.askbtn{padding:16px 18px; text-align:left; border-radius:22px; background:#fff;
  box-shadow:var(--sh-card); font-size:17px; line-height:1.4}
.askbtn:active{background:var(--warm-soft)}
.holdbar{flex:0 0 auto; margin-top:10px; padding:14px; text-align:center; border-radius:99px;
  border:1.5px dashed var(--warm); color:var(--warm); font-size:14px; font-weight:800}

.lmk{position:relative; min-height:190px; margin:12px 0 16px; border-radius:26px; overflow:hidden;
  display:grid; place-items:center; background:linear-gradient(150deg,var(--blue-soft),var(--rose-soft))}
.lmk .shape{width:150px; height:88px; border:14px solid var(--warm); border-top:0; transform:skew(-8deg); opacity:.92}
.lmk .shape.shop{border-color:var(--blue); border-radius:0 0 10px 10px; transform:none}
.lmk .shape.home{border-color:var(--green); border-top:14px solid var(--green); border-radius:8px; transform:none}
.lmk .nm{position:absolute; left:14px; bottom:14px; padding:6px 13px; border-radius:99px;
  background:rgba(23,22,26,.82); color:#fff; font-size:13px; font-weight:700}
.stepno{margin:0 0 6px; color:var(--muted); font-size:14px; font-weight:700}
.stepcopy{margin:0 0 10px; font-size:26px; font-weight:800; line-height:1.45}
.stepnote{margin:0; color:var(--muted); font-size:14px; line-height:1.55}
.vr-line{display:flex; align-items:center; gap:7px; margin-bottom:8px; color:var(--warm); font-size:13px; font-weight:800}
.vr-line svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

.devbar{flex:0 0 auto; margin-top:14px; padding-top:12px; border-top:1px dashed #E3DEDA}
.devbar .hd{display:flex; align-items:center; justify-content:space-between; width:100%;
  color:var(--faint); font-size:11.5px; font-weight:700}
.devbar .bd{margin-top:11px}
.devbar .bd[hidden]{display:none}
.devbar .bd p{margin:0 0 10px; color:var(--faint); font-size:11px; line-height:1.55}
.devbar .bd .btn{padding:11px; font-size:13.5px; box-shadow:none; background:#fff;
  color:var(--ink-2); box-shadow:var(--sh-card)}
.devdist{display:block; margin-top:10px; color:var(--muted); font-size:12px;
  font-variant-numeric:tabular-nums; text-align:center}
.devdist.out{color:var(--red); font-weight:800}

/* 视口不够高时手机框自适应，保证分屏演示一屏放得下 */


/* ---- 地图 ---- */
.gmap{width:100%; height:186px; background:#EFECEE}
.mapbox{position:relative; display:block; width:100%; min-height:186px; border-radius:var(--r-md);
  overflow:hidden; background:#F3F1F4; box-shadow:var(--sh-card)}
.mapbox.mappick{touch-action:none; cursor:crosshair}
.mapbox svg{display:block; width:100%; height:auto}
.mapbox .tip{position:absolute; left:10px; bottom:9px; padding:4px 10px; border-radius:99px;
  background:rgba(23,22,26,.72); color:#fff; font-size:10.5px; pointer-events:none; z-index:2}
.mapbox .badge-live{position:absolute; right:10px; top:10px; padding:3px 9px; border-radius:99px;
  background:rgba(255,255,255,.92); color:var(--muted); font-size:10px; font-weight:800; z-index:2}

/* ---- 安全范围滑块 ---- */
.rangeval{display:inline-flex; align-items:baseline; gap:3px}
.rangeval input{width:78px; padding:5px 8px; border:1px solid var(--line); border-radius:9px;
  background:#fff; color:var(--ink); font-size:14px; font-weight:800; text-align:right;
  font-variant-numeric:tabular-nums}
.rangeval input:focus{border-color:var(--blue); outline:none; box-shadow:0 0 0 3px var(--blue-soft)}
.rangeval em{font-style:normal; color:var(--muted); font-size:12px; font-weight:700}
.slider{-webkit-appearance:none; appearance:none; width:100%; height:28px; background:transparent; margin:6px 0 0}
.slider::-webkit-slider-runnable-track{height:6px; border-radius:99px;
  background:linear-gradient(90deg,var(--warm) 0%,var(--warm) var(--pct,40%),var(--line) var(--pct,40%),var(--line) 100%)}
.slider::-moz-range-track{height:6px; border-radius:99px; background:var(--line)}
.slider::-moz-range-progress{height:6px; border-radius:99px; background:var(--warm)}
.slider::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:24px; height:24px;
  margin-top:-9px; border-radius:50%; background:#fff; border:2px solid var(--warm);
  box-shadow:0 2px 8px rgba(43,42,46,.2); cursor:grab}
.slider::-moz-range-thumb{width:22px; height:22px; border-radius:50%; background:#fff;
  border:2px solid var(--warm); box-shadow:0 2px 8px rgba(43,42,46,.2); cursor:grab}
.range-marks{display:flex; justify-content:space-between; margin-top:1px; color:var(--faint); font-size:10.5px}

/* ---- 危险操作与设置行 ---- */
.btn.danger{background:#fff; color:var(--red); box-shadow:var(--sh-card)}
.btn.danger:hover{background:var(--red-soft)}
.setrow{display:flex; align-items:center; justify-content:space-between; gap:12px;
  width:100%; padding:14px 16px; text-align:left; border-radius:var(--r-md);
  background:var(--card); box-shadow:var(--sh-card); margin-bottom:9px}
.setrow b{display:block; font-size:14px}
.setrow small{color:var(--muted); font-size:11.5px}
.setrow .val{color:var(--blue-d); font-size:13px; font-weight:800; flex:0 0 auto}

/* ---- 老人端默认页 ---- */
.e-home{display:flex; flex-direction:column; gap:8px}
/* 老人端的今天是一条页头，贴住上沿并做满宽 */
.e-date{margin:0 -24px 2px; padding:14px 24px 16px; border-radius:0;
  background:linear-gradient(150deg,var(--warm-soft),var(--rose-soft))}
.e-date small{display:block; color:var(--ink-2); font-size:14px; font-weight:700; opacity:.75}
.e-date b{display:block; margin-top:1px; font-size:26px; font-weight:800; line-height:1.22}
.e-date span{display:block; margin-top:3px; color:var(--ink-2); font-size:16px}
.e-panel{display:flex; align-items:center; gap:13px; padding:11px 15px; border-radius:20px;
  background:#fff; box-shadow:var(--sh-card)}
.e-panel .ico{flex:0 0 auto; width:46px; height:46px; border-radius:14px; display:grid;
  place-items:center; font-size:23px; background:var(--blue-soft)}
.e-panel .ico.warm{background:var(--warm-soft)}
.e-panel .ico.rose{background:var(--rose-soft)}
.e-panel .txt{min-width:0}
.e-panel small{display:block; color:var(--muted); font-size:13px; font-weight:700; margin-bottom:2px}
.e-panel b{display:block; font-size:19px; font-weight:800; line-height:1.4}
.e-panel p{margin:3px 0 0; color:var(--ink-2); font-size:15px; line-height:1.45}
.e-todo{display:block; padding:11px 15px; border-radius:20px; background:#fff; box-shadow:var(--sh-card)}
.e-todo .row{display:flex; align-items:center; gap:13px}
.e-todo .txt p{margin:2px 0 0; color:var(--muted); font-size:14px; line-height:1.4}
.e-todo .done-btn{width:100%; margin-top:10px; padding:12px; border-radius:99px;
  background:var(--green); color:#fff; font-size:18px; font-weight:800}
.e-todo .done-btn:active{opacity:.9}
.e-todo.ok{background:var(--green-soft); box-shadow:none}
.e-todo.ok b{color:var(--green)}
.e-read{align-self:center; display:inline-flex; align-items:center; gap:8px; margin:0;
  padding:7px 16px; border-radius:99px; background:#fff; box-shadow:var(--sh-card);
  color:var(--warm); font-size:15px; font-weight:800}
.e-read svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round}
.e-actions{margin-top:auto; padding-top:8px}

/* ---- 待你补充：直接写答案 ---- */
.pend-item{padding:11px 12px; border-radius:13px; background:rgba(255,255,255,.6); margin-bottom:9px}
.pend-item:last-of-type{margin-bottom:10px}
.pend-q{display:flex; align-items:baseline; gap:7px; margin:0 0 8px}
.pend-q b{font-size:14px; font-weight:700; line-height:1.4}
.pend-q span{flex:0 0 auto; color:var(--muted); font-size:11px}
.pend-row{display:flex; gap:7px}
.pend-row input{flex:1; min-width:0; padding:9px 11px; border:1px solid var(--line); border-radius:11px;
  background:#fff; color:var(--ink); font:inherit; font-size:13.5px}
.pend-row input:focus{border-color:var(--blue); outline:none; box-shadow:0 0 0 3px var(--blue-soft)}
.pend-row button{flex:0 0 auto; padding:9px 15px; border-radius:11px; background:var(--blue);
  color:#fff; font-size:13px; font-weight:700}
.pend-row button.skip{background:rgba(255,255,255,.75); color:var(--muted)}
.pend-hint{margin:7px 0 0; color:var(--muted); font-size:11px; line-height:1.5}

/* ---- 首页的今日摘要 ---- */
.sum-card{border-radius:var(--r-lg); background:var(--card); box-shadow:var(--sh-card);
  padding:14px 15px; margin-bottom:12px}
.sum-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:9px}
.sum-head b{font-size:14px}
.sum-head span{color:var(--green); font-size:11.5px; font-weight:800}
.sum-list{display:grid}
.sum-list .row{display:flex; gap:11px; padding:7px 0; border-bottom:1px solid var(--line)}
.sum-list .row:last-child{border-bottom:0}
.sum-list time{flex:0 0 auto; width:40px; color:var(--blue); font-size:11.5px; font-weight:800;
  font-variant-numeric:tabular-nums; padding-top:1px}
.sum-list p{margin:0; font-size:13px; line-height:1.45}
.sum-more{width:100%; margin-top:8px; padding:8px; border-radius:99px; background:var(--paper);
  color:var(--muted); font-size:12px; font-weight:700}

/* ---- 月历式待办 ---- */
.cal-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 10px}
.cal-head b{font-size:18px; font-weight:800}
.cal-nav{display:flex; gap:6px}
.cal-nav button{width:32px; height:32px; border-radius:50%; background:var(--card);
  box-shadow:var(--sh-card); color:var(--ink-2); font-size:15px; font-weight:800}
.cal-week{display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:4px}
.cal-week span{text-align:center; color:var(--faint); font-size:10.5px; font-weight:800}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:12px}
.cal-day{min-height:52px; padding:4px 3px 3px; border-radius:10px; background:transparent;
  display:flex; flex-direction:column; align-items:stretch; gap:2px; text-align:center}
.cal-day:active{background:var(--well)}
.cal-day.out{opacity:.32}
.cal-day.sel{background:var(--blue-soft)}
.cal-day .n{display:block; margin:0 auto; width:22px; height:22px; line-height:22px;
  border-radius:50%; font-size:12.5px; font-weight:700; color:var(--ink)}
.cal-day.today .n{background:var(--warm); color:#fff; font-weight:800}
.cal-chip{display:block; padding:1px 3px; border-radius:4px; background:var(--warm-soft);
  color:var(--warm); font-size:8.5px; line-height:1.45; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; text-align:left}
.cal-chip.done{background:var(--green-soft); color:var(--green)}
.cal-more{color:var(--faint); font-size:8.5px; text-align:left; padding-left:3px}

.day-panel{border-radius:var(--r-lg); background:var(--card); box-shadow:var(--sh-card); padding:14px 15px}
.day-panel > b{display:block; font-size:15px; margin-bottom:2px}
.day-panel > small{display:block; margin-bottom:11px; color:var(--muted); font-size:11.5px}
.trow{border-radius:14px; background:var(--paper); margin-bottom:8px; overflow:hidden}
.trow:last-of-type{margin-bottom:0}
.trow.done{background:var(--green-soft)}
.trow-head{display:flex; align-items:center; gap:11px; width:100%; padding:12px 13px; text-align:left}
.trow-head .box{flex:0 0 auto; width:22px; height:22px; border-radius:7px; display:grid; place-items:center;
  background:#fff; box-shadow:inset 0 0 0 1.5px var(--line); color:transparent; font-size:13px; font-weight:800}
.trow.done .trow-head .box{background:var(--green); box-shadow:none; color:#fff}
.trow-head .body{min-width:0; flex:1}
.trow-head b{display:block; font-size:14px; font-weight:700; line-height:1.35}
.trow-head small{display:block; margin-top:1px; color:var(--muted); font-size:11px}
.trow-head .chev{color:var(--faint); font-size:14px}
.trow-edit{padding:0 13px 13px}
.trow-edit[hidden]{display:none}
.rep-row{display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-top:9px; padding:9px 11px; border-radius:11px; background:#fff}
.rep-row span{font-size:12.5px; font-weight:700}
.rep-row small{display:block; color:var(--muted); font-size:10.5px; font-weight:400}
.switch{flex:0 0 auto; width:42px; height:24px; border-radius:99px; background:var(--line);
  position:relative; transition:background .16s}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:18px; height:18px;
  border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.2); transition:transform .16s}
.switch[aria-pressed="true"]{background:var(--green)}
.switch[aria-pressed="true"]::after{transform:translateX(18px)}
.trow-acts{display:flex; justify-content:flex-end; margin-top:9px}
.trow-acts button{padding:5px 12px; border-radius:99px; background:#fff; color:var(--faint);
  font-size:11.5px; font-weight:700}
.trow-acts button:hover{color:var(--red)}
.fab{position:absolute; right:18px; bottom:96px; width:56px; height:56px; border-radius:50%;
  background:var(--warm); color:#fff; font-size:28px; font-weight:300; line-height:1;
  box-shadow:0 10px 24px rgba(194,112,58,.36); z-index:5; display:grid; place-items:center}
.fab:active{transform:scale(.96)}

/* ---- 提醒：弹窗与首页横条 ---- */
.sheet-mask{position:absolute; inset:0; z-index:20; background:rgba(23,22,26,.42);
  display:flex; align-items:flex-end; justify-content:center; padding:16px; border-radius:44px}
.sheet{width:100%; max-height:82%; overflow-y:auto; padding:20px 18px 18px; border-radius:26px;
  background:var(--card); box-shadow:0 -8px 40px rgba(23,22,26,.28)}
.sheet .eyebrow{color:var(--red)}
.sheet h3{margin:0 0 12px; font-size:20px; font-weight:800; line-height:1.35}
.alert-bar{display:flex; align-items:center; gap:11px; width:100%; padding:12px 14px; text-align:left;
  border-radius:var(--r-md); background:var(--red-soft); margin-bottom:12px}
.alert-bar.ok{background:var(--green-soft)}
.alert-bar .dotpulse{flex:0 0 auto; width:9px; height:9px; border-radius:50%; background:var(--red)}
.alert-bar.ok .dotpulse{background:var(--green)}
.alert-bar b{display:block; font-size:13.5px; color:var(--red)}
.alert-bar.ok b{color:var(--green)}
.alert-bar small{color:var(--ink-2); font-size:11px; opacity:.85}
.alert-bar .x{margin-left:auto; flex:0 0 auto; padding:4px 10px; border-radius:99px;
  background:rgba(255,255,255,.7); color:var(--muted); font-size:11px; font-weight:700}

/* ---- 家人端待办 ---- */
.todo-card{border-radius:var(--r-lg); background:var(--card); box-shadow:var(--sh-card);
  padding:15px 16px; margin-bottom:12px}
.todo-card > b{display:block; font-size:14px; margin-bottom:2px}
.todo-card > small{display:block; margin-bottom:11px; color:var(--muted); font-size:11.5px}
.todo-item{padding:12px 13px; border-radius:14px; background:var(--paper); margin-bottom:9px}
.todo-item:last-of-type{margin-bottom:0}
.todo-item.done{background:var(--green-soft)}
.todo-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:9px}
.todo-head .state{font-size:11px; font-weight:800; color:var(--muted)}
.todo-head .state.ok{color:var(--green)}
.todo-head .del{padding:3px 9px; border-radius:99px; background:#fff; color:var(--faint);
  font-size:11px; font-weight:700}
.todo-head .del:hover{color:var(--red)}
.todo-fields{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.todo-fields .wide{grid-column:1 / -1}
.tf{display:grid; gap:3px}
.tf label{color:var(--muted); font-size:10.5px; font-weight:700}
.tf input{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:10px;
  background:#fff; color:var(--ink); font:inherit; font-size:13px}
.tf input:focus{border-color:var(--blue); outline:none; box-shadow:0 0 0 3px var(--blue-soft)}
.todo-add{width:100%; margin-top:10px; padding:11px; border-radius:99px; background:var(--paper);
  color:var(--blue-d); font-size:13px; font-weight:700; box-shadow:inset 0 0 0 1px var(--line)}
.todo-empty{padding:16px; text-align:center; color:var(--faint); font-size:12.5px}

/* ---- 说一句话：转写确认 ---- */
.speak-box{margin:-4px 0 14px; padding:14px 15px; border-radius:18px; background:#fff; box-shadow:var(--sh-card)}
.speak-box small{display:block; margin-bottom:7px; color:var(--muted); font-size:11.5px; font-weight:700}
.speak-box textarea{width:100%; min-height:74px; padding:11px 13px; border:1px solid var(--line);
  border-radius:12px; background:var(--paper); color:var(--ink); font:inherit; font-size:14px; line-height:1.55; resize:vertical}
.speak-box textarea:focus{border-color:var(--blue); outline:none; box-shadow:0 0 0 3px var(--blue-soft)}
.speak-acts{display:flex; gap:8px; margin-top:10px}
.speak-acts button{flex:1; padding:11px; border-radius:99px; font-size:13.5px; font-weight:700}
.speak-acts .go{background:var(--blue); color:#fff}
.speak-acts .again{background:var(--paper); color:var(--muted); box-shadow:inset 0 0 0 1px var(--line)}
.speak-err{margin:8px 0 0; color:var(--red); font-size:11.5px}
.ai-tag{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:99px;
  background:var(--blue-soft); color:var(--blue-d); font-size:10px; font-weight:800; vertical-align:middle}

/* ---- 头像上传 ---- */
.avatar-picker{position:relative; display:grid; place-items:center; width:84px; height:84px;
  margin:0 auto 14px; border-radius:50%; background:#E8E3DE; color:#928A82;
  font-size:34px; font-weight:500; line-height:1; cursor:pointer; overflow:hidden;
  background-size:cover; background-position:center}
.avatar-picker input{position:absolute; inset:0; opacity:0; cursor:pointer}
.avatar-picker.has{color:transparent}
.avatar.photo{background-size:cover; background-position:center; color:transparent}

/* ---- 老人端设置入口与设置页 ---- */
.e-quiet{align-self:center; display:inline-flex; align-items:center; gap:7px; margin:9px auto 0;
  padding:8px 16px; border-radius:99px; background:transparent; color:var(--faint);
  font-size:14px; font-weight:700}
.e-quiet:active{background:rgba(0,0,0,.04)}
.e-quiet svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.9;
  stroke-linecap:round; stroke-linejoin:round}
.e-set{display:flex; flex-direction:column; gap:10px}
.e-setrow{display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:15px 17px; border-radius:20px; background:#fff; box-shadow:var(--sh-card)}
.e-setrow small{display:block; color:var(--muted); font-size:13px; font-weight:700}
.e-setrow b{display:block; margin-top:2px; font-size:18px; font-weight:800}
.e-setrow .code{font-size:22px; font-weight:800; letter-spacing:.14em; color:var(--blue-d);
  font-variant-numeric:tabular-nums}
.e-danger{width:100%; margin-top:4px; padding:16px; border-radius:99px; background:#fff;
  color:var(--red); font-size:18px; font-weight:800; box-shadow:var(--sh-card)}
.e-danger:active{background:var(--red-soft)}
.e-setnote{margin:8px 4px 0; color:var(--faint); font-size:13px; line-height:1.5; text-align:center}

/* ---- 老人端：给家人打电话 ---- */
.callpick{display:grid; gap:11px; margin:10px 0 4px}
.callpick button{display:flex; align-items:center; gap:14px; padding:16px; text-align:left;
  border-radius:24px; background:#fff; box-shadow:var(--sh-card)}
.callpick button:active{background:var(--warm-soft)}
.callpick b{display:block; font-size:21px; line-height:1.3}
.callpick small{color:var(--ink-2); font-size:14px}
.callpick .dial{margin-left:auto; width:46px; height:46px; border-radius:50%; background:var(--green);
  display:grid; place-items:center; color:#fff; flex:0 0 auto}
.callpick .dial svg{width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round}
.inapp-tag{display:inline-flex; align-items:center; gap:6px; margin:0 0 10px; padding:4px 11px;
  border-radius:99px; background:var(--green-soft); color:var(--green); font-size:11.5px; font-weight:800}

.entry{flex:1 1 auto; display:flex; flex-direction:column; min-height:100%;

.entry-title{margin:0 0 10px; text-align:center; font-size:17px; line-height:1.35;

.entry-title em{display:block; font-style:normal;

.entry-sub{margin:0 auto 18px; max-width:20em; text-align:center; color:#7C5C43;

.picks{display:grid; gap:11px}
.pick{position:relative; display:flex; align-items:center; gap:13px; width:100%;

.pick.family .face{background:linear-gradient(150deg,#FAD9BC,#F3BE9C)}

.pick b{display:block; font-size:16px; margin-bottom:3px; color:#3E2A1C}

/* =====================================================================
   2. 数据层：Supabase 匿名身份 + 实时同步
      family payload 只保存在 Supabase；浏览器仅记住所选家庭和设备身份。
   ===================================================================== */
var SROLE="alz:device-role", SCODE="alz:device-code", SME="alz:device-member";

function sessionGet(key){
  try{ return sessionStorage.getItem(key); }catch(_error){ return null; }
}
function rememberDevice(role,code,memberId){
  try{
    var previousCode=sessionStorage.getItem(SCODE);
    sessionStorage.setItem(SROLE,role); sessionStorage.setItem(SCODE,code);
    if(memberId) sessionStorage.setItem(SME,memberId);
    else if(previousCode!==code || role!=="family") sessionStorage.removeItem(SME);
  }catch(_error){ /* Device labels are best-effort metadata only. */ }
}
function clearDevice(){
  try{
    sessionStorage.removeItem(SROLE); sessionStorage.removeItem(SCODE); sessionStorage.removeItem(SME);
  }catch(_error){ /* Supabase remains the family-data source of truth. */ }
}
function selectedMemberId(){ return sessionGet(SME); }

var HOME={x:130,y:90}, MPP=13.33;
/* 家的默认位置：广州天河。老人和家的坐标都用经纬度，距离用大圆公式。 */
var HOME_LL={lat:23.1291, lng:113.3644};
function metersPerDegLng(lat){ return 111320*Math.cos(lat*Math.PI/180); }
function haversine(a,b){
  var R=6371000, t=Math.PI/180;
  var dLat=(b.lat-a.lat)*t, dLng=(b.lng-a.lng)*t;
  var h=Math.sin(dLat/2)*Math.sin(dLat/2)
      + Math.sin(dLng/2)*Math.sin(dLng/2)*Math.cos(a.lat*t)*Math.cos(b.lat*t);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}
/* 兼容早期用像素坐标保存的家庭 */
function asLL(p, base){
  if(p && typeof p.lat==="number" && typeof p.lng==="number") return {lat:p.lat, lng:p.lng};
  var b=base||HOME_LL, q=p||{x:HOME.x, y:HOME.y};
  var east=((q.x==null?HOME.x:q.x)-HOME.x)*MPP, north=(HOME.y-(q.y==null?HOME.y:q.y))*MPP;
  return { lat:b.lat + north/111320, lng:b.lng + east/metersPerDegLng(b.lat) };
}
function offsetLL(base, eastM, northM){
  return { lat: base.lat + northM/111320, lng: base.lng + eastM/metersPerDegLng(base.lat) };
}
function homeOf(s){ return asLL(s && s.elder ? s.elder.home : null); }
function locOf(s){ return asLL(s ? s.loc : null, homeOf(s)); }

function newFamily(code, lang){
  return {
    code:code, lang:lang, rev:0,
    setup:false, paired:false,
    elder:{ name:"", phone:"", address:"",
            home:{ lat:HOME_LL.lat, lng:HOME_LL.lng }, radius:"800" },
    people:[],
    facts:[], pending:[],
    timeline:[{t:"09:10", kind:"morning"}],
    call:{ phase:"idle", personId:null, line:-1 },
    lastCaller:null,
    thread:[], askCounts:{},
    loc:{ lat:HOME_LL.lat, lng:HOME_LL.lng },
    guide:{ active:false, step:0, done:false },
    alertCleared:false, locReported:false, homeSet:false
  };
}

var Connection={state:"connecting", authenticated:false, initFailed:false, pendingAction:false};
var Store=null;

function connectionCopy(state){
  var copy=D||I18N[lang]||I18N.zh;
  var keys={connecting:"syncConnecting",loading:"syncLoading",saving:"syncSaving",offline:"syncOffline",error:"syncError",synced:"syncSynced"};
  return copy[keys[state]||"syncError"];
}
function protectedActionSelector(){
  return '[data-f],[data-range],[data-ask],[data-item-do],[data-item-edit],[data-item-skip],[data-item-save],[data-item-cancel],'
    +'[data-go="create"],[data-go="pair"],[data-go="finishSetup"],[data-go="fillElderSample"],[data-go="fillPersonSample"],[data-go="addPerson"],[data-go="clearPending"],'
    +'[data-go="call"],[data-go="answer"],[data-go="decline"],[data-go="hangup"],[data-go="arrived"],'
    +'[data-go="ackHome"],[data-go="walk"],[data-go="goHome"],[data-go="reset"],[data-go="speak"]';
}
function syncActionAvailability(){
  var busy=Connection.pendingAction || Connection.state==="connecting" || Connection.state==="loading";
  var unavailable=!Connection.authenticated || Connection.initFailed;
  var lifecycleSelector='[data-go="create"],[data-go="pair"]';
  var controls=document.querySelectorAll(protectedActionSelector());
  Array.prototype.forEach.call(controls,function(control){
    var canRetry=unavailable && control.matches(lifecycleSelector);
    control.disabled=busy || (unavailable && !canRetry);
  });
}
function setConnectionStatus(state,message,useMessage){
  var allowed={connecting:1,loading:1,saving:1,offline:1,error:1,synced:1};
  Connection.state=allowed[state]?state:"error";
  var status=el("connectionStatus"), text=el("connectionStatusText"), retry=status&&status.querySelector('[data-go="retryConnection"]');
  if(status) status.setAttribute("data-state",Connection.state);
  if(text){
    text.textContent=useMessage&&message?message:connectionCopy(Connection.state);
    text.className=Connection.state==="synced"?"connection-copy visually-hidden":"connection-copy";
  }
  if(retry){
    retry.hidden=!(Connection.initFailed && (Connection.state==="error" || Connection.state==="offline"));
    retry.textContent=(D||I18N[lang]||I18N.zh).syncRetry;
  }
  syncActionAvailability();
}
/* 这台设备当前选择的角色优先。数据库里的成员角色只在没有本地记录时兜底，
   因为 join_family 对已存在的成员不会改角色，同一设备换身份时会拿到旧值。 */
function storeRole(){ return sessionGet(SROLE) || (Store&&Store.role?Store.role():null); }
function reportStoreError(error){
  var copy=D||I18N[lang]||I18N.zh;
  if(error&&error.code==="REVISION_CONFLICT") setConnectionStatus("error",copy.syncConflict,true);
  else if(Connection.state!=="offline") setConnectionStatus("error");
  return null;
}
function persistUpdate(mutator){
  return Store.update(mutator).catch(function(error){
    reportStoreError(error);
    throw error;
  });
}
function queueUpdate(mutator){ void persistUpdate(mutator).catch(function(){}); }
async function runPendingAction(action){
  if(Connection.pendingAction) return null;
  Connection.pendingAction=true; syncActionAvailability();
  try{ return await action(); }
  finally{ Connection.pendingAction=false; syncActionAvailability(); }
}

try{
  var SupabaseClient=window.supabase.createClient(
    window.SUPABASE_CONFIG.url,
    window.SUPABASE_CONFIG.publishableKey
  );
  Store=window.createSupabaseStore({
    client:SupabaseClient,
    newFamily:newFamily,
    storage:window.localStorage,
    onStatus:setConnectionStatus
  });
}catch(_error){
  Connection.initFailed=true;
  setConnectionStatus("error");
}

function el(id){ return document.getElementById(id); }
function fill(s,o){ return String(s).replace(/\{(\w+)\}/g,function(_,k){ return o[k]!==undefined?o[k]:"{"+k+"}"; }); }
function avatarHTML(p, cls, extra){
  var c="avatar "+(cls||"");
  if(p && p.photo) return '<span class="'+c+' photo" style="background-image:url('+p.photo+')"'
    + (extra||"") + '></span>';
  return '<span class="'+c+'"'+(extra||"")+'>'+esc(initial(p?p.nick:""))+'</span>';
}
function initial(n){
  n=(n||"").trim(); if(!n) return "?";
  return /[一-龥]/.test(n) ? n.charAt(n.length-1) : n.charAt(0).toUpperCase();
}
function focusPerson(s){
  if(!s || !s.people.length) return {nick:"",relation:"",recent:"",hint:""};
  if(s.lastCaller){
    for(var i=0;i<s.people.length;i++) if(s.people[i].id===s.lastCaller) return s.people[i];
  }
  return s.people[0];
}
function tp(str, s){
  str=String(str);
  if(str.indexOf("{")<0) return str;
  s=s||St;
  if(!s) return str;
  var p=focusPerson(s);
  return str.replace(/\{(nick|elder|rel|code)\}/g, function(_,k){
    if(k==="nick") return p.nick||"";
    if(k==="elder") return s.elder.name||"";
    if(k==="rel") return p.relation||"";
    return s.code||"";
  });
}
function esc(v,s){
  return tp(v,s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; });
}
function distOf(s){ return Math.round(haversine(locOf(s), homeOf(s))); }
function rangeM(s){ return parseInt(s.elder.radius,10); }
function isOut(s){ return distOf(s)>rangeM(s); }
function clockNow(){ var d=new Date(); return d.getHours()+":"+("0"+d.getMinutes()).slice(-2); }
function waveEl(cls){ var h='<span class="wave '+(cls||"")+'">'; for(var i=0;i<7;i++) h+='<i style="animation-delay:'+(i*.09)+'s"></i>'; return h+'</span>'; }

var Maps={ state:"idle", waiters:[], host:{}, inst:{}, circle:{}, homeMk:{}, elderMk:{} };
function mapsKey(){ return (window.MAPS_CONFIG && window.MAPS_CONFIG.key) || ""; }
function loadMaps(){
  if(Maps.state==="ready") return Promise.resolve(true);
  if(Maps.state==="failed") return Promise.resolve(false);
  if(Maps.state==="loading") return new Promise(function(r){ Maps.waiters.push(r); });
  if(!mapsKey()){ Maps.state="failed"; return Promise.resolve(false); }
  Maps.state="loading";
  return new Promise(function(resolve){
    Maps.waiters.push(resolve);
    function done(ok){
      Maps.state = ok ? "ready" : "failed";
      Maps.waiters.splice(0).forEach(function(w){ w(ok); });
    }
    var timer=setTimeout(function(){ done(false); }, 9000);
    window.__mapsReady=function(){ clearTimeout(timer); done(!!(window.google && window.google.maps)); };
    var sc=document.createElement("script");
    sc.async=true;
    sc.src="https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(mapsKey())
         + "&callback=__mapsReady&loading=async";
    sc.onerror=function(){ clearTimeout(timer); done(false); };
    document.head.appendChild(sc);
  });
}

var MAP_STYLE=[
  {featureType:"poi.business", stylers:[{visibility:"off"}]},
  {featureType:"transit", elementType:"labels.icon", stylers:[{visibility:"off"}]}
];

function mapHost(kind){
  if(!Maps.host[kind]){

}

/* 示意图降级：把经纬度投影成 260x150 的画布 */
function schematicSVG(kind){

  var north=(here.lat-home.lat)*111320;
  var ex=Math.max(8,Math.min(252, cx+east*ppm)), ey=Math.max(8,Math.min(142, cy-north*ppm));

    + '<circle cx="74" cy="40" r="3.2" fill="#D19A55"/><text x="80" y="43" font-size="7.5" fill="#8B8791">'+esc(g[0].lm)+'</text>'
    + '<circle cx="196" cy="116" r="3.2" fill="#6E93CE"/><text x="150" y="128" font-size="7.5" fill="#8B8791">'+esc(g[1].lm)+'</text>'

    + '<text x="'+(cx+10)+'" y="'+(cy+4)+'" font-size="8.5" fill="#5E9E82" font-weight="700">'+esc(D.mapHome)+'</text>';

    h+='<circle cx="'+ex.toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="8" fill="'+(out?"#C9646B":"#D19A55")+'" opacity=".22"/>'
     + '<circle cx="'+ex.toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="5" fill="'+(out?"#C9646B":"#D19A55")+'" stroke="#fff" stroke-width="2"/>';

function mountMaps(){
  ["picker","view"].forEach(function(kind){
    var slot=document.querySelector('[data-gmap="'+kind+'"]');
    if(!slot) return;
    loadMaps().then(function(ok){
      var still=document.querySelector('[data-gmap="'+kind+'"]');
      if(still!==slot) return;
      if(!ok){ slot.insertAdjacentHTML("afterbegin", schematicSVG(kind)); return; }
      if(kind==="picker") seedHomeFromDevice();
      var host=mapHost(kind);
      var moved = host.parentNode!==slot;
      if(moved) slot.insertBefore(host, slot.firstChild);
      syncMap(kind);
      if(moved && Maps.inst[kind]){
        // 重新挂到新的容器之后要让地图重算尺寸，否则会留白
        requestAnimationFrame(function(){
          if(!Maps.inst[kind]) return;
          window.google.maps.event.trigger(Maps.inst[kind],"resize");
          Maps.inst[kind].setCenter(homeOf(St));
        });
      }
    });
  });
}

function syncMap(kind){
  if(Maps.state!=="ready" || !St) return;
  var g=window.google.maps, host=Maps.host[kind];
  if(!host || !host.isConnected) return;
  var home=homeOf(St), r=rangeM(St);
  var map=Maps.inst[kind];
  if(!map){
    map=new g.Map(host,{
      center:home, zoom:15, disableDefaultUI:true, gestureHandling:"greedy",
      clickableIcons:false, styles:MAP_STYLE
    });
    Maps.inst[kind]=map;
    Maps.homeMk[kind]=new g.Marker({map:map, position:home, draggable:kind==="picker", title:D.mapHome});
    Maps.circle[kind]=new g.Circle({map:map, center:home, radius:r,
      strokeColor:"#6E93CE", strokeOpacity:.9, strokeWeight:1.6,
      fillColor:"#6E93CE", fillOpacity:.10, clickable:false});
    if(kind==="picker"){
      Maps.homeMk[kind].addListener("dragend", function(ev){ commitHome(ev.latLng.lat(), ev.latLng.lng()); });
      map.addListener("click", function(ev){ commitHome(ev.latLng.lat(), ev.latLng.lng()); });
    }else{
      Maps.elderMk[kind]=new g.Marker({map:map, position:locOf(St), title:St.elder.name,
        icon:{path:g.SymbolPath.CIRCLE, scale:7, fillColor:"#D19A55", fillOpacity:1,
              strokeColor:"#fff", strokeWeight:2.5}});
    }
  }else{
    g.event.trigger(map,"resize");
  }
  Maps.homeMk[kind].setPosition(home);
  Maps.circle[kind].setCenter(home);
  Maps.circle[kind].setRadius(r);
  if(kind==="view" && Maps.elderMk[kind]){
    var here=locOf(St), out=isOut(St);
    Maps.elderMk[kind].setPosition(here);
    Maps.elderMk[kind].setIcon({path:g.SymbolPath.CIRCLE, scale:7,
      fillColor: out?"#C9646B":"#D19A55", fillOpacity:1, strokeColor:"#fff", strokeWeight:2.5});
    map.setCenter(out ? {lat:(here.lat+home.lat)/2, lng:(here.lng+home.lng)/2} : home);
  } else if(kind==="picker"){
    map.setCenter(home);
  }
  map.setZoom(r>1200?14:(r>600?15:16));
}

function commitHome(lat,lng){
  queueUpdate(function(s){
    s.elder.home={lat:lat, lng:lng};
    s.homeSet=true;
    if(!s.locReported && !s.guide.active && !s.guide.done) s.loc={lat:lat, lng:lng};
  });
}

function seedHomeFromDevice(){
  if(!St || St.homeSet || Geo.seededHome || !navigator.geolocation) return;
  Geo.seededHome=true;

/* =====================================================================
   3c. 天气：Open-Meteo 公开接口，不需要 key。取不到就不显示这一块。
   ===================================================================== */
var Weather={ state:"idle", data:null, at:0, key:"" };

function weatherBucket(code){
  if(code===0 || code===1) return "clear";
  if(code===2) return "cloud";
  if(code===3) return "overcast";
  if(code===45 || code===48) return "fog";
  if(code>=95) return "storm";
  if(code>=71 && code<=77) return "snow";
  if(code>=80 && code<=82) return "shower";
  if(code>=51) return "rain";
  return "cloud";
}
function weatherEmoji(b){
  return {clear:"☀️",cloud:"⛅",overcast:"☁️",fog:"🌫️",rain:"🌧️",shower:"🌦️",snow:"❄️",storm:"⛈️"}[b] || "⛅";
}
function weatherTip(temp, bucket){
  if(bucket==="rain" || bucket==="shower" || bucket==="storm") return D.eTipRain;
  if(temp<10) return D.eTipCold;
  if(temp<19) return D.eTipCool;
  if(temp<=26) return D.eTipMild;
  return D.eTipWarm;
}
function ensureWeather(){
  if(!St) return;
  var home=homeOf(St);
  var key=home.lat.toFixed(3)+","+home.lng.toFixed(3);
  var fresh = Weather.data && Weather.key===key && (Date.now()-Weather.at) < 30*60*1000;
  if(fresh || Weather.state==="loading") return;
  Weather.state="loading"; Weather.key=key;
  var url="https://api.open-meteo.com/v1/forecast?latitude="+home.lat.toFixed(4)
        + "&longitude="+home.lng.toFixed(4)
        + "&current=temperature_2m,weather_code&timezone=auto";
  fetch(url).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
    var cur = j && j.current;
    if(cur && typeof cur.temperature_2m==="number"){
      Weather.data={ temp:Math.round(cur.temperature_2m), bucket:weatherBucket(cur.weather_code) };
      Weather.at=Date.now(); Weather.state="ready";
      if(App.route==="elder") render(St);
    } else { Weather.state="failed"; }
  }).catch(function(){ Weather.state="failed"; });
}

/* =====================================================================
   3d. AI：统一走服务端 /api/ai，key 不进浏览器。
       任何一步失败都返回 null，调用方回落到不依赖模型的行为。
   ===================================================================== */
var AI={ endpoint:"/api/ai", provider:null, lastError:null };

function aiAsk(opts){
  var ctrl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, opts.timeout || 15000);
  return fetch(AI.endpoint,{
    method:"POST",
    headers:{"content-type":"application/json"},
    body:JSON.stringify({ system:opts.system, user:opts.user, json:!!opts.json }),
    signal: ctrl ? ctrl.signal : undefined
  }).then(function(r){
    if(!r.ok) throw new Error("AI_HTTP_"+r.status);
    return r.json();
  }).then(function(d){
    AI.provider=d.provider||null; AI.lastError=null;
    return (d && typeof d.text==="string") ? d.text : null;
  }).catch(function(e){
    AI.lastError=String(e && e.message || e);
    return null;
  }).finally(function(){ clearTimeout(timer); });
}

/* 模型偶尔会在 JSON 外面包一层反引号，这里容错解析 */
function aiJSON(text){
  if(!text) return null;
  var t=String(text).trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
  try{ return JSON.parse(t); }catch(_e){}
  var a=t.indexOf("{"), b=t.lastIndexOf("}");
  if(a>=0 && b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(_e2){} }
  return null;
}

/* =====================================================================
   3e. 语音转写：只保留真实识别结果，不自动注入示例内容
   ===================================================================== */
var Speech={ rec:null, active:false };
function speechSupported(){
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}
function startSpeech(onText, onFail){
  var Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Ctor){ onFail("nomic"); return false; }
  try{
    var rec=new Ctor();
    rec.lang = (St && St.lang==="en") ? "en-US" : "zh-CN";
    rec.interimResults=true; rec.continuous=true; rec.maxAlternatives=1;
    var buf="";
    rec.onresult=function(ev){
      var interim="";
      for(var i=ev.resultIndex;i<ev.results.length;i++){
        var r=ev.results[i];
        if(r.isFinal) buf += r[0].transcript;
        else interim += r[0].transcript;
      }
      onText(buf+interim, false);
    };
    rec.onerror=function(){ Speech.active=false; onFail("error"); };
    rec.onend=function(){ Speech.active=false; onText(buf, true); };
    Speech.rec=rec; Speech.active=true;
    rec.start();
    return true;
  }catch(_e){ onFail("error"); return false; }
}
function stopSpeech(){
  try{ if(Speech.rec && Speech.active) Speech.rec.stop(); }catch(_e){}
  Speech.active=false;
}

/* =====================================================================
   3f. 定位：老人端上报自己的真实位置，家人端只读。
       没有授权或拿不到定位时保持上一次的位置，不伪造。
   ===================================================================== */
var Geo={ watchId:null, lastAt:0, denied:false };

function startGeo(){
  if(Geo.watchId!==null || !navigator.geolocation) return;
  Geo.watchId = navigator.geolocation.watchPosition(function(pos){
    var now=Date.now();
    if(now - Geo.lastAt < 8000) return;
    var next={ lat:pos.coords.latitude, lng:pos.coords.longitude };
    if(!St) return;
    /* 没挪动就不写库，省掉无意义的同步 */
    if(St.locReported && haversine(locOf(St), next) < 12) return;
    Geo.lastAt=now; Geo.denied=false;
    queueUpdate(function(s){
      s.loc=next; s.locReported=true; s.locAt=now;
      if(!s.guide.active && !s.guide.done && distOf(s) > rangeM(s)){
        s.guide.active=true; s.guide.step=0; s.alertCleared=false;
        s.timeline.push({ t:clockNow(), kind:"guide" });
      }
    });
  }, function(){
    Geo.denied=true;
  }, { enableHighAccuracy:true, maximumAge:15000, timeout:20000 });
}
function stopGeo(){
  if(Geo.watchId!==null && navigator.geolocation) navigator.geolocation.clearWatch(Geo.watchId);
  Geo.watchId=null;
}

/* 老人问了记忆里没有的问题，等家人补一句。放在首页，家人一进来就看到。 */
/* 同一个问题她可能问很多次，家人只需要看到一条，次数作为附注。 */
function pendingGrouped(){
  var order=[], count={};
  for(var i=0;i<St.pending.length;i++){
    var a=St.pending[i].ask;
    if(count[a]===undefined){ count[a]=0; order.push(a); }
    count[a]++;
  }
  return order.map(function(a){ return { ask:a, n:count[a] }; });
}

    if(f.type==="fact" && f.status==="done") return f;
  }
  return null;
}
function factLine(f){
  if(f.type==="todo") return todoLine(f);
  return f.text!=null ? f.text : tp(D[f.key]);
}
/* 待办由时间、地点、事情三段组成，缺哪段就跳过哪段 */
function todoLine(t){
  var parts=[t.when, t.where, t.what].filter(function(v){ return v && String(v).trim(); });
  if(parts.length) return parts.join(" · ");
  return t.text!=null ? t.text : tp(D[t.key]);
}
function todoWhat(t){
  if(t.what && t.what.trim()) return t.what.trim();
  return t.text!=null ? t.text : tp(D[t.key]);
}
function todoMeta(t){
  return [t.when, t.where].filter(function(v){ return v && String(v).trim(); }).join(" · ");
}
/* ---- 日期工具：全部用 YYYY-MM-DD 字符串比较，避免时区问题 ---- */
function pad2(n){ return (n<10?"0":"")+n; }
function keyOf(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function todayKey(){ return keyOf(new Date()); }
function keyParts(k){ var a=String(k||"").split("-"); return {y:+a[0], m:+a[1], d:+a[2]}; }
function ymOf(k){ var p=keyParts(k); return p.y+"-"+pad2(p.m); }
function shiftMonth(ym, delta){
  var a=String(ym).split("-"), y=+a[0], m=+a[1]-1+delta;
  y += Math.floor(m/12); m=((m%12)+12)%12;
  return y+"-"+pad2(m+1);
}
function monthCells(ym){
  var a=String(ym).split("-"), y=+a[0], m=+a[1]-1;
  var first=new Date(y,m,1), start=new Date(y,m,1-first.getDay());
  var out=[];
  for(var i=0;i<42;i++){
    var d=new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
    out.push({ key:keyOf(d), day:d.getDate(), inMonth:d.getMonth()===m });
    if(i>=34 && d.getMonth()!==m && (i+1)%7===0) break;
  }
  return out;
}

/* ---- 待办：日期、重复、按天完成 ---- */
function todoDate(t){ return t.date || todayKey(); }
function todoOccursOn(t, key){
  if(t.repeat==="daily") return key >= todoDate(t);
  return todoDate(t)===key;
}
function todoDoneOn(t, key){
  if(t.done && typeof t.done==="object") return !!t.done[key];
  return !!t.checked && todoDate(t)===key;   // 兼容早期只有一个布尔值的数据
}
function todosOn(s, key){
  var out=[], list=allTodos(s||St);
  for(var i=0;i<list.length;i++) if(todoOccursOn(list[i], key)) out.push(list[i]);
  return out;
}
function markTodoDone(s, id, key, value){
  for(var i=0;i<s.facts.length;i++){
    if(s.facts[i].id!==id) continue;
    var t=s.facts[i];
    if(!t.done || typeof t.done!=="object") t.done={};
    if(value) t.done[key]=true; else delete t.done[key];
    delete t.checked;
    return;
  }
}

function newTodo(){
  return { id:"t"+Date.now()+Math.floor(Math.random()*100), type:"todo", origin:"manual",
    key:"factPill", text:null, when:"", where:"", what:"",

    status:"done" };
}
/* 通话抽取出来的条目要家人确认；家人自己加的待办直接生效。两者靠 origin 区分。 */
function callItems(s){
  var src=(s||St).facts||[], out=[];
  for(var i=0;i<src.length;i++) if(src[i].origin==="call") out.push(src[i]);
  return out;
}
function hasPendingCallItem(s){
  var list=callItems(s);
  for(var i=0;i<list.length;i++) if(list[i].status==="open"||list[i].status==="editing") return true;
  return false;
}
function allTodos(s){
  var out=[]; var src=(s||St).facts||[];
  for(var i=0;i<src.length;i++) if(src[i].type==="todo" && src[i].status==="done") out.push(src[i]);
  return out;
}
/* 老人端「接下来」取第一条还没做完的；都做完了显示最后一条 */
function todayTodoOf(s){
  var key=todayKey(), list=todosOn(s, key), done=null;
  for(var i=0;i<list.length;i++){ if(!todoDoneOn(list[i], key)) return list[i]; done=list[i]; }
  return done;
}

function dayParts(){
  var now=new Date(), h=now.getHours();
  return {
    week: D.eWeekdays[now.getDay()],
    date: fill(D.eDateFmt,{m:now.getMonth()+1, d:now.getDate()}),
    part: h<12 ? D.eMorning : (h<18 ? D.eAfternoon : D.eEvening)
  };
}

function render(s){
  if(s!==undefined) St=s;
  D = I18N[St ? St.lang : lang] || I18N.en;

  if(typing){ patchLight(); return; }

  var screen=el("screen"), view=el("view"), body="", isElder=false, chrome="";
  el("clock").textContent = clockNow();

  if(App.route==="entry")            body=viewEntry();
  else if(App.route==="familyStart") body=viewFamilyStart();
  else if(App.route==="obElder")     body=viewObElder();
  else if(App.route==="obMe")        body=viewObMe();
  else if(App.route==="code")        body=viewCode();
  else if(App.route==="join")        body=viewJoin();
  else if(App.route==="elder"){
    isElder=true;
    var sc=elderScreen();
    body = sc==="paired"?viewPaired() : sc==="ringing"?viewRinging() : sc==="calling"?viewCalling()
         : sc==="talking"?viewTalking() : sc==="pick"?viewPick() : sc==="qa"?viewQa()
         : sc==="esettings"?viewESettings()
         : sc==="guide"?viewGuide() : sc==="arrived"?viewArrived() : viewStandby();
  }
  else if(App.route==="family"){
    if(St && St.call.phase==="ringing" && callDir(St)==="out"){ App.tab=0; App.editingPerson=null; }
    if(!App.cal.ym){ App.cal.sel=todayKey(); App.cal.ym=ymOf(App.cal.sel); }
    body = (App.tab===0?tabHome() : App.tab===1?tabAlerts() : App.tab===2?tabTodos() : tabPeople());
    if(App.tab===2) body += '<button class="fab" data-go="addTodo">+</button>';
    /* 老人走出范围时自动弹一次，关掉之后不再自动弹 */
    var st2=alertState();
    if(st2==="on" && App.alertSeen!=="on"){ App.alertOpen=true; App.alertSeen="on"; }
    if(st2==="none") App.alertSeen="";
    if(App.alertOpen && st2!=="none" && !St.alertCleared) body += alertSheet();
  }

  if(isElder) startGeo(); else stopGeo();
  screen.classList.toggle("elder", isElder);
  view.classList.toggle("pad0", App.route==="family");
  view.className = (isElder ? "e-view" : "view") + (App.route==="family" ? " pad0" : "");
  view.innerHTML = body;

  /* 家人端底部 tab bar 在 view 之外 */
  var old=screen.querySelector(".tabbar"); if(old) old.remove();
  if(App.route==="family" && !App.editingPerson) screen.insertAdjacentHTML("beforeend", tabbar());

  /* 手机框外的演示外壳 */
  var lab=el("deviceLabel");
  var who = App.route==="elder" ? D.labelElder : (App.route==="family"||App.route==="obElder"||App.route==="obMe"||App.route==="code" ? D.labelFamily : D.labelEntry);
  lab.className="device-label "+(App.route==="elder"?"elder":(App.route==="family"?"family":""));
  lab.querySelector("span").textContent = who + (St && St.code ? " · " + St.code : "");

  /* 只在还没进入家庭时提供语言入口；进入之后语言在「家人 → 设置」里改 */
  chrome = (App.route==="entry"||App.route==="familyStart"||App.route==="join")
    ? '<button class="chip" data-go="lang">'+esc(D.langBtn)+'</button>' : "";
  el("chrome").innerHTML=chrome;
  el("hintLine").textContent = App.route==="elder" ? D.hintElder
    : (App.route==="family" ? D.hintFamily : D.hintEntry);

  bindInputs();
  bindRange();
  mountMaps();
  var th=view.querySelector(".thread"); if(th) th.scrollTop=th.scrollHeight;
  syncSubs();
  setConnectionStatus(Connection.state);
}

/* 滑块与数字框联动：拖动时只改画面，松手才写库，避免每一格都发一次请求 */
var rangeTimer=null;
function applyRange(v, persist){
  v=Math.max(200, Math.min(2000, Math.round((parseInt(v,10)||800)/10)*10));
  var sl=el("rangeSlider"), nu=el("rangeNum");
  if(sl && document.activeElement!==sl) sl.value=v;
  if(nu && document.activeElement!==nu) nu.value=v;
  if(sl) sl.style.setProperty("--pct", Math.round((v-200)/1800*100)+"%");
  if(St) St.elder.radius=String(v);
  if(Maps.state==="ready" && Maps.circle.picker) Maps.circle.picker.setRadius(v);
  else { var box=document.querySelector('[data-gmap="picker"] svg'); if(box) syncSchematic("picker"); }
  if(persist){
    clearTimeout(rangeTimer);
    rangeTimer=setTimeout(function(){ queueUpdate(function(x){ x.elder.radius=String(v); }); }, 260);
  }
  return v;
}
function syncSchematic(kind){
  var slot=document.querySelector('[data-gmap="'+kind+'"]');
  if(!slot) return;
  var old=slot.querySelector("svg"); if(old) old.remove();
  slot.insertAdjacentHTML("afterbegin", schematicSVG(kind));
}
function bindRange(){
  var sl=el("rangeSlider"), nu=el("rangeNum");
  if(sl){
    sl.addEventListener("input", function(){ applyRange(sl.value, false); });
    sl.addEventListener("change", function(){ applyRange(sl.value, true); });
  }
  if(nu){
    nu.addEventListener("input", function(){ applyRange(nu.value, true); });
    nu.addEventListener("blur", function(){ nu.value=applyRange(nu.value, true); });
  }
}

function patchLight(){
  var av=document.querySelector('[data-bind="av"]');
  if(av){ var p=editTarget(); if(p) av.textContent=initial(p.nick); }
}

function bindPendingAnswers(){
  var ns=el("view").querySelectorAll("[data-ans]");
  Array.prototype.forEach.call(ns,function(n){
    n.addEventListener("input",function(){
      App.pendDraft[n.getAttribute("data-ans")]=n.value;   /* 只记在本地，不写库 */
    });
  });
}

function bindTodos(){
  var ns=el("view").querySelectorAll("[data-todo]");
  Array.prototype.forEach.call(ns,function(n){
    n.addEventListener("input",function(){
      var parts=n.getAttribute("data-todo").split("|");
      typing=true;
      queueUpdate(function(s){
        for(var i=0;i<s.facts.length;i++) if(s.facts[i].id===parts[0]){
          s.facts[i][parts[1]]=n.value;
          if(parts[1]==="what") s.facts[i].text=null;
        }
      });
      typing=false;
    });
  });
}

function bindInputs(){
  bindTodos();
  bindPendingAnswers();
  var ns=el("view").querySelectorAll("[data-f]");
  Array.prototype.forEach.call(ns,function(n){
    n.addEventListener("input",function(){
      var path=n.getAttribute("data-f");
      typing=true;
      queueUpdate(function(s){ setPath(s,path,n.value); });
      typing=false;
      var tag=n.parentNode.querySelector(".tag");
      if(tag){
        var k=path.split(".").pop();
        if(path==="elder.name") k="elderName";
        if(path==="elder.phone") k="elderPhone";
        tag.hidden = (n.value !== SEED[St.lang][k]);
      }
    });
  });

/* 把这通电话的内容交给模型，抽成待家人确认的事实与待办。
   抽取失败就用默认的两条，演示流程不会断。 */
async function extractCallItems(){
  if(!St) return fallbackItems();
  var p=focusPerson(St), lines=[];
  for(var i=0;i<D.callLines.length;i++){
    var L=D.callLines[i];
    lines.push((L[0]==="me" ? St.elder.name : p.nick) + "：" + tp(L[1]));
  }
  var zh = St.lang!=="en";
  var text = await aiAsk({
    json:true, timeout:14000,
    system: zh
      ? "你在帮阿尔茨海默患者的家人整理通话内容。只抽取通话里明确说过的信息，不要推断，不要补充。只输出 JSON。"
      : "You help the family of a person with Alzheimer's summarise a phone call. Only extract what was explicitly said. Do not infer or add anything. Output JSON only.",
    user: (zh
      ? "这是一段通话记录：\n" + lines.join("\n") +
        "\n\n抽成 JSON：{\"items\":[" +
        "{\"type\":\"fact\",\"text\":\"一句话，20字以内\"}," +
        "{\"type\":\"todo\",\"date\":\"YYYY-MM-DD\",\"when\":\"时间，没说就留空\",\"where\":\"地点，没说就留空\",\"what\":\"要做的事，10字以内\"}" +
        "]}。fact 是关于人或事的事实，todo 是要提醒老人做的事。最多 3 条。用中文，主语用具体的人名。" +
        "不要推断没说过的时间和地点。今天是 " + todayKey() + "，请把「周六」「明天」这类说法换算成具体日期；没提到日期就用今天。"
      : "Here is a call transcript:\n" + lines.join("\n") +
        "\n\nExtract JSON: {\"items\":[" +
        "{\"type\":\"fact\",\"text\":\"one short sentence\"}," +
        "{\"type\":\"todo\",\"date\":\"YYYY-MM-DD\",\"when\":\"time, empty if not said\",\"where\":\"place, empty if not said\",\"what\":\"what to do, short\"}" +
        "]}. A fact is about a person or an event; a todo is something to remind her to do. At most 3. " +
        "Do not invent a time or place that was not said. Today is " + todayKey() +
        "; convert wording like \"Saturday\" or \"tomorrow\" into a real date, and use today when no date is mentioned. " +
        "Answer in English.")
  });

  var got=aiJSON(text);
  var arr = got && Array.isArray(got.items) ? got.items : null;
  if(!arr || !arr.length) return fallbackItems();

  var out=[];
  for(var j=0;j<arr.length && out.length<3;j++){
    var it=arr[j];
    if(!it) continue;
    var hasText = typeof it.text==="string" && it.text.trim();
    var hasWhat = typeof it.what==="string" && it.what.trim();
    if(!hasText && !hasWhat) continue;
    if(it.type==="todo"){
      out.push({
        id:"ai"+Date.now()+j, type:"todo", origin:"call", key:"factPill", text:null,
        status:"open", done:{}, repeat:"none",
        date: /^\d{4}-\d{2}-\d{2}$/.test(String(it.date||"")) ? it.date : todayKey(),
        when:String(it.when||"").trim().slice(0,24),
        where:String(it.where||"").trim().slice(0,24),
        what:String(it.what||it.text||"").trim().slice(0,40)
      });
    } else {
      out.push({ id:"ai"+Date.now()+j, type:"fact", origin:"call", key:"factVisit",
        text:String(it.text||"").trim().slice(0,80), status:"open" });
    }
  }
  return out.length ? out : fallbackItems();
}

var endingCall=false;

}

function setLoc(lat,lng){
